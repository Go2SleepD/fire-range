<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07376c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Fire Range · Tap</title>
  <!-- errors on screen: a crash or a blocked module shows up as a red box instead of an empty range -->
  <script>
    (function () {
      function box() {
        var b = document.getElementById('tt-error');
        if (!b) {
          b = document.createElement('pre');
          b.id = 'tt-error';
          (document.body || document.documentElement).appendChild(b);
        }
        return b;
      }
      function say(text) { box().textContent += text + '\n'; }
      addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') say('Не загрузился скрипт ' + (t.src || ''));
        else say((e.message || 'ошибка') + (e.filename ? ' — ' + e.filename.split('/').pop() + ':' + e.lineno : '') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
      }, true);
      addEventListener('unhandledrejection', function (e) { say('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      addEventListener('DOMContentLoaded', function () {
        if (location.protocol === 'file:' && document.querySelector('script[type="module"][src]')) {
          say('tap.html двойным кликом не запускается: браузер не грузит модули с file://.\n' +
            'Запусти «npm run dev» и открой /tap.html, или собери «node tools/standalone.mjs tap» и открой tap-play.html.');
        }
      });
    })();
  </script>
  <!-- lets the sources run from any static server without npm; Vite resolves `three` from node_modules instead -->

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" crossorigin src="./assets/tap-DQ5VQQQX.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/piggy-DtGJnnoV.js">
  <link rel="stylesheet" crossorigin href="./assets/tap-CSA3sYeI.css">
</head>
<body>
  <div id="tt-app" data-section="battle">
    <div id="tt-battle">
      <canvas id="tt-scene" aria-label="Тир"></canvas>
      <div id="tt-top">
        <button class="tt-wallet" aria-label="Монеты"><i class="tt-coin"></i><b id="tt-coins">0</b></button>
        <div id="tt-bp-chip" hidden><b id="tt-bp">0</b></div>
        <div id="tt-pt-chip" hidden><b id="tt-pt">0</b></div>
        <div id="tt-boost" hidden><b id="tt-boost-t"></b></div>
      </div>
      <div id="tt-stage"><b id="tt-stage-n"></b><button id="tt-boss-btn" hidden></button><small id="tt-floor" hidden></small><div id="tt-kills" hidden></div><small id="tt-clock" hidden></small><small id="tt-teaser" hidden></small></div>
      <div id="tt-side"><button id="tt-settings-btn" aria-label="Профиль"></button><button id="tt-login-btn" hidden></button><button id="tt-daily-btn" hidden></button><button id="tt-tourney-btn" hidden></button></div>
      <button id="tt-cheat-btn" hidden aria-label="Отладка"></button>
      <div id="tt-pops" aria-hidden="true"></div>
      <div id="tt-aim-ui" aria-hidden="true"><div id="tt-weak-spot" hidden></div><div id="tt-reticle" hidden><i></i><i></i><i></i><i></i></div><div id="tt-aim-hint" hidden>Удерживай и двигай палец</div></div>
      <div id="tt-battle-actions">
        <button id="tt-quest"><span class="qi"></span><div class="qbody"><span class="qt"></span></div><span class="qp"></span><span class="qr"></span><span class="qclaim" hidden></span></button>
        <div id="tt-skills"><div class="tt-mana" id="tt-mana" hidden><i id="tt-mana-fill"></i><span id="tt-mana-text"></span></div><div id="tt-skill-row"></div></div>
        <div id="tt-battle-buy"></div>
      </div>
      <div id="tt-cheats" hidden></div>
    </div>
    <div id="tt-overlay"><div id="tt-titan" class="none"><div id="tt-titan-name" hidden></div><div id="tt-target-reward" hidden></div><div class="tt-hp"><i id="tt-hp-trail"></i><i id="tt-hp-fill"></i><span id="tt-hp-text"></span></div><div id="tt-timer" hidden><i id="tt-timer-fill"></i><span id="tt-timer-text"></span></div></div></div>
    <main id="tt-page" hidden><header id="tt-page-head"></header><div id="tt-list"></div></main>
    <div id="tt-dock"><nav id="tt-tabs" aria-label="Разделы игры"></nav></div>
    <div id="tt-toasts" role="status" aria-live="polite"></div>
    <div id="tt-modal" hidden></div>
    <div id="tt-fade"><b></b></div>
  </div>
</body>
</html>
