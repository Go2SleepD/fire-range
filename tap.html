<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0c1730" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Fire Range · Tap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
/* The tap game's screen (tap.html, docs/tt2-pivot.md): a portrait column — the range with its bars on top, the quest
   bar and the dock with tabs below. On a wide screen the column stands in the middle. */
:root {
  --navy: #0c1730;
  --deep: #070e20;
  --card: #213a6c;
  --line: #31538f;
  --ink: #f6f0e4;
  --muted: #9fb3d9;
  --gold: #ffc533;
  --red: #ff5d5d;
  --green: #45cf6c;
  --k: 1;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at 50% 30%, #13254a, #040812 70%);
  color: var(--ink);
  font-family: 'Fredoka', 'Baloo 2', system-ui, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; border: 0; cursor: pointer; padding: 0; color: inherit; background: none; }
[hidden] { display: none !important; }

#tt-app {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100vw, 56vh);
  display: flex;
  flex-direction: column;
  background: var(--navy);
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
}
#tt-battle { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: none; }
#tt-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#tt-overlay { position: absolute; inset: 0; z-index: 4; pointer-events: none; }

/* ------------------------------------------------------------ top: wallet, blueprints, cheats */
#tt-top {
  position: absolute;
  top: calc(6px + env(safe-area-inset-top, 0px));
  left: 8px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  z-index: 3;
  pointer-events: none;
}
.tt-wallet {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 12px 3px 4px;
  border-radius: 999px;
  background: rgba(7, 14, 32, 0.78);
  border: 2px solid #2a4677;
  font-weight: 700;
  font-size: 18px;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
}
.tt-wallet.bp { font-size: 16px; }
.tt-wallet.bump { animation: tt-bump 0.25s ease-out; }
@keyframes tt-bump { 50% { transform: scale(1.12); } }
.tt-coin {
  display: inline-block;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #fff2b0 0 18%, #ffd23f 30%, #f2a60e 70%, #c97d04 100%);
  box-shadow: inset 0 -2px 0 rgba(120, 60, 0, 0.45), 0 1px 0 rgba(0, 0, 0, 0.35);
  vertical-align: middle;
  flex: none;
}
.tt-bpi { font-style: normal; font-size: 16px; }
/* «золотой патрон»: a little brass round standing up */
.tt-pti {
  display: inline-block;
  width: 10px;
  height: 20px;
  border-radius: 5px 5px 2px 2px / 7px 7px 2px 2px;
  background: linear-gradient(90deg, #b8780a, #ffd86a 45%, #e7a92a 70%, #9a6106);
  box-shadow: inset 0 -5px 0 #8a5a12, 0 1px 0 rgba(0, 0, 0, 0.35);
  vertical-align: middle;
  flex: none;
}
.tt-wallet.pt { font-size: 16px; }
.tt-wallet.boost { font-size: 14px; color: #ffe08a; border-color: #b48a2a; }
/* a skin's colours on its shop card */
.tt-swatch { display: block; width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--a) 0 62%, var(--b) 62% 100%); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.18); }
.tt-card.skin.on { box-shadow: inset 0 0 0 2px #ffd23f; }
.tt-icon-btn {
  position: absolute;
  top: calc(6px + env(safe-area-inset-top, 0px));
  right: 8px;
  z-index: 3;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(7, 14, 32, 0.7);
  border: 2px solid #2a4677;
  font-size: 16px;
  pointer-events: auto;
}

/* ------------------------------------------------------------ stage, giants left, boss button */
#tt-stage {
  position: absolute;
  top: calc(4px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  z-index: 3;
  pointer-events: none;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
  white-space: nowrap;
}
#tt-floor { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tt-stage-row { display: flex; align-items: center; gap: 8px; }
#tt-stage-n { font-size: 22px; font-weight: 700; }
#tt-boss-btn {
  pointer-events: auto;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  background: #3a4560;
  border: 2px solid #56628a;
  text-shadow: none;
}
#tt-boss-btn.fight { background: linear-gradient(#ff7a5a, #d83a3a); border-color: #ffb09a; animation: tt-pulse 1.1s ease-in-out infinite; }
@keyframes tt-pulse { 50% { transform: scale(1.08); box-shadow: 0 0 14px rgba(255, 90, 90, 0.7); } }
#tt-kills { display: flex; align-items: center; gap: 3px; }
#tt-kills i { width: 10px; height: 10px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(0, 0, 0, 0.3); }
#tt-kills i.on { background: var(--gold); }
#tt-kills .boss { font-size: 13px; color: rgba(255, 255, 255, 0.35); margin-left: 3px; }
#tt-kills .boss.on { color: var(--red); animation: tt-pulse 0.8s ease-in-out infinite; }
#tt-kills .boss.farm { color: #7d8aa8; text-decoration: line-through; }
#tt-kills .cnt { margin-left: 5px; font-size: 12px; font-weight: 700; color: var(--ink); }
#tt-teaser { font-size: 11px; color: #ffd98a; }
/* the run clock: time played, and time in this shift after a shift change */
#tt-clock { font-size: 12px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; opacity: 0.85; }

/* ------------------------------------------------------------ the giant: name, HP, boss timer */
#tt-titan {
  position: absolute;
  top: calc(100px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  width: min(61%, 288px);
  z-index: 3;
  pointer-events: none;
  text-align: center;
}
#tt-titan.none { visibility: hidden; }
#tt-titan-name {
  font-size: var(--hp-name-size, 17px);
  font-weight: 700;
  margin-bottom: 3px;
  text-shadow: 0 2px 0 #0a142b, 2px 0 0 #0a142b, -2px 0 0 #0a142b, 0 -2px 0 #0a142b;
}
#tt-titan.boss #tt-titan-name { color: #ffb0a0; }
#tt-titan.golden #tt-titan-name { color: var(--gold); }
/* a fat, readable bar: the giant's HP is the main number on screen */
.tt-hp, .tt-timer {
  position: relative;
  height: 28px;
  border-radius: 14px;
  background: rgba(7, 14, 32, 0.88);
  border: 3px solid #0a1428;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.06);
  overflow: hidden;
}
.tt-hp i, .tt-timer i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ff8a7a, #e0413f); }
#tt-titan.golden .tt-hp i { background: linear-gradient(#ffe48a, #f2a60e); }
/* what was just lost: a light tail that catches up after a beat */
.tt-hp #tt-hp-trail, #tt-titan.golden .tt-hp #tt-hp-trail { background: linear-gradient(#fff6e0, #ffd0b0); }
.tt-hp.hit { animation: tt-hp-hit 0.18s ease-out; }
@keyframes tt-hp-hit {
  0% { transform: translateX(0) scaleY(1); filter: brightness(1.8); }
  30% { transform: translateX(-3px) scaleY(1.25); }
  60% { transform: translateX(3px) scaleY(1.1); }
  100% { transform: translateX(0) scaleY(1); filter: brightness(1); }
}
.tt-hp span, .tt-timer span {
  position: relative;
  display: block;
  font-size: 16px;
  font-weight: 700;
  line-height: 22px;
  letter-spacing: 0.02em;
  text-shadow: 0 2px 0 #0a142b, 1.5px 0 0 #0a142b, -1.5px 0 0 #0a142b, 0 -1.5px 0 #0a142b;
}
.tt-hp i { box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25), inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
.tt-timer { height: 22px; margin-top: 4px; border-radius: 11px; }
.tt-timer span { font-size: 13px; line-height: 16px; }
.tt-timer i { background: linear-gradient(#ffd25a, #ff8a1f); transition: width 0.1s linear; }

/* ------------------------------------------------------------ floating numbers, flying coins, toasts */
#tt-pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
.tt-pop {
  --s: 1;
  --dx: 0px;
  position: absolute;
  transform: translate(-50%, -50%);
  font-weight: 700;
  font-size: calc(18px * var(--s));
  line-height: 1;
  text-align: center;
  color: #fff;
  /* a thick dark outline so the numbers read on any giant */
  text-shadow: 0 3px 0 #0a142b, 2px 0 0 #0a142b, -2px 0 0 #0a142b, 0 -2px 0 #0a142b, 0 0 8px rgba(0, 0, 0, 0.6);
  white-space: nowrap;
  animation: tt-rise 0.9s ease-out forwards;
}
.tt-pop.tap { font-size: calc(23px * var(--s)); animation: tt-hit 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
.tt-pop.crit {
  font-size: calc(34px * var(--s));
  color: #ffd84a;
  text-shadow: 0 4px 0 #7a2a00, 3px 0 0 #7a2a00, -3px 0 0 #7a2a00, 0 -3px 0 #7a2a00, 0 0 14px rgba(255, 120, 30, 0.8);
  animation: tt-crit 1.05s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  z-index: 2;
}
.tt-pop.crit small { display: block; font-size: 0.42em; letter-spacing: 0.1em; color: #fff; margin-bottom: 2px; }
.tt-pop.hero { color: #a8d4ff; font-size: calc(15px * var(--s)); }
.tt-pop.gold { color: var(--gold); font-size: calc(17px * var(--s)); }
.tt-pop.small { font-size: 12px; }
.tt-pop.pet { color: #ffe066; font-size: calc(24px * var(--s)); animation: tt-hit 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
.tt-pop.mana { color: #7ee0ff; }
.tt-pop.big { font-size: calc(30px * var(--s)); animation-duration: 1.3s; }
.tt-pop.gold.big { color: var(--gold); }
@keyframes tt-rise {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -240%) scale(1); }
}
/* a tap: punches out big, drops back, drifts up and sideways */
@keyframes tt-hit {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(0.4); }
  12% { opacity: 1; transform: translate(-50%, -70%) scale(1.35); }
  25% { transform: translate(-50%, -80%) scale(1); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -260%) scale(0.85); }
}
/* a crit: slams in tilted, wobbles, then rises */
@keyframes tt-crit {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(2.2) rotate(-12deg); }
  10% { opacity: 1; transform: translate(-50%, -60%) scale(0.9) rotate(6deg); }
  18% { transform: translate(-50%, -66%) scale(1.2) rotate(-4deg); }
  28% { transform: translate(-50%, -72%) scale(1) rotate(0); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -230%) scale(0.95); }
}
.tt-fly { position: absolute; width: 16px; height: 16px; z-index: 6; pointer-events: none; }

#tt-toasts {
  position: absolute;
  top: 34%;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 5;
  pointer-events: none;
}
.tt-toast {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  padding: 8px 14px;
  border-radius: 14px;
  background: rgba(8, 16, 38, 0.92);
  border: 2px solid var(--line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  animation: tt-in 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
  transition: opacity 0.4s, transform 0.4s;
}
.tt-toast.out { opacity: 0; transform: translateY(-14px); }
.tt-toast .ic { font-size: 26px; }
.tt-toast b { display: block; font-size: 15px; }
.tt-toast small { display: block; font-size: 12px; color: var(--muted); }
.tt-toast.big { border-color: var(--gold); }
.tt-toast.evo { border-color: #c783ff; }
.tt-toast.boss, .tt-toast.bad { border-color: var(--red); }
.tt-toast.quest { border-color: var(--green); }
@keyframes tt-in { from { opacity: 0; transform: scale(0.7); } }

/* ------------------------------------------------------------ skills and the charge */
#tt-skills {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 8px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tt-mana {
  position: relative;
  height: 12px;
  border-radius: 6px;
  background: rgba(7, 14, 32, 0.8);
  border: 2px solid #0a1428;
  overflow: hidden;
  text-align: center;
}
.tt-mana i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#7ee0ff, #2f8fe8); transition: width 0.15s; }
.tt-mana span { position: relative; font-size: 9px; font-weight: 700; line-height: 9px; text-shadow: 0 1px 0 #000; vertical-align: top; }
#tt-skill-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tt-skill {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
  max-height: 56px;
  border-radius: 14px;
  background: linear-gradient(#2c4a85, #1a3060);
  border: 2px solid #4a6fb5;
  box-shadow: 0 3px 0 #0a1428;
  overflow: hidden;
  --p: 0;
}
.tt-skill .ic { position: relative; font-size: 22px; line-height: 1; z-index: 1; }
.tt-skill .mana { position: absolute; right: 4px; bottom: 2px; font-size: 10px; font-weight: 700; color: #7ee0ff; z-index: 2; }
.tt-skill .lock { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 10px; font-style: normal; font-weight: 700; color: var(--muted); display: none; z-index: 2; }
.tt-skill .cd {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-style: normal;
  font-size: 18px;
  font-weight: 700;
  z-index: 3;
  text-shadow: 0 2px 0 #000;
}
.tt-skill .ring { position: absolute; inset: 0; background: conic-gradient(rgba(255, 197, 51, 0.55) calc(var(--p) * 360deg), transparent 0); opacity: 0; }
.tt-skill.locked { background: #1a2643; border-color: #2a3a60; box-shadow: none; }
.tt-skill.locked .ic { opacity: 0.3; filter: grayscale(1); }
.tt-skill.locked .lock { display: block; }
.tt-skill.locked .mana { display: none; }
.tt-skill.ready { border-color: var(--gold); box-shadow: 0 3px 0 #0a1428, 0 0 12px rgba(255, 197, 51, 0.55); }
.tt-skill.nomana { opacity: 0.6; }
.tt-skill.cooldown::after { content: ''; position: absolute; inset: 0; background: rgba(5, 10, 24, 0.6); z-index: 2; }
.tt-skill.active .ring { opacity: 1; }
.tt-skill.active { border-color: #ffe48a; }

/* ------------------------------------------------------------ cheats */
#tt-cheats {
  position: absolute;
  top: calc(44px + env(safe-area-inset-top, 0px));
  right: 8px;
  z-index: 8;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px;
  border-radius: 12px;
  background: rgba(7, 14, 32, 0.94);
  border: 2px solid var(--line);
}
#tt-cheats button { padding: 6px 10px; border-radius: 8px; background: #233d72; font-size: 13px; text-align: left; }

/* ------------------------------------------------------------ quest bar */
#tt-quest {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 10px;
  background: linear-gradient(#2a477f, #20386a);
  border-top: 2px solid #0a142b;
  border-bottom: 2px solid #0a142b;
  font-size: 13px;
  text-align: left;
}
#tt-quest { cursor: pointer; }
#tt-quest .qi { font-size: 16px; }
#tt-quest .qbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
#tt-quest .qt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tt-quest .qbar { position: relative; height: 5px; border-radius: 3px; background: rgba(7, 14, 32, 0.6); overflow: hidden; }
#tt-quest .qbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #58db7c, #9ff0a8); transition: width 0.2s; }
#tt-quest .qp { color: var(--gold); font-weight: 700; }
#tt-quest .qr { display: flex; align-items: center; gap: 3px; font-weight: 700; }
#tt-quest .qr .tt-coin, #tt-quest .qclaim .tt-coin { width: 14px; height: 14px; }
/* TT2's green Collect: the objective is done, the reward waits for a tap */
#tt-quest .qclaim {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  background: linear-gradient(#58db7c, #23a04b);
  box-shadow: 0 2px 0 #146b30;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  animation: tt-pulse 0.9s ease-in-out infinite;
}
#tt-quest.ready { background: linear-gradient(#2f6a4a, #24533b); }

/* ------------------------------------------------------------ the dock: title, ×N, cards, tabs */
#tt-dock {
  flex: none;
  height: clamp(156px, 23%, 225px);
  display: flex;
  flex-direction: column;
  background: linear-gradient(#18295a, #101e44);
}
.tt-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px 2px; }
#tt-stats { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tt-panel-title { font-size: 14px; }
#tt-mult { display: flex; gap: 4px; }
.tt-m { padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #22396b; border: 2px solid #31538f; color: var(--muted); }
.tt-m.on { background: var(--gold); border-color: #ffe48a; color: #3a2400; }
#tt-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}
.tt-card {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 12px;
  background: var(--card);
  border: 2px solid var(--line);
  flex: none;
}
.tt-card.flash { animation: tt-flash 0.35s ease-out; }
@keyframes tt-flash { 30% { background: #3c62a8; transform: scale(1.02); } }
.tt-card.locked { opacity: 0.55; }
.tt-card.hire { border-style: dashed; }
.tt-thumb { width: 64px; height: 36px; object-fit: contain; display: block; }
.tt-thumb.emoji { font-size: 28px; text-align: center; line-height: 40px; height: 40px; }
.tt-info { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tt-name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-name small { font-size: 12px; font-weight: 500; color: var(--muted); }
.tt-stat { font-size: 12px; color: #d7e2f7; }
.tt-next { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-tier {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 0 4px;
  border-radius: 5px;
  border: 1px solid var(--c);
  color: var(--c);
  vertical-align: 2px;
}
.tt-buy {
  min-width: 96px;
  height: 52px;
  border-radius: 11px;
  background: linear-gradient(#58db7c, #23a04b);
  box-shadow: 0 3px 0 #146b30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font-weight: 700;
  font-size: 14px;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
}
.tt-buy small { font-size: 10px; font-weight: 600; opacity: 0.9; }
/* TT2's «Level Up +1.2 DPS»: what the purchase adds */
.tt-buy .gain { font-size: 10px; font-weight: 700; color: #eaffd9; }
.tt-buy:disabled .gain { color: #b8c0d6; }
.tt-buy .cost { display: flex; align-items: center; gap: 3px; }

/** milestone multiplier and count at level L of a step table (past it: every `every` levels × `mul`) */
function ladder(steps, L, every, mul) {
  let m = 1, n = 0;
  for (const [at, x] of steps) {
    if (L < at) return { m, n };
    m *= x;
    n++;

  const last = steps[steps.length - 1][0];
  const extra = Math.floor((L - last) / every);
  return { m: m * Math.pow(mul, extra), n: n + extra };
}

  const last = steps[steps.length - 1][0];
  return last + (Math.floor((L - last) / every) + 1) * every;
}

/** price of n levels from level `from` of a ladder base · growth^level (geometric sum) */
function ladderCost(base, growth, from, n) {
  return (base * Math.pow(growth, from) * (Math.pow(growth, n) - 1)) / (growth - 1);
}
/** how many levels of such a ladder `coins` buy */
function ladderAfford(base, growth, from, coins) {
  const first = base * Math.pow(growth, from);
  if (coins < first) return 0;
  return Math.floor(Math.log(1 + (coins * (growth - 1)) / first) / Math.log(growth) + 1e-9);
}

    }
    const pet = this.petDef;
    if (pet) raise(pet.bonus, petBonus(pet, s.pets[pet.id]));
    // «Квалификация»
    const t = { critMul: 1, pet: 1, manaAdd: 0, regen: 1, skillTime: 1, press: 1, offline: 1, bossAdd: 0, piggy: 1 };
    for (const n of TREE_NODES) {
      const L = s.tree[n.id] || 0;
      if (!L) continue;
      const m = 1 + (n.per ?? 0) * L;
      if (n.bonus.startsWith('cls:')) cls[n.bonus.slice(4)] *= m;
      else if (n.bonus === 'crit') crit += n.add * L;
      else if (n.bonus === 'manaMax') t.manaAdd += n.add * L;
      else if (n.bonus === 'bossTime') t.bossAdd += n.add * L;
      else if (n.bonus === 'manaRegen') t.regen *= m;
      else if (n.bonus in t) t[n.bonus] *= m;
      else raise(n.bonus, m);
    }
    this.cls = cls;
    const machineLevels = MACHINES.reduce((a, m) => a + ml(m.id), 0);
    all *= 1 + MACHINE.allDamage * machineLevels;
    const skills = SKILLS.filter((sk) => s.skills[sk.id]).length;
    this.k = {
      tap: tap * (1 + mp('whetstone')) * all,
      heroes: heroes * (1 + mp('rack')) * all,
      gold: gold * (1 + mp('magnet')),
      boss,
      crit: Math.min(0.5, crit),
      critMul: t.critMul,
      pet: t.pet,
      skillTime: t.skillTime,
      press: t.press,
      piggy: t.piggy,
      all,
      bossTime: BOSS.time + mp('freezer') + t.bossAdd,
      titansMinus: mp('shortshift'),
      manaMax: skills ? MANA.base + MANA.perSkill * skills + 100 * mp('generator') + t.manaAdd : 0,
      manaRegen: MANA.regen * (1 + mp('generator')) * t.regen,
      offline: (1 + mp('night')) * t.offline,
      xerox: 1 + mp('xerox'),
    };
    this.heroDps = HEROES.map((h, i) => heroDps(i, s.heroes[h.id] || 0) * this.k.heroes * cls[h.cls] * HERO.reloadK);
    this.heroSum = this.heroDps.reduce((a, b) => a + b, 0);
  }

  get titansNeeded() {
    return titansAt(this.s.stage, this.k.titansMinus);
  }

  get floor() {
    return floorOf(this.s.stage);
  }

  get floorIdx() {
    return floorIndex(this.s.stage) % FLOORS.length;
  }

  skillLevel(id) {
    return this.s.skills[id] || 0;
  }

  /** a tap's damage with the running skills (no crit, no boss bonus) */
  tapDamage(level = this.s.gun) {
    let d = gunDamage(level) * this.k.tap;
    if (this.act.hot > 0) d *= skillEffect('hot', this.skillLevel('hot')).tapMul;
    return d;
  }

  /** hero damage per second right now (Ярость included) */
  get heroDpsNow() {
    return this.heroSum * (this.act.rage > 0 ? skillEffect('rage', this.skillLevel('rage')).heroMul : 1);
  }

  heroLevel(i) {
    return this.s.heroes[HEROES[i].id] || 0;
  }

  /** hero i can be hired: the previous one is */
  heroOpen(i) {
    return i === 0 || this.heroLevel(i - 1) > 0;
  }

  /** what the giant up now pays when it breaks (its coins × gold, the boost, the newcomer's purse) */
  get titanReward() {
    const t = this.titan;
    if (!t) return 0;
    const gold = t.gold * this.k.gold * this.boost;
    // Spending on the shooter must not exhaust the first hero's source of income.
    const starter = this.s.starter > 0 || (!this.s.prestiges && this.heroLevel(0) === 0);
    return starter ? Math.max(gold, STARTER.gold) : gold;
  }

  /** the pet that goes with you (PETS), if you have it */
  get petDef() {
    const p = PETS.find((x) => x.id === this.s.pet);
    return p && this.s.pets[p.id] ? p : null;
  }

  get petOn() {
    return !!this.petDef;
  }

  // ------------------------------------------------------------------ the loop
  update(dt) {
    const s = this.s;
    s.playT += dt;
    s.shiftT += dt;
    if (s.boostT > 0) s.boostT = Math.max(0, s.boostT - dt);
    if (this.reloadT > 0) this.reloadT = Math.max(0, this.reloadT - dt);
    if (s.tourney && !s.tourney.done) {
      s.tourney.t += dt;
      if (s.tourney.t >= TOURNEY.min * 60) this.finishTourney();
    }
    for (const sk of SKILLS) {
      if (this.act[sk.id] > 0) {
        this.act[sk.id] -= dt;
        if (this.act[sk.id] <= 0) {
          this.act[sk.id] = 0;
          this.cd[sk.id] = sk.cd;
          this.h.onSkillEnd?.(sk.id);
        }
      } else if (this.cd[sk.id] > 0) this.cd[sk.id] = Math.max(0, this.cd[sk.id] - dt);
    }
    if (this.k.manaMax > 0) s.mana = Math.min(this.k.manaMax, s.mana + this.k.manaRegen * dt);
    else s.mana = 0;

    // «Спарка»: a second gun taps on its own
    if (this.act.twin > 0) {
      const e = skillEffect('twin', this.skillLevel('twin'));
      this.twinAcc += dt * e.taps;
      while (this.twinAcc >= 1) {
        this.twinAcc -= 1;
        const r = this.tap(true, e.tapShare);
        this.h.onAutoTap?.(r);
      }
    } else this.twinAcc = 0;

    if (!this.titan) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) this.spawn();
    } else {
      const t = this.titan;
      let dps = this.heroDpsNow;
      if (t.boss) dps *= this.k.boss;
      if (dps > 0) {
        const d = dps * dt;
        this.heroAcc += Math.min(d, t.hp);
        this.damage(d);
      }
      if (this.titan === t && t.boss) {
        this.bossT -= dt;
        if (this.bossT <= 0) this.bossFail();
      }
    }

    s.piggyAt -= dt;
    if (s.piggyAt <= 0) {
      s.piggyAt = between(PIGGY.every);
      this.h.onPiggy?.();
    }
  }

  /** the next giant: the boss once the stage's giants are down (unless farming), else a regular one */
  spawn() {
    const s = this.s, f = this.floor, place = placeOf(s.stage);
    const boss = !s.farm && s.kills >= this.titansNeeded;
    let hp = titanHp(s.stage), gold = titanGold(s.stage), variant = null, kind, rank = 'giant';
    const regular = () => {
      const pool = f.giants.filter((k) => k !== this.lastKind);
      return pick(pool.length ? pool : f.giants);
    };
    if (boss) {
      if (place === 4) {
        rank = uniqueRank(s.stage);
        kind = rank === 'mini' ? f.mini : f.boss;
      } else { kind = regular(); variant = 'rare'; rank = 'stageBoss'; }
      hp *= bossMul(s.stage);
      gold *= bossMul(s.stage) * STAGE.bossGold;
    } else {
      kind = regular();
      if (s.best >= GOLDEN.from && Math.random() < GOLDEN.chance) {
        variant = 'golden';
        gold *= GOLDEN.gold;
      }
    }
    this.lastKind = kind;
    const name = GIANT_NAMES[kind] ?? kind;
    this.titan = { kind, variant, boss, rank, hp, maxHp: hp, gold, gen: ++this.gen, dead: false,
      name: variant === 'golden' ? `${name} · золотой` : name };
    if (boss) this.bossT = this.k.bossTime;
    this.h.onSpawn?.(this.titan);
  }

  damage(d) {
    const t = this.titan;
    if (!t || t.dead) return;
    t.hp -= d;
    if (t.hp <= 0) this.kill();
  }

  kill() {
    const t = this.titan, s = this.s;
    t.dead = true;
    t.hp = 0;
    const gold = this.titanReward;
    if (s.starter > 0) s.starter--;
    s.coins += gold;
    this.titan = null;
    this.spawnT = STAGE.respawn;
    this.h.onKill?.(t, gold);
    if (t.boss) {
      this.bossDrops();
      this.clearStage();
    }
    else s.kills++;
    this.checkQuest();
  }

  clearStage() {
    const s = this.s;
    const before = floorIndex(s.stage);
    this.dailyAdd('stages', 1);
    if (s.tourney && !s.tourney.done) s.tourney.score++;
    // the first win over each workshop boss pays patrons
    if (placeOf(s.stage) === 4 && s.stage > s.patronStage) {
      s.patronStage = s.stage;
      this.addPatrons(PATRONS.workshopBoss, 'boss');
    }
    s.stage++;
    s.kills = 0;
    s.farm = false;
    s.maxStage = Math.max(s.maxStage, s.stage);
    s.best = Math.max(s.best, s.stage);
    this.spawnT = 0.6;
    this.h.onStage?.(s.stage, floorIndex(s.stage) !== before);
    this.checkUnlocks();
  }

  /** the press got the boss first: no coins, the stage's giants keep coming until «Бой с боссом» */
  bossFail() {
    const t = this.titan;
    t.dead = true;
    this.titan = null;
    this.s.farm = true;
    this.spawnT = 1.1;
    this.h.onBossFail?.(t);
  }

  fightBoss() {
    const s = this.s;
    if (!s.farm) return;
    s.farm = false;
    s.kills = Math.max(s.kills, this.titansNeeded);
    if (this.titan && !this.titan.boss) {
      const t = this.titan;
      t.dead = true;
      this.titan = null;
      this.h.onDespawn?.(t);
    }
    this.spawnT = Math.min(this.spawnT, 0.3);
  }

  leaveBoss() {
    const t = this.titan;
    if (!t?.boss) return;
    this.s.farm = true;
    t.dead = true;
    this.titan = null;
    this.spawnT = 0.5;
    this.h.onDespawn?.(t);
  }

  /**
   * a shot of the main gun (auto: the «Спарка» gun, share of a tap). Returns null with no giant to hit,
   * else { dmg, crit, gold (Монетный дождь), pet (Кряк's jump damage, if he jumps now), gen, frac (dmg / max HP) }.
   */
  tap(auto = false, share = 1) {
    const s = this.s;
    if (!auto && this.reloadT > 0) return null; // reloading: the tap is lost
    if (!auto) s.taps++;
    const t = this.titan;
    if (!t || t.dead) {
      if (!auto) this.checkQuest();
      return null;
    }
    if (this.h.beforeTap?.(auto, share, this.tapDamage() * share * (t.boss ? this.k.boss : 1) / t.maxHp) === false) return null;
    if (!auto && --this.ammo <= 0) {
      this.ammo = GUN.mag;
      this.reloadT = GUN.reload;
      this.h.onReload?.();
    }
    const weak = this.act.weak > 0 ? skillEffect('weak', this.skillLevel('weak')) : null;
    const crit = Math.random() < this.k.crit + (weak ? weak.critAdd : 0);
    let dmg = this.tapDamage() * share;
    if (crit) dmg *= (CRIT.min + Math.random() * (CRIT.max - CRIT.min)) * (weak ? weak.critMul : 1) * this.k.critMul;
    if (t.boss) dmg *= this.k.boss;
    let gold = 0;
    if (this.act.rain > 0) {
      gold = titanGold(s.stage) * skillEffect('rain', this.skillLevel('rain')).goldPerTap * this.k.gold * this.boost;
      s.coins += gold;
    }
    let pet = 0;
    const pd = this.petDef;
    if (!auto && pd && ++this.petCount >= pd.every) {
      this.petCount = 0;
      pet = this.tapDamage() * pd.mul * petJumpMul(s.pets[pd.id]) * this.k.pet * (t.boss ? this.k.boss : 1);
    }
    if (!auto) this.dailyAdd('taps', 1);
    const gen = t.gen, frac = dmg / t.maxHp;
    this.damage(dmg);
    if (pet) this.damage(pet);
    if (!auto) this.checkQuest();
    return { dmg, crit, gold, pet, gen, frac };
  }

  // ------------------------------------------------------------------ shop
  /** mode: 1 | 10 | 100 | 'max' → { n, cost }; n ≥ 1 even when it can't be paid */
  gunCostFor(mode) {
    const L = this.s.gun;
    let n = mode === 'max' ? ladderAfford(GUN.cost, GUN.growth, L - 1, this.s.coins) : mode;
    n = Math.max(1, n);
    return { n, cost: ladderCost(GUN.cost, GUN.growth, L - 1, n) };
  }

  /** extra tap damage that n more main gun levels give (the «+урон» on the buy button) */
  gunGain(n) {
    return this.tapDamage(this.s.gun + n) - this.tapDamage();
  }

  /** extra DPS that n more levels of hero i give */
  heroGain(i, n) {
    const lvl = this.heroLevel(i), h = HEROES[i];
    return (heroDps(i, lvl + n) - heroDps(i, lvl)) * this.k.heroes * this.cls[h.cls];
  }

  buyGun(mode) {
    const s = this.s;
    const { n, cost } = this.gunCostFor(mode);
    if (cost > s.coins) return false;
    s.coins -= cost;
    const before = milestones(s.gun);
    s.gun += n;
    this.h.onGunLevel?.(s.gun, milestones(s.gun) > before);
    this.checkSkills();
    this.recalc();
    this.checkQuest();
    return true;
  }

  heroCostFor(i, mode) {
    const lvl = this.heroLevel(i), h = HEROES[i];
    let n = mode === 'max' ? ladderAfford(h.cost, HERO.growth, lvl, this.s.coins) : mode;
    n = Math.max(1, n);
    return { n, cost: ladderCost(h.cost, HERO.growth, lvl, n) };
  }

  buyHero(i, mode) {
    const s = this.s, h = HEROES[i];
    if (!this.heroOpen(i)) return false;
    const lvl = this.heroLevel(i);
    const { n, cost } = this.heroCostFor(i, lvl === 0 ? 1 : mode);
    if (cost > s.coins) return false;
    s.coins -= cost;
    s.heroes[h.id] = lvl + n;
    this.dailyAdd('levels', n);
    this.recalc();
    if (lvl === 0) this.h.onHire?.(i);
    const before = evosAt(lvl), after = evosAt(lvl + n);
    for (let e = before + 1; e <= after; e++) {
      s.evolves++;
      this.h.onEvolve?.(i, e);
    }
    this.h.onHeroLevel?.(i);
    this.checkQuest();
    return true;
  }

  /** skills open by themselves at their main gun level, level 1 free */
  checkSkills() {
    const s = this.s;
    for (const sk of SKILLS) {
      if (s.skills[sk.id] || s.gun < sk.unlock) continue;
      s.skills[sk.id] = 1;
      const first = !s.unlocked[`skill:${sk.id}`];
      s.unlocked[`skill:${sk.id}`] = true;
      this.recalc();
      s.mana = this.k.manaMax;
      this.h.onSkillUnlock?.(sk, first);
    }
  }

  skillUpgradeCost(id) {
    const sk = SKILLS.find((x) => x.id === id), k = this.skillLevel(id);
    if (!k || k >= SKILL_MAX) return null;
    return skillCost(sk, k);
  }

  upgradeSkill(id) {
    const cost = this.skillUpgradeCost(id);
    if (cost == null || cost > this.s.coins) return false;
    this.s.coins -= cost;
    this.s.skills[id]++;
    this.checkQuest();
    return true;
  }

  /** HUD state of a skill button */
  skillState(id) {
    const sk = SKILLS.find((x) => x.id === id), lvl = this.skillLevel(id);
    const active = this.act[id] > 0, cd = this.cd[id] || 0;
    return { sk, lvl, active, left: this.act[id] || 0, cd, ready: !!lvl && !active && cd <= 0, mana: this.s.mana >= sk.mana };
  }

  cast(id, free = false) {
    const sk = SKILLS.find((x) => x.id === id), s = this.s, lvl = this.skillLevel(id);
    if (!lvl || this.act[id] > 0 || (!free && (this.cd[id] > 0 || s.mana < sk.mana))) return false;
    if (id === 'press' && !this.titan) return false;
    if (!free) {
      s.mana -= sk.mana;
      s.casts++;
    }
    if (!free) this.dailyAdd('casts', 1);
    if (sk.dur > 0) this.act[id] = sk.dur * this.k.skillTime;
    else this.cd[id] = sk.cd;
    let dmg = 0;
    if (id === 'press') dmg = this.tapDamage() * skillEffect('press', lvl).tapMul * this.k.press * (this.titan.boss ? this.k.boss : 1);
    this.h.onCast?.(id, dmg, free);
    if (dmg) this.damage(dmg);
    this.checkQuest();
    return true;
  }

  // ------------------------------------------------------------------ the flying piggy bank
  /** what the broken piggy bank gives: a free skill, a charge refill, or coins */
  piggyReward() {
    const s = this.s;
    this.dailyAdd('piggies', 1);
    const open = SKILLS.filter((sk) => this.skillLevel(sk.id) && sk.dur > 0 && !(this.act[sk.id] > 0));
    if (open.length && Math.random() < PIGGY.skillChance) {
      const sk = pick(open);
      this.cd[sk.id] = 0;
      this.cast(sk.id, true);
      return { kind: 'skill', skill: sk };
    }
    if (this.k.manaMax > 0 && s.mana < this.k.manaMax * 0.5 && Math.random() < 0.5) {
      const add = this.k.manaMax * PIGGY.manaShare;
      s.mana = Math.min(this.k.manaMax, s.mana + add);
      return { kind: 'mana', value: add };
    }
    if (Math.random() < PATRONS.piggyChance) {
      this.addPatrons(PATRONS.piggy, 'piggy');
      return { kind: 'patrons', value: PATRONS.piggy };
    }
    const gold = titanGold(s.stage) * PIGGY.gold * this.k.gold * this.boost * this.k.piggy;
    s.coins += gold;
    return { kind: 'gold', value: gold };
  }

  // ------------------------------------------------------------------ the shift change and machines
  get prestigeOpen() {
    return this.s.best >= PRESTIGE.unlock;
  }

  get canPrestige() {
    return this.prestigeOpen && this.s.maxStage >= PRESTIGE.unlock && this.prestigeReward > 0;
  }

  get prestigeReward() {
    return blueprintsFor(this.s.maxStage, this.k.xerox);
  }

  prestige() {
    if (!this.canPrestige) return 0;
    const s = this.s, bp = this.prestigeReward;
    s.blueprints += bp;
    s.prestiges++;
    this.addPatrons(PATRONS.prestige, 'prestige');
    s.lastShift = s.maxStage;
    s.shiftT = 0;
    Object.assign(s, { coins: 0, stage: 1, kills: 0, farm: false, maxStage: 1, gun: 1, heroes: {}, skills: {}, mana: 0 });
    this.titan = null;
    this.spawnT = 1.2;
    this.act = {};
    this.cd = {};
    this.petCount = 0;
    this.recalc();
    this.h.onPrestige?.(bp);
    this.checkQuest();
    return bp;
  }

  get ownedMachines() {
    return MACHINES.filter((m) => (this.s.machines[m.id] || 0) > 0);
  }

  /** blueprints for the next new machine (null: all are standing) */
  get newMachineCost() {
    const n = this.ownedMachines.length;
    return n < MACHINES.length ? MACHINE.costs[Math.min(n, MACHINE.costs.length - 1)] : null;
  }

  /** the 1-of-3 choice: kept until taken, so closing it doesn't reroll */
  openOffer() {
    const s = this.s;
    if (s.offer?.length) return s.offer;
    const cost = this.newMachineCost;
    if (cost == null || s.blueprints < cost) return null;
    // the lowest pool that still has machines, like TT2's artifact pools
    const left = MACHINES.filter((m) => !s.machines[m.id]);
    const low = Math.min(...left.map((m) => m.pool));
    const pool = left.filter((m) => m.pool === low).map((m) => m.id);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    s.offer = pool.slice(0, MACHINE.offer);
    return s.offer;
  }

  chooseMachine(id) {
    const s = this.s, cost = this.newMachineCost;
    if (!s.offer?.includes(id) || cost == null || s.blueprints < cost) return false;
    s.blueprints -= cost;
    s.machines[id] = 1;
    s.offer = null;
    this.recalc();
    this.h.onMachine?.(id, 1);
    this.checkQuest();
    return true;
  }

  machineUpgradeCost(id) {
    const L = this.s.machines[id] || 0, def = machineDef(id);
    if (!L || (def.max && L >= def.max)) return null;
    return machineLevelCost(def, L);
  }

  upgradeMachine(id) {
    const cost = this.machineUpgradeCost(id);
    if (cost == null || cost > this.s.blueprints) return false;
    this.s.blueprints -= cost;
    this.s.machines[id]++;
    this.recalc();
    this.h.onMachine?.(id, this.s.machines[id]);
    return true;
  }

  // ------------------------------------------------------------------ what opens, the quest chain
  checkUnlocks() {
    for (const u of UNLOCKS) {
      if (this.s.unlocked[u.id] || this.s.best < u.stage) continue;
      this.s.unlocked[u.id] = true;
      if (u.id === 'pet') this.s.pets.duck ||= 1;
      this.recalc();
      this.h.onUnlock?.(u);
    }
    // the bosses of 100, 200, 400 free a pet each (Кряк comes with the 'pet' unlock above)
    for (const p of PETS) {
      if (this.s.pets[p.id] || this.s.best <= p.stage || p.id === 'duck') continue;
      this.s.pets[p.id] = 1;
      this.h.onPetFree?.(p);
    }
  }

  questValue(kind) {
    const s = this.s;
    switch (kind) {
      case 'taps': return s.taps - s.questStart;
      case 'gun': return s.gun;
      case 'hire': return HEROES.filter((h) => (s.heroes[h.id] || 0) > 0).length;
      case 'stage': return s.best;
      case 'evolve': return s.evolves;
      case 'skill': return s.casts;
      case 'prestige': return s.prestiges;
      case 'machine': return this.ownedMachines.length;
    }
    return 0;
  }

  /** the current objective: the chain, then records every RECORD_QUEST.step stages */
  get quest() {
    const s = this.s;
    let q;
    if (s.quest < CHAIN.length) q = CHAIN[s.quest];
    else {
      if (!(s.recordAt > s.best)) s.recordAt = (Math.floor(s.best / RECORD_QUEST.step) + 1) * RECORD_QUEST.step;
      q = { kind: 'stage', n: s.recordAt, text: `Новый рекорд: этап ${s.recordAt}`, reward: RECORD_QUEST.reward, record: true };
    }
    return { ...q, value: Math.min(q.n, this.questValue(q.kind)) };
  }

  /** chain rewards are TT2's absolute coins (× our gold knob); record rewards follow the current stage */
  questReward(q) {
    if (!(q.reward > 0)) return 0;

function statCost(stat, lvl, lane) {
  return Math.round(stat.baseCost * Math.pow(stat.growth, lvl) * lane.scale);

/**
 * evo: evolutions (tiers) won by the weapon; each one raises its own stats (TIER_BONUS) and adds an attachment
 * whose perk (EVO_PERKS) grows with the module's rarity in `mods` ({ kind: 0 Common .. 4 Legendary }).
 */
function computeStats(lane, levels, evo = 0, mods = {}) {
  const w = WEAPONS[lane.weapon];
  const v = (id) => STATS.find((s) => s.id === id).value(w, levels[id] || 0, lane);
  const k = { damage: 1, minSpread: 1, magSize: 1, autoRate: 1, bloom: 1, convergence: 1, reload: 1 };
  for (const kind of EVO_KITS[lane.weapon].slice(0, evo)) {
    for (const [stat, mul] of Object.entries(perkMul(kind, mods[kind] || 0))) k[stat] *= mul;
  }
  const tier = (id) => Math.pow(TIER_BONUS[id], evo);
  return {
    magSize: Math.round(w.magSize * k.magSize),
    pellets: w.pellets ?? 1,
    damage: v('damage') * k.damage * tier('damage'),
    fireRate: w.fireRate, // fixed weapon mechanic: never raised by levels, tiers or attachments
    autoRate: mods.receiver != null ? Math.min(w.fireRate, v('auto') * k.autoRate * tier('autoRate')) : 0,
    minSpread: v('accuracy') * k.minSpread,
    maxSpread: w.maxSpread,
    bloom: w.bloom * k.bloom,
    convergence: v('aim') * k.convergence,
    reload: Math.max(0.4, v('reload') * k.reload * tier('reload')),
    autoThr: v('focus'), // auto-fire threshold as a share of the spread range
    crit: w.crit ?? 2, // damage multiplier on a junk weak spot
    fan: w.fan ?? 0, // held-trigger rate of a revolver fan, 0 = none
    stream: w.stream ?? null, // flamethrower cone { range, angle }
    freeze: w.freeze ?? 0, // cryo: its hits freeze junk
    pierce: w.pierce ?? 1, // bow, crossbow: pieces one arrow can go through
    pierceKeep: w.pierceKeep ?? 0.8, // damage kept by every further piece it goes through
    skewer: w.skewer ?? 0, // crossbow: +reward per piece further down the skewer
    lob: w.lob ?? null, // grenade launcher { radius, speed }
    chain: w.chain ?? null, // tesla { jumps, reach, share }
    slow: w.staple ?? null, // stapler { slow, time }
    beam: w.beam ?? null, // laser { ramp, time }
    saw: w.saw ?? null, // saw launcher { roll, speed, share }
    rail: !!w.rail, // railgun: through everything on the line
  };
}

// ---------------------------------------------------------------- tiers and modules
/** Each evolution (weapon tier) multiplies these stats once more, on top of its attachment's perk. */
const TIER_BONUS = { damage: 1.2, autoRate: 1.05, reload: 0.94 };

/**
 * Installed attachments are upgraded for coins: Common (0) -> Uncommon -> Rare -> Epic -> Legendary (4).
 * A module can't outrank its weapon, so every tier-up opens the next rarity (modCap). Each rarity step adds
 * MOD_STEP of the Common perk: optic −15% spread at Common, −51% at Legendary.
 */
const MOD_MAX = 4;
const MOD_STEP = 0.6;
const MOD_COST = [250, 1200, 6000, 30000]; // legacy coin prices (tests, archived tools)
/** parts to raise an attachment out of rarity r: modules are bought with parts, not coins */
const MOD_PARTS = [10, 25, 60, 150];

const modCap = (evo) => Math.min(MOD_MAX, evo);

/** coins to raise a module from rarity r on a lane; null at Legendary */
function modCost(lane, r) {
  return r >= MOD_MAX ? null : Math.round(MOD_COST[r] * lane.scale);
}

/** parts to raise a module out of rarity r; null at Legendary */
function modParts(r) {
  return r >= MOD_MAX ? null : MOD_PARTS[r];
}

/** stat multipliers of an attachment at a rarity */
function perkMul(kind, rarity = 0) {
  const s = 1 + MOD_STEP * rarity;
  const out = {};
  for (const [stat, m] of Object.entries(EVO_PERKS[kind].mul)) out[stat] = Math.max(0.2, 1 + (m - 1) * s);
  return out;
}

/** 'точность +15%' at Common, 'точность +51%' at Legendary */
function perkText(kind, rarity = 0) {
  const p = EVO_PERKS[kind];
  const m = Object.values(p.mul)[0];
  return `${p.label} ${p.sign}${Math.round(Math.abs(m - 1) * (1 + MOD_STEP * rarity) * 100)}%`;
}

// a flame jet, lightning) is fx.js / lane.js; spec.blast.kind picks the muzzle effect.

const { MAT, WeaponModel, rbox, extrude, roundPoly, roundHole, xcyl, zcyl, dome } = __m["parts"];
const { KIT, redDot } = __m["kit"];
const { toy, lacquer, gunPaint } = __m["toon"];

const M = {
  fuel: lacquer('#e8384d', { spec: 0.25 }),
  fuelCap: gunPaint('#3a3f4d'),
  pilot: toy('#8fe3ff', { emissive: '#3fb6ff', emissiveIntensity: 2.4, rim: 0 }),
  ice: lacquer('#e4eef8', { spec: 0.3, gloss: 18 }),
  iceBlue: lacquer('#56baff', { spec: 0.3 }),
  glow: toy('#9ff0ff', { emissive: '#4fd8ff', emissiveIntensity: 1.8, rim: 0 }),
  glass: toy('#bfe9ff', { transparent: true, opacity: 0.45, spec: 0.8, gloss: 30, rim: 0.4 }),
};

function parts(...list) {
  const g = new THREE.Group();
  g.add(...list);
  return g;
}

/** ring around the X axis (cooling fins, coils) */
function ringX(x, r, tube, mat) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, 28), mat);
  m.rotation.y = Math.PI / 2;
  m.position.x = x;
  m.castShadow = true;
  return m;
}

function trigger(x, y) {
  const t = new THREE.Group();
  t.position.set(x, y, 0);
  t.add(extrude(roundPoly([[-3, 2, 2], [4, 2, 2], [6, -14, 4], [-2, -24, 3], [-6, -20, 3], [-2, -10, 2]]), 8, 2, MAT.gunDark));
  return t;
}

function guard(x0, x1, y0, y1, mat) {
  const s = roundPoly([[x0, y1, 6], [x1, y1, 3], [x1, y0, 12], [x0 + 4, y0, 10]]);
  s.holes.push(roundHole([[x0 + 6, y1 - 6], [x1 - 6, y1 - 6], [x1 - 6, y0 + 8], [x0 + 10, y0 + 8]], 8));
  return extrude(s, 14, 2, mat);
}

/** Tap game's replacement for the flame jet: a coil barrel and a replaceable energy cell. */
class Plasma extends Flamer {
  constructor() {
    super();
    this.spec = { ...this.spec, ammo: 'plasma', blast: { kind: 'spark', scale: 0.4, smoke: 0, rings: 0, bubble: false },
      recoil: { kick: [3, 4], push: [1.4, 2], roll: 0.4, squash: 0.5 } };
    this.pilot.visible = false;
    this.model.traverse((o) => {
      if (o.isMesh && o.material === MAT.orange) o.material = M.glow;
    });
    this.model.add(xcyl(350, 362, 10, M.glow));
    this.muzzleAnchor.position.x = 366;
  }

  buildMag() {
    const mag = super.buildMag();
    mag.traverse((o) => {
      if (o.isMesh && o.material === M.fuel) o.material = M.iceBlue;
      else if (o.isMesh && o.material === MAT.white) o.material = M.glow;
    });
    return mag;
  }

  spin() {}
}

// ---------------------------------------------------------------- bow
const BOW = { tipX: 14, tipY: 112, nockDrawn: -34, wood: lacquer('#b35a20'), limb: lacquer('#2f6fd6', { spec: 0.3 }), string: toy('#f6f0e4', { spec: 0.1 }) };

/** curved limb from the riser to a tip: a band along a quadratic curve, s = +1 upper, -1 lower */
function limb(s) {
  const p0 = [58, 46 * s], p1 = [84, 92 * s], p2 = [BOW.tipX, BOW.tipY * s];
  const fwd = [], back = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12, u = 1 - t;
    const x = u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0];
    const y = u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1];
    const tx = 2 * u * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
    const ty = 2 * u * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
    const l = Math.hypot(tx, ty) || 1;
    const w = (16 - 9 * t) / 2;
    fwd.push(new THREE.Vector2(x + (-ty / l) * w, y + (tx / l) * w));
    back.push(new THREE.Vector2(x - (-ty / l) * w, y - (tx / l) * w));
  }
  return extrude(new THREE.Shape([...fwd, ...back.reverse()]), 12, 2.5, BOW.limb);
}

class Bow extends WeaponModel {
  constructor() {
    super();
    this.spec = {
      // the string snaps forward, the next arrow is nocked after a short hold
      cycle: { delay: 0, back: 0.05, hold: 0.22, fwd: 0.16, ejectAt: 0, lockOnEmpty: false },
      recoil: { kick: [2, 3], push: [1, 1.5], roll: 0.8, squash: 0.6 },
      pose: { tilt: 0.15, yaw: 0.25, roll: 0.4, lift: 0.4 },
      reload: 'mag',
      magOut: 30, // the empty quiver drops, a full one comes in
      magIn: 52,
      dropSize: 0.2,
      casing: null,
      eject: { side: [1, 2], up: [3, 4], back: [0, 0.5] },
      blast: { kind: 'string', scale: 0.25, smoke: 1, rings: 0, bubble: false },
      pellet: 1,
      impact: 0.9,
      rack: 0,
      ammo: 'arrow',
    };
    this.magAxis.set(0, -1, 0);
    this.magCenter.set(92, -70, 0);
    this.inset = 60;
    const m = this.model;

    // riser with a grip wrap and the arrow shelf
    m.add(extrude(roundPoly([[42, -56, 8], [72, -56, 8], [76, 56, 8], [46, 56, 8], [52, 8, 4], [52, -8, 4]]), 22, 4, BOW.wood));
    m.add(rbox(44, 70, -26, 4, -12.5, 12.5, 5, MAT.rubber));
    m.add(limb(1), limb(-1));
    // string: two straight runs from the tips to the nock
    this.strings = [1, -1].map(() => {
      const st = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 1, 6), BOW.string);
      m.add(st);
      return st;
    });
    // the nocked arrow
    this.arrow = parts(
      xcyl(BOW.nockDrawn, 200, 3, BOW.wood),
      extrude(roundPoly([[198, 7, 1], [232, 0, 1], [198, -7, 1]]), 4, 1, MAT.gunmetal),
      rbox(BOW.nockDrawn, BOW.nockDrawn + 26, 2, 12, -1.5, 1.5, 1, MAT.orange),
      rbox(BOW.nockDrawn, BOW.nockDrawn + 26, -12, -2, -1.5, 1.5, 1, MAT.orange),
    );
    m.add(this.arrow);
    this.setString(BOW.nockDrawn);
    this.prevS = 0;
    this.drawing = true; // false from the release until the next arrow is being drawn
    this.loose = 0; // ms timestamp of the release (the string's shiver)

    this.muzzleAnchor.position.set(234, 0, 0);
    this.portAnchor.position.set(60, 0, 14);
    this.finish(new THREE.Vector3(58, -12, 0));
  }

  /** places the two string runs from the limb tips to the nock at x */
  setString(nx) {
    this.nockX = nx;
    this.strings.forEach((st, i) => {
      const s = i ? -1 : 1;
      const a = new THREE.Vector2(BOW.tipX, BOW.tipY * s), b = new THREE.Vector2(nx, 0);
      const len = a.distanceTo(b);
      st.scale.set(1, len, 1);
      st.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, 0);
      st.rotation.z = Math.atan2(b.y - a.y, b.x - a.x) - Math.PI / 2;
    });
  }

  buildMag() {
    // quiver at the riser with arrow nocks showing (a bigger one with the kit)
    const big = this.kit.has('quiver');
    const g = new THREE.Group();
    const h = big ? 84 : 64;
    const q = new THREE.Mesh(new THREE.CylinderGeometry(12, 10, h, 16), BOW.wood);
    q.position.set(92, -70, 0);
    q.castShadow = true;
    g.add(q);
    for (let i = 0; i < (big ? 4 : 3); i++) g.add(rbox(84 + i * 6, 90 + i * 6, -70 + h / 2, -70 + h / 2 + 14, -2, 2, 1, MAT.orange));
    return this.wrapMag(g);
  }

  kitPart(kind) {
    switch (kind) {
      case 'optic': return { add: parts(rbox(72, 92, 18, 34, -5, 5, 3, KIT.black), zcyl(86, 26, 2.5, 3, KIT.dot, 5.5)) };
      case 'stabilizer': return { add: parts(xcyl(74, 150, 3.5, KIT.black, -34), xcyl(146, 162, 8, KIT.black, -34)) };
      case 'cams': return { add: parts(zcyl(BOW.tipX, BOW.tipY, 11, 8, MAT.gunmetal), zcyl(BOW.tipX, -BOW.tipY, 11, 8, MAT.gunmetal)) };
      case 'firetips': return { add: parts(extrude(roundPoly([[196, 9, 1], [236, 0, 1], [196, -9, 1]]), 5, 1, M.pilot)), parent: this.arrow, muzzle: 238 };
    }
    return null;
  }

  /**
   * s rises 0 → 1 as the string snaps forward (the arrow is gone) and shivers there; it falls 1 → 0 as the next arrow
   * is nocked at the string and drawn back with it.
   */
  setAction(s) {
    if (s <= 0 || s < this.prevS) this.drawing = true;
    else if (s > this.prevS && s > 0.1) this.drawing = false; // not the spring's tiny rebound at the end
    this.prevS = s;
    const rest = BOW.tipX + 2;
    let x = BOW.nockDrawn + (rest - BOW.nockDrawn) * s;
    if (!this.drawing) {
      this.loose ||= performance.now();
      const t = (performance.now() - this.loose) / 1000;
      x += Math.sin(t * 75) * 7 * Math.exp(-t * 9) * s;
    } else this.loose = 0;
    this.arrow.visible = this.drawing;
    this.arrow.position.x = x - BOW.nockDrawn;
    this.setString(x);
  }
}

}

/**
 * An arm's material: the toy shading, fading out along the forearm by the distance from the wrist (TUNE.handFade,
 * handFadeLen, concept px). The uniforms are set from the forearm bone just before each draw (fadeArm).
 */
function armMaterial(style = null) {
  const glove = !!style;
  // the glove is matte cloth; a cool rim keeps its fingers apart against the dark gun
  const m = toy('#ffffff', { vertexColors: true, flat: !glove, spec: glove ? 0 : 0.09, rim: glove ? 0.16 : 0.07 });
  const u = { armWrist: { value: new THREE.Vector3() }, armDir: { value: new THREE.Vector3(0, 1, 0) }, armFade: { value: new THREE.Vector2(1e3, 2e3) } };
  // the glove's cuff is painted per pixel by how far along the arm the point was at rest (attribute along, px): a
  // straight clean band, where per-vertex colours on the glove's uneven mesh zig-zag
  const c = GLOVE.GLOVE.cuff, cuff = { cuffColor: { value: style?.cuff ?? NAVY.cuff }, cuffSpan: { value: new THREE.Vector2(c.x - c.hx - 2, c.x + c.hx + 1) },
    cuffStripe: { value: new THREE.Vector4(...(style?.stripe ? [style.stripe.r, style.stripe.g, style.stripe.b, 1] : [0, 0, 0, 0])) } };
  const base = m.onBeforeCompile;
  m.onBeforeCompile = (shader, renderer) => {
    base(shader, renderer);
    Object.assign(shader.uniforms, u, glove ? cuff : {});
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vArmWorld;' + (glove ? '\nattribute float along;\nvarying float vAlong;' : ''))
      .replace('#include <skinning_vertex>', '#include <skinning_vertex>\nvArmWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;' + (glove ? '\nvAlong = along;' : ''));
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 armWrist;\nuniform vec3 armDir;\nuniform vec2 armFade;\nvarying vec3 vArmWorld;'
        + (glove ? '\nuniform vec3 cuffColor;\nuniform vec2 cuffSpan;\nuniform vec4 cuffStripe;\nvarying float vAlong;' : ''))
      .replace('#include <alphamap_fragment>', [
        '#include <alphamap_fragment>',
        ...(glove ? [
          'float cuffW = fwidth(vAlong) + 1e-4;',
          'float inCuff = (1.0 - smoothstep(cuffSpan.y - cuffW, cuffSpan.y + cuffW, vAlong)) * smoothstep(cuffSpan.x - cuffW, cuffSpan.x + cuffW, vAlong);',
          'diffuseColor.rgb = mix(diffuseColor.rgb, cuffColor, inCuff);',
          // a band round the middle of the cuff (the sci-fi glove's)
          'float band = 1.0 - smoothstep(3.0 - cuffW, 3.0 + cuffW, abs(vAlong - 0.5 * (cuffSpan.x + cuffSpan.y)));',
          'diffuseColor.rgb = mix(diffuseColor.rgb, cuffStripe.rgb, band * inCuff * cuffStripe.w);',
        ] : []),
        'diffuseColor.a *= 1.0 - smoothstep(armFade.x, armFade.y, dot(vArmWorld - armWrist, armDir));',
        'if (diffuseColor.a < 0.004) discard;',
      ].join('\n'));
  };
  m.customProgramCacheKey = () => (glove ? 'toy1-arm-glove' : 'toy1-arm');
  m.transparent = true;
  m.userData.arm = u;
  return m;
}

/** the arm fades from the wrist (the forearm bone's origin) back along it; world units per px from the bone's scale */
function fadeArm(mesh, fore) {
  const u = mesh.material.userData.arm, e = fore.matrixWorld.elements, k = fore.matrixWorld.getMaxScaleOnAxis() * PX;
  u.armWrist.value.set(e[12], e[13], e[14]);
  u.armDir.value.set(e[4], e[5], e[6]).normalize();
  u.armFade.value.set(TUNE.handFade * k, (TUNE.handFade + TUNE.handFadeLen) * k);
}

/** the sleeve is drawn only if the fade reaches past the elbow */
const sleeveShown = () => TUNE.handFade + TUNE.handFadeLen > -SLEEVE.x;

/** the glove's dark rim and how wide it is on screen (device px per CSS px) */
const OUTLINE = { color: new THREE.Color('#161c2e'), px: 2 };
const _view = new THREE.Vector2();

/**
 * A dark rim round the glove: its own back faces pushed out along the normal in clip space, so the line is the same
 * ~2 px at any distance. At phone size it is what keeps the fingers and the thumb apart and the gloves off the gun.
 * Only the glove surface gets it (attribute hull), and it fades along the forearm with the arm (shares its uniforms).
 */
function outlineMaterial(arm) {
  const m = new THREE.MeshBasicMaterial({ color: OUTLINE.color, side: THREE.BackSide, transparent: true });
  const u = { hullPx: { value: OUTLINE.px }, hullView: { value: new THREE.Vector2(1, 1) } };
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, arm, u);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float hull;\nuniform float hullPx;\nuniform vec2 hullView;\nvarying vec3 vArmWorld;')
      .replace('#include <skinning_vertex>', '#include <skinning_vertex>\nvArmWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;')
      .replace('#include <project_vertex>', [
        '#include <project_vertex>',
        'vec2 hullDir = (projectionMatrix * vec4(normalize(normalMatrix * objectNormal), 0.0)).xy;',
        'gl_Position.xy += normalize(hullDir + 1e-6) * hullPx * hull * 2.0 / hullView * gl_Position.w;',
      ].join('\n'));
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 armWrist;\nuniform vec3 armDir;\nuniform vec2 armFade;\nvarying vec3 vArmWorld;')
      .replace('#include <alphamap_fragment>', [
        '#include <alphamap_fragment>',
        'diffuseColor.a *= 1.0 - smoothstep(armFade.x, armFade.y, dot(vArmWorld - armWrist, armDir));',
        'if (diffuseColor.a < 0.004) discard;',
      ].join('\n'));
  };
  m.customProgramCacheKey = () => 'arm-hull';
  m.userData.hull = u;
  return m;
}

/** the bare hand: forearm → wrist → palm → knuckle ring → fingers, the thumb out of the thenar (right hand, px) */
function bareHand(mb, frames, tc, tn, tup) {
  // knuckle ring: the fingers' base hexagons, back of the hand from the thumb side, then the palm side back
  const hexPt = (f, a) => {
    const { c, x } = frames[f], z = new THREE.Vector3(-x.z, 0, x.x), r = FINGERS[f].r;
    return c.clone().addScaledVector(Y, r * 0.9 * Math.sin(a * DEG)).addScaledVector(z, r * Math.cos(a * DEG));
  };
  const K = [];
  for (let f = 0; f < 4; f++) for (const a of [150, 90, 30]) K.push(hexPt(f, a));
  for (let f = 3; f >= 0; f--) for (const a of [-30, -90, -150]) K.push(hexPt(f, a));
  const zMin = Math.min(...K.map((p) => p.z)), zMax = Math.max(...K.map((p) => p.z));
  const EDGE = new Set([0, 11, 12, 23]), NEAR = new Set([1, 10, 13, 22]);
  const palmRing = ([x, w, t]) => K.map((p, k) => new THREE.Vector3(
    x, (k < 12 ? 1 : -1) * (t / 2) * (EDGE.has(k) ? 0.45 : NEAR.has(k) ? 0.9 : 1), p.z < 0 ? (p.z / zMin) * (-w / 2) : (p.z / zMax) * (w / 2)));

  // forearm → wrist → palm → knuckle ring
  const fore = FOREARM.slice().reverse().map(([x, w, t], i) =>
    ringPoints(new THREE.Vector3(x, 0, 0), new THREE.Vector3(1, 0, 0), Y, w / 2, t / 2, NGON(12))
      .map((p) => mb.vert(p, B.fore, i === FOREARM.length - 1 ? 0.8 : 1, B.palm)));
  for (let i = 0; i + 1 < fore.length; i++) mb.loft(fore[i], fore[i + 1]);
  const weights = [0.5, 0.9, 1, 1];
  const R = PALM.map((row, i) => palmRing(row).map((p) => mb.vert(p, B.palm, weights[i], B.fore)));
  mb.bridge(fore[fore.length - 1], R[0]);
  // the thumb comes out of the palm side between rings 1 and 3, columns 21 → 0
  const patch = new Set(['1:21', '1:22', '1:23', '2:21', '2:22', '2:23']);
  for (let i = 0; i + 1 < R.length; i++) {
    for (let k = 0; k < 24; k++) {
      if (patch.has(`${i}:${k}`)) continue;
      const a = R[i][k], b = R[i][(k + 1) % 24], c = R[i + 1][(k + 1) % 24], d = R[i + 1][k];
      mb.tri.push(a, b, c, a, c, d);
    }
  }
  const Ki = K.map((p, k) => mb.vert(p, B.palm, 0.75, B.finger(k < 12 ? Math.floor(k / 3) : 3 - Math.floor((k - 12) / 3), 0)));
  mb.loft(R[3], Ki);
  // webs between the fingers
  for (let f = 0; f < 3; f++) {
    const a = Ki[3 * f + 2], b = Ki[3 * (f + 1)], c = Ki[23 - 3 * (f + 1)], d = Ki[21 - 3 * f];
    mb.tri.push(a, b, c, a, c, d);
  }
  // fingers out of their hexagons
  frames.forEach(({ c, x }, f) => {
    const base = [Ki[3 * f + 1], Ki[3 * f + 2], Ki[21 - 3 * f], Ki[22 - 3 * f], Ki[23 - 3 * f], Ki[3 * f]];
    digit(mb, base, c, x, Y, FINGERS[f].r, FINGERS[f].len, [0, 1, 2].map((j) => B.finger(f, j)), B.palm);
  });
  // thumb: its hexagon over the thenar, bridged to the hole in the palm side
  const hex = ringPoints(tc, tn, tup, THUMB.r, THUMB.r * 0.92, HEX).map((p) => mb.vert(p, B.palm, 0.7, B.thumb(0)));
  let hole = [R[1][21], R[1][22], R[1][23], R[1][0], R[2][0], R[3][0], R[3][23], R[3][22], R[3][21], R[2][21]];
  _d.set(0, 0, 0);
  for (let k = 0; k < hole.length; k++) _d.add(_e.crossVectors(mb.at(hole[k]).clone(), mb.at(hole[(k + 1) % hole.length]).clone()));
  if (_d.dot(tn) < 0) hole = hole.reverse();
  mb.bridge(hole, hex);
  digit(mb, hex, tc, tn, tup, THUMB.r, THUMB.len, [0, 1, 2].map(B.thumb), B.palm);
}

/** the sleeve: the cuff lip and band ride the forearm, the sleeve itself is stretched by its bone */
function sleeve(mb, colors = COLOR) {
  const X = new THREE.Vector3(1, 0, 0);
  const sl = (x, r, b, color) => ringPoints(new THREE.Vector3(x, 0, 0), X, Y, r, r, NGON(12)).map((p) => mb.vert(p, b, 1, b, color));
  const rings = [sl(SLEEVE.x - 1 / PX, SLEEVE.r, B.sleeve, colors.sleeve), sl(SLEEVE.x, SLEEVE.r, B.sleeve, colors.sleeve),
    sl(SLEEVE.x + 4, SLEEVE.cuff, B.fore, colors.cuff), sl(SLEEVE.front, SLEEVE.cuff, B.fore, colors.cuff), sl(SLEEVE.front, SLEEVE.lip, B.fore, colors.sleeve)];
  for (let i = 0; i + 1 < rings.length; i++) mb.loft(rings[i], rings[i + 1]);
}

/** the gloves themselves (glove-surface.js), built once per style, right hand at rest; the arms copy and mirror them */
const gloveRest = new Map();

/**
 * One arm (side 1: right, -1: left) as a single skinned mesh. Built as the right arm in px, then mirrored and scaled to
 * root units; bones: forearm (+Y back along the arm), sleeve (stretched), palm (the hand frame), finger and thumb chains.
 * glove: the navy glove of orthographic-v2 — one smooth closed surface for the hand and the cuff, the jacket sleeve
 * running on from inside the cuff.
 */
function arm(side, styleName = null) {
  const style = STYLES[styleName] ?? null, glove = !!style;
  const D = glove ? GLOVE : BARE;
  const mb = new Builder();
  const frames = D.FINGERS.map(fingerFrame);
  const tc = V(D.THUMB.at), tn = V(D.THUMB.n).normalize(), tq = bendFrame(tn, V(D.THUMB.to)), tup = Y.clone().applyQuaternion(tq);
  if (glove) {
    // the jacket sleeve from inside the cuff back along the forearm
    const fore = D.FOREARM.map(([x, w, t]) =>
      ringPoints(new THREE.Vector3(x, 0, 0), new THREE.Vector3(-1, 0, 0), Y, w / 2, t / 2, NGON(16)).map((p) => mb.vert(p, B.fore, 1, B.fore, style.sleeve)));
    for (let i = 0; i + 1 < fore.length; i++) mb.loft(fore[i], fore[i + 1]);
    sleeve(mb, { sleeve: style.sleeve, cuff: style.sleeve });
  } else {
    bareHand(mb, frames, tc, tn, tup);
    sleeve(mb);
  }

  // bones at rest (right hand, px)
  const group = new THREE.Group(), bones = [];
  const bone = (name, parent, pos, q = null) => {
    const b = new THREE.Bone();
    b.name = name;
    b.position.copy(pos).multiplyScalar(PX);
    if (q) b.quaternion.copy(q);
    parent.add(b);
    bones.push(b);
    return b;
  };
  const back = new THREE.Quaternion().setFromUnitVectors(Y, new THREE.Vector3(-1, 0, 0));
  const foreBone = bone('forearm', group, new THREE.Vector3(), back);
  const sleeveBone = bone('sleeve', group, new THREE.Vector3(SLEEVE.x, 0, 0), back);
  const palm = bone('palm', group, new THREE.Vector3());
  const digits = frames.map(({ c, x }, f) => {
    const F = D.FINGERS[f];
    const p = bone(`finger-${f}`, palm, c.clone().addScaledVector(x, D.KNUCKLE));
    p.rotation.y = F.splay;
    const m = bone(`finger-${f}-1`, p, new THREE.Vector3(F.len[0], 0, 0));
    return [p, m, bone(`finger-${f}-2`, m, new THREE.Vector3(F.len[1], 0, 0))];
  });
  const t0 = bone('thumb', palm, tc.clone().addScaledVector(tn, D.KNUCKLE), tq);
  const t1 = bone('thumb-1', t0, new THREE.Vector3(D.THUMB.len[0], 0, 0));
  const thumb = [t0, t1, bone('thumb-2', t1, new THREE.Vector3(D.THUMB.len[1], 0, 0))];
  const hold = bendFrame(V(D.THUMB.dir), V(D.THUMB.to));
  const mirror = (q) => q.set(-q.x, -q.y, q.z, q.w);
  if (side < 0) {
    for (let i = 2; i < mb.pos.length; i += 3) mb.pos[i] = -mb.pos[i];
    for (let i = 0; i < mb.tri.length; i += 3) [mb.tri[i + 1], mb.tri[i + 2]] = [mb.tri[i + 2], mb.tri[i + 1]];
    for (const b of bones) {
      b.position.z = -b.position.z;
      mirror(b.quaternion);
    }
    mirror(hold);
  }
  let geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(mb.pos.map((x) => x * PX), 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(mb.color, 3));
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(mb.skin, 4));
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(mb.weight, 4));
  geo.setIndex(mb.tri);
  geo.computeVertexNormals();
  if (glove) {
    // the glove surface and the sleeve tubes in one geometry
    if (!gloveRest.has(styleName)) gloveRest.set(styleName, gloveSurface(GLOVE, B, style));
    const g = gloveRest.get(styleName), n = g.pos.length / 3, m = mb.pos.length / 3;
    const pos = new Float32Array((n + m) * 3), nor = new Float32Array((n + m) * 3), col = new Float32Array((n + m) * 3);
    const skin = new Uint16Array((n + m) * 4), weight = new Float32Array((n + m) * 4);
    for (let i = 0; i < n * 3; i += 3) {
      pos[i] = g.pos[i] * PX; pos[i + 1] = g.pos[i + 1] * PX; pos[i + 2] = g.pos[i + 2] * PX * side;
      nor[i] = g.normal[i]; nor[i + 1] = g.normal[i + 1]; nor[i + 2] = g.normal[i + 2] * side;
    }
    pos.set(geo.attributes.position.array, n * 3);
    nor.set(geo.attributes.normal.array, n * 3);
    col.set(g.color);
    col.set(mb.color, n * 3);
    skin.set(g.skin);
    skin.set(mb.skin, n * 4);
    weight.set(g.weight);
    weight.set(mb.weight, n * 4);
    const index = new Uint32Array(g.index.length + mb.tri.length);
    for (let i = 0; i < g.index.length; i += 3) {
      index[i] = g.index[i];
      index[i + 1] = side > 0 ? g.index[i + 1] : g.index[i + 2];
      index[i + 2] = side > 0 ? g.index[i + 2] : g.index[i + 1];
    }
    for (let i = 0; i < mb.tri.length; i++) index[g.index.length + i] = mb.tri[i] + n;
    geo.dispose();
    geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('skinIndex', new THREE.BufferAttribute(skin, 4));
    geo.setAttribute('skinWeight', new THREE.BufferAttribute(weight, 4));
    geo.setIndex(new THREE.BufferAttribute(index, 1));
    // the rim goes round the glove surface only, not the jacket sleeve behind the cuff
    const hull = new Float32Array(n + m);
    hull.set(g.hull);
    geo.setAttribute('hull', new THREE.BufferAttribute(hull, 1));
    // how far along the arm each point was at rest (the cuff is painted by it); the sleeve tubes stay out of it
    const along = new Float32Array(n + m).fill(-1e3);
    for (let i = 0; i < n; i++) along[i] = g.pos[i * 3];
    geo.setAttribute('along', new THREE.BufferAttribute(along, 1));
  }
  const mesh = new THREE.SkinnedMesh(geo, armMaterial(style));
  // the support glove a shade darker than the shooting one, so where they overlap the two hands still read apart
  if (glove && side < 0) mesh.material.color.setScalar(0.8);
  mesh.userData.style = styleName ?? 'bare';
  mesh.name = side > 0 ? 'Right arm' : 'Left arm';
  mesh.frustumCulled = false;
  mesh.onBeforeRender = () => fadeArm(mesh, foreBone);
  group.add(mesh);
  group.updateMatrixWorld(true);
  const skeleton = new THREE.Skeleton(bones);
  mesh.bind(skeleton);
  let rim = null;
  if (glove) {
    rim = new THREE.SkinnedMesh(geo, outlineMaterial(mesh.material.userData.arm));
    rim.name = mesh.name + ' rim';
    rim.frustumCulled = false;
    rim.onBeforeRender = (renderer) => {
      fadeArm(mesh, foreBone);
      const u = rim.material.userData.hull;
      u.hullView.value.copy(renderer.getDrawingBufferSize(_view));
      u.hullPx.value = OUTLINE.px * renderer.getPixelRatio();
    };
    group.add(rim);
    rim.bind(skeleton, mesh.bindMatrix);
  }
  group.traverse((o) => { o.userData.noBounds = true; });
  const fingers = [...digits.map((chain) => ({ chain, thumb: false })), { chain: thumb, thumb: true }];
  return { group, mesh, rim, upper: sleeveBone, fore: foreBone, palm, digits, thumb, fingers, hold, side, dim: D,
    grip: new THREE.Vector3(), wrist: new THREE.Vector3(), elbow: new THREE.Vector3() };
}

// ---------------------------------------------------------------- holds
/**
 * a hold, concept px: the centre the fist closes round (p), the axis from the index to the little finger (g), where the
 * back of the hand faces (d), half the thickness held (r: where the palm starts before it is pressed on); thumb scales
 * how far the thumb may close, trig puts the index on the trigger, yaw turns the hand about its back
 */
const hold = (p, g, d, r, o = {}) => ({ p: V(p), g: V(g).normalize(), d: V(d).normalize(), r, yaw: 0, thumb: 1, trig: 0, ...o });

/**
 * shooting hand on the pistol grip: the front strap at the middle finger's height (the index then lies at the trigger),
 * grip axis, half the grip's width. The knuckles sit GRIP_BACK behind the front strap: the first finger bones run along
 * the grip's side, the middle joints come round its front corner, the rest wrap it; the forearm in line behind the grip.
 */
const GRIP = {
  glock19: [76, -110, -0.3, -0.95, 17], glock19x: [78, -100, -0.33, -0.944, 24], revolver: [23, -125, -0.28, -0.96, 23],
  uzi: [124, -82, -0.1, -0.99, 20], m870: [56, -60, -0.72, -0.69, 13], ak47: [44, -92, -0.23, -0.97, 21],
  plasma: [54, -134, -0.40, -0.92, 25], flamer: [51, -72, -0.1, -0.99, 17], cryo: [74, -99, -0.16, -0.99, 23],
  grenade: [29, -76, -0.1, -0.99, 16], tesla: [50, -97, -0.42, -0.91, 19.5], stapler: [62, -10, -0.49, -0.87, 32],
  laser: [98, -92, -0.30, -0.954, 14], saw: [61, -37, -0.36, -0.93, 12], crossbow: [36, -85, -0.36, -0.93, 21], rail: [58, -55, -0.33, -0.944, 15],
};
const GRIP_BACK = 50;
/** guns held by the wrist of the stock rather than a pistol grip: the hold is taken from the table as it is */
const STOCK_WRIST = new Set(['m870', 'stapler']);
/** the grip is taken at a slant: the little-finger side further forward, so the short fingers reach round too */
const GRIP_SLANT = -0.3;
/** the back of the shooting hand faces right and a little back: the palm wraps the backstrap */
const GRIP_BACKHAND = [-0.15, 0, 1];
// The v2 gloves have shorter fingers than the bare hands. Take these grips closer
// to the trigger, while the remaining fingers still fit the weapon's surface.
const TRIGGER_HOLD = {
  revolver: { x: 55 }, ak47: { x: 20 }, plasma: { x: 30 }, tesla: { x: 6 }, crossbow: { x: 10 },
  m870: { yaw: 0.15 }, stapler: { x: 10, yaw: 0 },
};
/**
 * support hand where one really takes each weapon: [how, x, y, half the thickness held, the part it rides on]. under: the
 * palm under a fore-end or a thin barrel, the fingers up its right side and over; side: the palm on the left of a tall
 * body, the fingers over its top; over: the palm on a carry or D-handle; vert: round a vertical grip
 */
const SUPPORT = {
  uzi: ['under', 196, 2, 36], m870: ['under', 294, -33, 25], ak47: ['under', 268, 0, 34],
  flamer: ['under', 235, 0, 11], cryo: ['vert', 300, -92, 27.5], grenade: ['under', 215, 0, 22], tesla: ['vert', 191, -82, 19.5],
  stapler: ['over', 175, 90, 17, 'armIn'], laser: ['vert', 218, -72, 17], saw: ['over', 165, 94, 10], crossbow: ['under', 118, -68, 23],
  rail: ['under', 156, -40, 22], minigun: ['over', 122, 94, 14], bow: ['vert', 59, -44, 13],
};
/** the frame of each kind of support hold (left hand): wrap axis, back of the hand, slant, thumb; and where its arm runs */
const SUPPORT_HOLD = {
  under: { g: [-1, 0, 0], d: [0, -0.8, 0.6], o: { yaw: -0.2, thumb: 0.6 }, arm: 'fore' },
  side: { g: [1, 0, 0], d: [0, -0.25, -1], o: { thumb: 0.5 }, arm: 'fore' },
  over: { g: [1, 0, 0], d: [0, 1, 0], o: { yaw: 0.5, thumb: 0.5 }, arm: 'over' },
  vert: { g: [0, -1, 0], d: [0, 0, -1], o: { thumb: 0.6 }, arm: 'fore' },
};
const PISTOLS = new Set(['glock19', 'glock19x', 'revolver', 'plasma']);
/**
 * Hand-set two-hand grips, solved once in hands.html against the weapon's outline instead of fitted on the fly. The
 * main pistol: the shooting hand round the grip with its index inside the guard on the trigger, its thumb round the
 * backstrap under the slide's travel; the support hand over its fingers from the left, its thumb along the grip's
 * left side, forward towards the guard. Each end joint bends 0.7 of the middle one (the tendons
 * couple them, so no finger kinks on its own). hold: fist point, back of the hand, turn about it (px; the grip axis and
 * half-width are GRIP's); fit: palm shift, index splay, the 15 bends (four fingers, thumb), the thumb's frame on the palm.
 */
const AUTHORED = {
  glock19x: {
    right: { arm: [-1, -0.7, 0.3], p: [78, -114, 0], d: [-0.149, 0, 0.989], yaw: -0.3, shift: -6.14, splay: 0.3,
      ang: [0.5, 0.64, 0.45, 0.95, 0.75, 0.52, 1.35, 0.35, 0.25, 1.45, 0.6, 0.42, 0, 0.4, 0.23], tq: [-0.475, 0.864, 0.117, 0.118] },
    left: { arm: [-1, -0.7, -0.3], p: [92, -132, 0], d: [0, 0, -1], yaw: -0.4, shift: -15.06, splay: 0,
      ang: [0.45, 0.15, 0.1, 0.6, 0.85, 0.6, 1, 0.7, 0.49, 1.1, 1.4, 0.98, 0, 0.28, 0.1], tq: [0.719, -0.169, 0.159, 0.655] },
  },

/** an authored fit as refit stores it */
const authoredFit = (a) => ({ shift: a.shift, splay: a.splay, ang: Float32Array.from(a.ang), tq: new THREE.Quaternion(...a.tq).normalize() });
const STOCKED = new Set(['m870', 'ak47', 'uzi', 'grenade', 'rail']);
/** where the straight arms run (root space): back along the gun, a little down, out to their own side */
const ARM = {
  right: V([-1, -0.1, 0.2]).normalize(),
  /** past a stock: further out and down, so the stock stays beside the forearm */
  stock: V([-1, -0.3, 0.5]).normalize(),
  pistol: V([-1, -0.1, -0.2]).normalize(),
  fore: V([-1, -0.16, -0.34]).normalize(),
  over: V([-1, -0.3, -0.4]).normalize(),
