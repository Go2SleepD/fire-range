/** fitted holds by weapon and kit: palm shift (px) and the 15 bends (four fingers, thumb) of each hold */
const FITS = new Map();

/** a hold solved into root space: fist centre, palm rotation, palm shift, bends */
const solved = () => ({ p: new THREE.Vector3(), q: new THREE.Quaternion(), r: 0, shift: 0, trig: 0, splay: 0, ang: new Float32Array(15),
  tq: new THREE.Quaternion() });

function mix(out, a, b, k) {
  out.p.lerpVectors(a.p, b.p, k);
  out.q.slerpQuaternions(a.q, b.q, k);
  out.tq.slerpQuaternions(a.tq, b.tq, k);
  for (const key of ['r', 'shift', 'trig', 'splay']) out[key] = a[key] + (b[key] - a[key]) * k;
  for (let i = 0; i < 15; i++) out.ang[i] = a.ang[i] + (b.ang[i] - a.ang[i]) * k;
  return out;
}

// ---------------------------------------------------------------- contact queries (root space)
const rc = new THREE.Raycaster();
/** distance along the ray to the first weapon surface, Infinity if none within far */
function rayMeshes(o, d, far, meshes) {
  if (!meshes.length) return Infinity;
  rc.set(o, d);
  rc.near = 0;
  rc.far = far;
  const hit = rc.intersectObjects(meshes, false)[0];
  return hit ? hit.distance : Infinity;
}

/** closest distance between segments p1q1 and p2q2 */
function segSeg(p1, q1, p2, q2) {
  const d1 = _x.subVectors(q1, p1), d2 = _y.subVectors(q2, p2), r = _z.subVectors(p1, p2);
  const a = d1.dot(d1), e = d2.dot(d2), f = d2.dot(r);
  let s = 0, t = 0;
  if (a <= 1e-12 && e <= 1e-12) return r.length();
  if (a <= 1e-12) t = clamp(f / e);
  else {
    const c = d1.dot(r);
    if (e <= 1e-12) s = clamp(-c / a);
    else {
      const b = d1.dot(d2), den = a * e - b * b;
      s = den > 1e-12 ? clamp((b * f - c * e) / den) : 0;
      t = (b * s + f) / e;
      if (t < 0) { t = 0; s = clamp(-c / a); } else if (t > 1) { t = 1; s = clamp((b - c) / a); }
    }
  }
  return _o.copy(p1).addScaledVector(d1, s).sub(_e.copy(p2).addScaledVector(d2, t)).length();
}

/** distance along the ray to the first capsule (sphere tracing), Infinity if none within far */
function rayCapsules(o, d, far, caps) {
  let t = 0;
  for (let i = 0; i < 64 && t < far && caps.length; i++) {
    _c.copy(o).addScaledVector(d, t);
    let near = Infinity;
    for (const k of caps) near = Math.min(near, segSeg(_c, _c, k.a, k.b) - k.r);
    if (near < 0.3 * PX) return t;
    t += Math.max(near, 0.5 * PX);
  }
  return Infinity;
}

/** closest distance between 2D segments ab and cd (plain [x, y] arrays) */
function segSeg2(a, b, c, d) {
  const pt = (p, q, r) => {
    const dx = r[0] - q[0], dy = r[1] - q[1], l = dx * dx + dy * dy;
    const t = l > 1e-12 ? clamp(((p[0] - q[0]) * dx + (p[1] - q[1]) * dy) / l) : 0;
    return Math.hypot(p[0] - q[0] - t * dx, p[1] - q[1] - t * dy);
  };
  const cross = (o, p, q) => (p[0] - o[0]) * (q[1] - o[1]) - (p[1] - o[1]) * (q[0] - o[0]);
  if (Math.sign(cross(a, b, c)) !== Math.sign(cross(a, b, d)) && Math.sign(cross(c, d, a)) !== Math.sign(cross(c, d, b))) return 0;
  return Math.min(pt(a, c, d), pt(b, c, d), pt(c, a, b), pt(d, a, b));
}

class WeaponHands {
  /** camera: () => the camera the arms run back past (null: a fixed long reach) */
  constructor(gun, id, camera = null) {
    this.gun = gun;
    this.id = id;
    this.camera = camera;
    this.root = new THREE.Group();
    this.root.name = 'Hands';
    this.root.userData.noBounds = true;
    this.right = arm(1, gun.m.handStyle);
    this.left = arm(-1, gun.m.handStyle);
    this.root.add(this.right.group, this.left.group);
    gun.m.root.add(this.root);
    const grip = gun.m.model.position.clone().divideScalar(-gun.m.model.scale.x);
    const [fx, gy, ax, ay, r] = GRIP[id] ?? [grip.x + 30, grip.y - 6, -0.2, -1, 16], gx = fx - GRIP_BACK;
    if (id === 'minigun') this.rightHold = hold([-70, 0, 0], [-0.26, -0.97, 0], [0, 0, 1], 18, { thumb: 0.3 });
    else if (id === 'bow') this.rightHold = hold([-50, -18, 0], [0, -1, 0], [0, 0, 1], 5, { thumb: 0.8, bend: [0.25, 1.45, 0.7] });
    else this.rightHold = hold([gx, gy, 0], [ax, ay, 0], GRIP_BACKHAND, r, { trig: 1, yaw: GRIP_SLANT });
    if (TRIGGER_HOLD[id]?.yaw != null) this.rightHold.yaw = TRIGGER_HOLD[id].yaw;
    this.armRight = STOCKED.has(id) ? ARM.stock : ARM.right;
    this.armLeft = ARM.fore;
    if (PISTOLS.has(id)) {
      // over the shooting hand's fingers from the left, a little lower, thumbs forward
      this.leftHold = hold([gx + 26 + ax * 10, gy + ay * 10, 0], [ax, ay, 0], [-0.25, 0, -1], r + 28, { thumb: 0.2, yaw: GRIP_SLANT });
      this.armLeft = ARM.pistol;
    } else {
      const [how, x, y, t, on] = SUPPORT[id] ?? ['under', grip.x + 140, -4, 22], k = SUPPORT_HOLD[how];
      this.leftHold = hold([x, y, 0], k.g, k.d, t, { ...k.o, on });
      this.armLeft = ARM[k.arm];
    }
    const set = AUTHORED[id];
    if (set) {
      // the forearms angle down and away, so they leave the frame at its bottom instead of facing the camera end-on
      this.armRight = V(set.right.arm).normalize();
      this.armLeft = V(set.left.arm).normalize();
      for (const [h, a] of [[this.rightHold, set.right], [this.leftHold, set.left]]) {
        h.p.set(...a.p);
        h.d.set(...a.d).normalize();
        h.g.set(ax, ay, 0).normalize();
        h.r = r;
        h.yaw = a.yaw;
      }
    }
    this.rightBase = this.rightHold.p.clone();
    this.leftBase = this.leftHold.p.clone();
    // reload holds: the magazine taken from the side, the slide racked over the top, shells thumbed in from below
    this.magHold = hold([0, 0, 0], [0, -1, 0], [0, 0, -1], 16, { thumb: 0.5 });
    this.rackHold = hold([0, 0, 0], [1, 0, 0], [0, 1, 0], 16, { yaw: 0.5, thumb: 0.6 });
    this.tubeHold = hold([0, 0, 0], SUPPORT_HOLD.under.g, SUPPORT_HOLD.under.d, 14, SUPPORT_HOLD.under.o);
    this.leverHold = hold([0, 0, 0], [1, 0, 0], [0, 1, 0], 8, { yaw: 0.5, thumb: 0.6 });

    this.qm = new THREE.Quaternion();
    this.rRest = solved();
    this.lRest = solved();
    this.rNow = solved();
    this.lNow = solved();
    this.t1 = solved();
    this.t2 = solved();
    this.refit();
  }

  anchor(point, out, parent = this.gun.m.model) {
    parent.updateWorldMatrix(true, false);
    this.gun.m.root.updateWorldMatrix(true, false);
    inv.copy(this.gun.m.root.matrixWorld).invert();
    return out.copy(point).applyMatrix4(parent.matrixWorld).applyMatrix4(inv);
  }

  /** the part a hold rides on */
  partOf(h) {
    return (h.on && this.gun.m[h.on]) || this.gun.m.model;
  }

  /** where the reloading hand takes the magazine (the incoming one, or the seated one), root space */
  magAnchor(out, mag) {
    const m = this.gun.m;
    if (!mag) return this.anchor(_mp.copy(m.magAxis).multiplyScalar(MAG_HOLD).add(m.magCenter), out, m.magSlot);
    return this.anchor(_mp.copy(m.magAxis).multiplyScalar(MAG_HOLD), out, mag);

  /** solves a hold for arm a into root space: point (px, on parent) the fist closes round, palm rotation, its fit */

    out.trig = h.trig;
    out.shift = fit ? fit.shift : 0;
    out.splay = fit ? fit.splay : 0;
    if (fit) out.ang.set(fit.ang);

  }

  // ---------------------------------------------------------------- fitting
  /**
   * Fits every hold to the weapon as it is built now (kit included) and caches it by weapon: presses the palm onto the
   * surface, closes each finger until it touches. Runs with the gun's root at the origin.
   */
  refit() {
    const m = this.gun.m, key = `${this.id}|${[...m.kit].sort().join(',')}`;
    let fit = FITS.get(key);

      // accumulate when attachments are changed and the hands are solved again.
      this.rightHold.p.copy(this.rightBase);
      this.leftHold.p.copy(this.leftBase);
      const r = m.root, saved = [r.position.clone(), r.quaternion.clone(), r.scale.clone()];
      r.position.set(0, 0, 0);
      r.quaternion.identity();
      r.scale.set(1, 1, 1);
      r.updateMatrixWorld(true);
      this.modelRotation();
      const all = [];
      m.model.traverseVisible((o) => { if (o.isMesh && !o.userData.noBounds) all.push(o); });
      const spheres = new Map();
      for (const o of all) {

        R.thumbAt = new THREE.Vector3(t.x - 40, t.y + 8, side);
        if (PISTOLS.has(this.id)) L.thumbAt = new THREE.Vector3(t.x - 6, t.y + 2, side);
      }
      let center = null;
      if (R.trig && trigger && !STOCK_WRIST.has(this.id)) {

        // joints to come round its corner; the fingers close round the grip's middle

        const ray = (from, dir, far) => {

        };

        const y = under < Infinity ? t.y - 170 + under - 16 : R.p.y + 13;
        const x0 = R.p.x + GRIP_BACK;
        // from just outside the grip, so nothing else in front of or behind it (prods, stocks) is measured
        const f = ray(new THREE.Vector3(x0 + 40, y - 10, 0), X.clone().negate(), 160);
        const b = ray(new THREE.Vector3(x0 - 130, y - 10, 0), X, 160);

        this.right.palm.updateMatrixWorld(true);
        const mcp = m.model.worldToLocal(this.right.digits[1][0].getWorldPosition(new THREE.Vector3()));
        const shift = new THREE.Vector3(0, y - mcp.y, 0);

          shift.x = front - Math.max(30, Math.min(46, (front - back) * 0.5 + 20)) - mcp.x;
          center = this.anchor(new THREE.Vector3((front + back) / 2, y - 10, 0), new THREE.Vector3());

      }

        R.p.set(...AUTHORED[this.id].right.p);
        L.p.set(...AUTHORED[this.id].left.p);

        fit.left = authoredFit(AUTHORED[this.id].left);

        if (this.id === 'bow') _p.x = m.nockX ?? _p.x;
        const rs = solve('right', this.right, R, _p.clone(), m.model, all, [], center);
        // the support hand closes over the shooting hand's fingers
        this.pose(this.right, Object.assign(rs, fit.right), this.armRight, 0);
        _p.copy(L.p);

        solve('left', this.left, L, _p.clone(), this.partOf(L), all, PISTOLS.has(this.id) ? this.capsules(this.right) : [],

      m.mag?.traverseVisible((o) => { if (o.isMesh) mags.push(o); });
      if (m.mag) solve('mag', reloader, this.magHold, _mp.copy(m.magAxis).multiplyScalar(MAG_HOLD).clone(), m.mag, mags);

      r.quaternion.copy(saved[1]);
      r.scale.copy(saved[2]);
      r.updateMatrixWorld(true);
      fit.rp = this.rightHold.p.clone();
      fit.lp = this.leftHold.p.clone();
      FITS.set(key, fit);
    }
    this.rightHold.p.copy(fit.rp);
    this.leftHold.p.copy(fit.lp);
    this.fit = fit;
    this.update();
  }

  /** the other hand's digits as capsules (root space) */
  capsules(a) {
    a.palm.updateMatrixWorld(true);
    const out = [];
    const add = (chain, r, len) => chain.forEach((b, j) => {
      const p = b.getWorldPosition(new THREE.Vector3());
      const q = new THREE.Vector3(len[j], 0, 0).multiplyScalar(PX).applyMatrix4(b.matrixWorld);
      out.push({ a: p, b: q, r: r * PX });

    add(a.thumb, a.dim.THUMB.r, a.dim.THUMB.len);
    return out;
  }

  /** presses the palm on and closes the fingers and thumb of arm a on hold s; returns { shift, ang } */
  fitHold(a, s, h, obs, ref) {
    const ang = new Float32Array(15);
    s.shift = 0;
    s.ang.fill(0);
    s.splay = 0;
    s.tq.copy(a.hold);
    s.trig = h.trig;
    this.pose(a, s, this.armRight, 0);
    a.palm.updateMatrixWorld(true);
    // palm: rays from inside the hand at the knuckles down through the palm, the nearest surface sets its depth (things
    // poking in from the back of the hand are left alone)
    const down = new THREE.Vector3(0, -1, 0).applyQuaternion(s.q);
    let gap = Infinity;
    for (const x of [62, 96]) for (const z of [-34, 0, 32]) {
      const t = a.dim.PALM.reduce((acc, [px, , th]) => (x >= px ? th : acc), a.dim.PALM[0][2]);
      const o = new THREE.Vector3(x, 12, z * a.side).multiplyScalar(PX).applyMatrix4(a.palm.matrixWorld);
      const hit = Math.min(rayMeshes(o, down, 200 * PX, obs.meshes), rayCapsules(o, down, 200 * PX, obs.caps));
      gap = Math.min(gap, hit / PX - 12 - t / 2);
    }
    const shift = gap < Infinity ? Math.max(-30, Math.min(50, gap - 1.5)) : 0;
    s.shift = shift;
    a.digits.forEach((chain, f) => {
      const F = a.dim.FINGERS[f];
      if (f === 0 && h.trigAt) {
        s.splay = this.reachIndex(a, s, this.anchor(h.trigAt, new THREE.Vector3()));
        ang.set(s.ang.subarray(0, 3), 0);
      } else ang.set(this.wrapDigit(a, s, chain, F.len, F.r, h.bend ?? BEND_MAX, f * 3, obs, ref), f * 3);
    });
    s.ang.set(ang);
    if (h.thumbAt) this.reachThumb(a, s, this.anchor(h.thumbAt, new THREE.Vector3()), obs);
    else {
      s.tq.copy(a.hold);
      const T = a.dim.THUMB;
      ang.set(this.wrapDigit(a, s, a.thumb, T.len, T.r, T.max.map((x) => x * h.thumb), 12, obs, ref), 12);
      s.ang.set(ang);
    }
    return { shift, ang: s.ang.slice(), splay: s.splay, tq: s.tq.clone() };
  }

  /**
   * Closes a digit round the weapon in its bending plane: the weapon's outline there comes from rays shot inwards at
   * `ref` (a point inside what is held); then the knuckle and middle joint are searched together (the end joint coupled
   * to the middle one) for the curl that hugs the outline without going into it (or into the other hand's capsules).
   * Returns the three bends.
   */
  wrapDigit(a, s, chain, lens, r, max, at, obs, ref) {
    s.ang.fill(0, at, at + 3);
    this.pose(a, s, this.armRight, 0);
    a.palm.updateMatrixWorld(true);
    const e = chain[0].matrixWorld.elements;
    const P0 = new THREE.Vector3(e[12], e[13], e[14]);
    const u = new THREE.Vector3(e[0], e[1], e[2]).normalize(), v = new THREE.Vector3(e[4], e[5], e[6]).normalize().negate();
    const w = new THREE.Vector3(e[8], e[9], e[10]).normalize();

    const to2 = (p) => [_c.subVectors(p, P0).dot(u), _c.subVectors(p, P0).dot(v)];
    const to3 = (q) => P0.clone().addScaledVector(u, q[0]).addScaledVector(v, q[1]);
    // only the parts the bending plane cuts near the finger
    const meshes = obs.meshes.filter((o) => {
      const b = obs.spheres.get(o);
      return Math.abs(_c.subVectors(b.c, c).dot(w)) < b.r + r * PX && b.c.distanceTo(c) < b.r + 200 * PX;
    });
    // the outline: consecutive hits joined, a miss breaks it
    const ring = [];
    for (let k = 0; k < 28; k++) {
      const t = (k / 28) * Math.PI * 2, dir = u.clone().multiplyScalar(Math.cos(t)).addScaledVector(v, Math.sin(t));
      const o = c.clone().addScaledVector(dir, 180 * PX), hit = rayMeshes(o, dir.clone().negate(), 180 * PX, meshes);
      ring.push(hit < Infinity ? to2(o.addScaledVector(dir, -hit)) : null);
    }

const FRINGE = ['#ffd23f', '#44c4ff', '#ff8a1f', '#7be36b', '#c783ff'];

function pinata(g) {
  ball(g, '#ff6fae', 0, 0, 0, 0.95, 0.95, 0.85, 'toy');
  FRINGE.forEach((c, i) => {
    const t = new THREE.Mesh(new THREE.TorusGeometry(0.9 - i * 0.02, 0.07, 10, 40), mat(c, 'toy'));
    t.rotation.set(Math.PI / 2, 0, 0);

      const it = this.items[(this.i + k) % this.items.length];
      if (!it.active) {
        this.i = (this.i + k + 1) % this.items.length;
        return it;
      }
    }
    const it = this.items[this.i]; // steal the oldest
    this.i = (this.i + 1) % this.items.length;
    return it;
  }
}

/**
 * Minimal rigid body: gravity, spin, bounce on bench/floor, then settles on its side.
 * `size` is the half-thickness used to rest on surfaces.
 */
class Body {
  constructor(obj, { size = 0.1, restitution = 0.38, life = 6, onDone = null, ground = groundAt } = {}) {
    this.obj = obj;
    this.ground = ground;
    this.size = size;
    this.rest = restitution;
    this.onDone = onDone;
    this.life = life;
    this.vel = new THREE.Vector3();
    this.ang = new THREE.Vector3();
    this.settled = false;
    this.t = 0;
    this.bounces = 0;
    this.baseScale = obj.scale.x;
    this.active = true;
  }

  step(dt) {
    const p = this.obj.position;
    this.t += dt;
    if (!this.settled) {
      // surface under the body *before* moving, so fast falls can't tunnel into the lane below
      const ground = this.ground(p.x, p.y - this.size, p.z);
      this.vel.y -= G * dt;
      p.addScaledVector(this.vel, dt);
      const w = this.ang.length();
      if (w > 1e-4) {
        _q.setFromAxisAngle(_v.copy(this.ang).divideScalar(w), w * dt);
        this.obj.quaternion.premultiply(_q);
      }
      if (p.y < ground + this.size) {
        p.y = ground + this.size;
        if (this.vel.y < 0) {
          const impact = -this.vel.y;
          this.vel.y = impact * this.rest;
          this.vel.x *= 0.55;
          this.vel.z *= 0.55;
          this.ang.multiplyScalar(0.5).add(_v.set(rand(-6, 6), rand(-6, 6), rand(-6, 6)));
          this.bounces++;
          if (impact < 1.4 || this.bounces > 5) {
            this.settled = true;
            this.vel.set(0, 0, 0);
            this.settleT = this.t;
            // lie on a side: align local ±Z with world up
            const z = _v.set(0, 0, 1).applyQuaternion(this.obj.quaternion);
            if (z.y < 0) z.negate();
            this.flatQ = new THREE.Quaternion().setFromUnitVectors(z, UP).multiply(this.obj.quaternion);
          }
        }
      }
    } else {
      this.obj.quaternion.slerp(this.flatQ, Math.min(1, dt * 14));
      const age = this.t - this.settleT;
      if (age > this.life) {
        const k = Math.max(0, 1 - (age - this.life) / 0.4);
        this.obj.scale.setScalar(this.baseScale * k);
        if (k <= 0) {
          this.active = false;
          this.obj.scale.setScalar(this.baseScale);
          this.onDone?.(this);
          return false;
        }
      }
    }
    return true;
  }
}

class FX {
  /** smoke: how many smoke puffs can be up at once (the tap game's many guns want more) */
  constructor(scene, { ground = groundAt, smoke = 260, projectileImpacts = true, polygon = false } = {}) {
    this.ground = ground;
    this.projectileImpacts = projectileImpacts;
    /** size of bullets, trails and impacts relative to the range view (the long trial hall sets > 1) */
    this.farScale = 1;
    this.scene = scene;
    this.bodies = [];
    this.polygon = polygon ? new PolygonProjectiles(scene) : null;
    this.wisps = []; // lingering barrel smoke: { get(out), t }

    // ---------------------------------------------------- muzzle flash: forward star + warm glow, one per lane at most
    const flashGeo = new THREE.PlaneGeometry(FLASH_W, FLASH_H);
    flashGeo.translate(FLASH_W * (0.5 - 0.08), 0, 0); // the gas starts at u = 0.08 of the texture
    const flashTex = flashTexture();
    const glowTex = glowTexture();
    const hotGeo = new THREE.LatheGeometry([[0, 0], [0.13, 0.04], [0.23, 0.25], [0.12, 0.58], [0, 1.1]].map(([r, x]) => new THREE.Vector2(r, x)), 8);
    hotGeo.rotateZ(-Math.PI / 2);
    this.flashes = new Pool(() => {
      const star = new THREE.Mesh(flashGeo, tintable(new THREE.MeshBasicMaterial({ map: flashTex, color: hdr(1.9, 1.6, 1.3), transparent: true, depthWrite: false, side: THREE.DoubleSide })));
      star.renderOrder = 7;
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: hdr(1.5, 0.7, 0.22), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
      glow.renderOrder = 6;
      const hot = new THREE.Mesh(hotGeo, new THREE.MeshBasicMaterial({ color: hdr(3.2, 2.8, 1.9), transparent: true, depthWrite: false }));
      hot.renderOrder = 8;
      star.visible = glow.visible = hot.visible = false;
      scene.add(star, glow, hot);
      return { star, glow, hot, active: false, t: 0, k: 1, flip: 1, dir: new THREE.Vector3(), get: null };
    }, 16);
    // a single warm light for the latest shot (a fixed light count keeps every shader compiled once)
    this.light = new THREE.PointLight('#ffa040', 0, 6, 1.6);
    this.lightT = 1;
    this.lightK = 0;
    scene.add(this.light);

    // ---------------------------------------------------- reward / destruction rings
    const ringGeo = new THREE.RingGeometry(0.8, 1, 48);
    this.rings = new Pool(() => {
      const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: hdr(1.4, 1.3, 1.15), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
      m.visible = false;
      scene.add(m);
      return { m, active: false, t: 0, dur: 0.2, s0: 0.1, s1: 1, a0: 1 };
    }, 12);

    // ---------------------------------------------------- shader smoke (smoke.js), tints per kind
    this.smoke = new Smoke(scene, smoke);
    this.smokeTints = {
      white: new THREE.Color('#eef1f8'),
      grey: new THREE.Color('#c3c9d8'),
      dust: new THREE.Color('#ecdcbc'),
      dark: new THREE.Color('#7c8296'),
      frost: new THREE.Color('#cdeeff'),
    };

    // ---------------------------------------------------- crumbs (impact debris)
    const crumbGeo = new THREE.IcosahedronGeometry(1, 0);
    this.crumbMats = new Map();
    this.crumbs = new Pool(() => {
      const m = new THREE.Mesh(crumbGeo, MAT.white);
      m.visible = false;
      m.castShadow = true;
      scene.add(m);
      return { m, active: false, body: null };
    }, 140);

    // ---------------------------------------------------- casings
    this.casings = new Pool(() => {
      const g = new THREE.Group();
      const body = new THREE.Mesh(casingGeometry(), MAT.brass);
      const head = new THREE.Mesh(shellHeadGeometry(), MAT.brass);
      body.castShadow = true;
      g.add(body, head);
      g.visible = false;
      scene.add(g);
      return { g, mesh: body, head, active: false, body: null, smoke: 0 };
    }, 80);

    // ---------------------------------------------------- lit 3D bullets + diameter-matched tails
    this.projectileShapes = projectileShapes();
    const trailGeo = new THREE.PlaneGeometry(1, 1);
    trailGeo.translate(-0.5, 0, 0); // x in [-1, 0]: scaled to the travelled length behind the head
    const trailMat = trailMaterial();
    this.projectileMats = PALETTES.map(p => {
      const trail = trailMat.clone();
      trail.uniforms.uColor.value.copy(p.accent);
      return { ...projectileMaterials(p.color), trail };
    });
    this.bullets = new Pool(() => {
      const g = new THREE.Group();
      const shape = this.projectileShapes.pistol;
      const slug = new THREE.Mesh(shape.geometry, this.projectileMats[0].body);
      const band = new THREE.Mesh(shape.band, this.projectileMats[0].band);
      const tr = new THREE.Mesh(trailGeo, trailMat);
      tr.renderOrder = 7;
      g.add(tr, slug, band);
      g.visible = false;
      scene.add(g);
      return { g, tr, slug, band, active: false, from: new THREE.Vector3(), to: new THREE.Vector3(), t: 0, dur: 0.1, size: 1, length: shape.length, diameter: shape.diameter, getTo: null, onArrive: null };
    }, 96);

    // ---------------------------------------------------- kitchen ammunition in flight: arrows, grenades, ice
    this.trailGeo = trailGeo;
    this.arrowTrail = trailMat.clone();
    this.arrowTrail.uniforms.uColor.value.copy(hdr(1.0, 1.0, 1.1));
    this.glowTex = glowTex;
    this.missilePools = {}; // kind -> Pool, built on first use

    // ---------------------------------------------------- beams: laser (redrawn every frame), railgun (fades)
    const beamGeo = new THREE.PlaneGeometry(1, 1);
    beamGeo.translate(0.5, 0, 0); // x in [0, 1]: scaled to the beam's length
    this.beams = new Pool(() => {
      const m = new THREE.Mesh(beamGeo, beamMaterial());
      m.renderOrder = 7;
      m.visible = false;
      scene.add(m);
      return { m, active: false, t: 0, life: 0.05, w: 0.1, grow: 0 };
    }, 32);

    // ---------------------------------------------------- impact bursts
    const burstTex = burstTexture();
    this.sparks = new Pool(() => {
      const s = new THREE.Sprite(tintable(new THREE.SpriteMaterial({ map: burstTex, color: hdr(1.6, 1.4, 1.2), transparent: true, depthWrite: false })));
      s.renderOrder = 7;
      s.visible = false;
      scene.add(s);
      return { s, active: false, t: 0, strength: 1, scale: 1 };
    }, 10);
    const sparkGeo = new THREE.ConeGeometry(1, 1, 4);
    this.glintMats = PALETTES.map(p => new THREE.MeshBasicMaterial({ color: p.accent }));
    this.glints = new Pool(() => {
      const m = new THREE.Mesh(sparkGeo, this.glintMats[0]);
      m.visible = false;
      scene.add(m);
      return { m, active: false, t: 0, life: 0.2, width: 0.04, length: 0.5, vel: new THREE.Vector3() };
    }, 72);

    // ---------------------------------------------------- flames: glowing additive blobs (flamethrower, burning junk)
    const flameTex = glowTexture();
    this.flames = new Pool(() => {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, color: hdr(2.4, 1.6, 0.6), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
      s.renderOrder = 7;
      s.visible = false;
      scene.add(s);
      return { s, active: false, t: 0, life: 0.5, size: 0.5, vel: new THREE.Vector3() };
    }, 110);

    // ---------------------------------------------------- tesla bolts: a jagged chain of thin glowing segments
    const zapGeo = new THREE.CylinderGeometry(1, 1, 1, 5, 1, true);
    const zapMat = new THREE.MeshBasicMaterial({ color: hdr(1.5, 2.5, 3.2), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    this.zaps = new Pool(() => {
      const g = new THREE.Group();
      for (let i = 0; i < ZAP_SEG; i++) g.add(new THREE.Mesh(zapGeo, zapMat));
      g.visible = false;
      g.renderOrder = 8;
      scene.add(g);
      return { g, active: false, t: 0, a: new THREE.Vector3(), b: new THREE.Vector3(), w: 0.05 };
    }, 14);
  }

  /** one blob of flame drifting with vel; it slows, rises, grows and burns out from white-yellow to dark red */
  flame(pos, vel, size = 0.5, life = 0.5) {
    const f = this.flames.get();
    f.active = true;
    f.t = 0;
    f.life = life;
    f.size = size * Math.min(1.6, Math.sqrt(this.farScale));
    f.vel.copy(vel);
    f.s.position.copy(pos);
    f.s.material.rotation = Math.random() * 6;
    f.s.visible = true;
  }

  /**
   * A shot of any gun by its stats (evolution, duel, ricochets): a bullet or the gun's own missile (arrow, bolt,
   * staple, saw blade, grenade, ice crystal — by kind), or instantly: the tesla's bolt, a lick of flame, a laser
   * flash, a railgun slug. stats: the shooter's computeStats.
   */
  shot(stats, from, getTo, onArrive, speed, size, tier, kind) {
    if (!stats.chain && !stats.stream && !stats.beam && !stats.rail) {
      this.fireBullet(from, getTo, onArrive, speed, size, tier, kind);
      return;
    }
    const end = getTo(new THREE.Vector3());
    if (stats.chain) this.zap(from, end, 0.06);
    else if (stats.beam) this.beam(from, end, 0.09, 0.09, 'laser');
    else if (stats.rail) this.rail(from, end, tier);
    else for (let k = 0; k < 2; k++) this.flame(from, _v2.subVectors(end, from).multiplyScalar(3.4 * (0.9 + Math.random() * 0.2)), 0.5 + Math.random() * 0.3, 0.45);
    onArrive?.(end);
  }

  /** a lightning bolt from a to b, re-jagged every frame while it lasts */
  zap(a, b, width = 0.05) {
    const z = this.zaps.get();
    z.active = true;
    z.t = 0;
    z.a.copy(a);
    z.b.copy(b);
    z.w = width;
    z.g.visible = true;
    this.layZap(z);
  }

  layZap(z) {
    const n = ZAP_SEG;
    let prev = _v2.copy(z.a);
    const len = z.a.distanceTo(z.b);
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / n;
      const p = _bx.lerpVectors(z.a, z.b, t);
      if (i < n - 1) p.add(_by.set(rand(-1, 1), rand(-1, 1), rand(-0.5, 0.5)).multiplyScalar(len * 0.07 * Math.sin(Math.PI * t) + 0.04));
      const seg = z.g.children[i];
      _bz.subVectors(p, prev);
      const l = _bz.length() || 1e-3;
      seg.position.copy(prev).addScaledVector(_bz, 0.5);
      seg.quaternion.setFromUnitVectors(UP, _bz.divideScalar(l));
      seg.scale.set(z.w, l, z.w);
      prev = _v.copy(p);
    }
  }

  // ======================================================== spawners
  /** getMuzzle(out) keeps the barrel smoke attached to the moving gun */
  /**
   * opts (the tap game): { scale: × the flash, noSmoke: flash only, no clouds or lingering wisp, smokeOnly: the clouds
   * and the wisp without the flash or the light (the tap game draws its own flash), off: nothing at all }
   */
  muzzleBlast(pos, dir, up, getMuzzle, blast = DEFAULT_BLAST, tier = 0, opts = null) {
    if (opts?.off) return;
    const p = palette(tier);
    const k = blast.scale * Math.min(1.6, Math.sqrt(this.farScale)) * (opts?.scale ?? 1);
    // kitchen guns: the bow only twangs; the flamethrower's jet is its own flash (lane.js), here just its light
    if (blast.kind === 'string') {
      return;
    }
    if (blast.kind === 'fire' || blast.kind === 'laser') {
      this.light.position.copy(pos).addScaledVector(dir, 0.8);
      this.lightT = 0;
      this.lightK = blast.kind === 'fire' ? 0.7 : 0.35;
      this.light.color.copy(blast.kind === 'fire' ? FIRE_LIGHT : LASER_LIGHT);
      return;
    }
    const tint = BLAST_TINT[blast.kind]; // cryo frost, tesla spark
    if (!opts?.smokeOnly) this.blastFlash(pos, dir, up, getMuzzle, k, p, tint, blast);
    if (blast.kind === 'spark' || opts?.noSmoke) return;
    // the lanes keep their smoke at least lane-sized; the tap game's guns are smaller and their smoke with them
    this.blastSmoke(pos, dir, up, getMuzzle, opts?.smokeOnly ? k : Math.max(0.9, Math.sqrt(k)), tint, blast);
  }

  /** the flash, the hot core, the glow and the shot light of muzzleBlast (tesla: a few arcs instead) */
  blastFlash(pos, dir, up, getMuzzle, k, p, tint, blast) {
    const f = this.flashes.get();
    f.active = true;
    f.t = 0;
    f.k = k * rand(0.92, 1.08);
    f.flip = Math.random() < 0.5 ? 1 : -1;
    f.dir.copy(dir);
    f.get = getMuzzle;
    f.star.position.copy(pos);
    faceAlong(f.star, dir);
    f.star.visible = f.glow.visible = f.hot.visible = true;
    f.hot.position.copy(pos);
    f.hot.quaternion.copy(f.star.quaternion);
    f.hot.material.opacity = 1;
    f.hot.scale.setScalar(k);
    f.star.scale.set(k, k * f.flip, 1);
    f.star.material.opacity = 1;
    f.glow.scale.setScalar(k * 2.6);
    f.glow.material.opacity = 0.5;
    f.star.material.color.copy(tint ? tint.star : p.color);
    f.glow.material.color.copy(tint ? tint.glow : p.accent);
    f.hot.material.color.copy(tint ? tint.hot : HOT);
    f.glow.position.copy(pos).addScaledVector(dir, 0.3 * k);

    this.light.position.copy(pos).addScaledVector(dir, 0.4);
    this.lightT = 0;
    this.lightK = k;
    this.light.color.copy(tint ? tint.light : p.accent);
    if (blast.kind === 'spark') {
      // no gas: a few short arcs crackle off the prongs instead
      for (let i = 0; i < 3; i++) {
        _v2.copy(pos).addScaledVector(dir, rand(0.3, 0.9) * k).addScaledVector(up, rand(-0.5, 0.5) * k);
        _v2.z += rand(-0.4, 0.4) * k;
        this.zap(pos, _v2, 0.022);
      }
    }
  }

  /** the gas of muzzleBlast: a fast jet, rounder clouds, and a wisp that lingers on the muzzle */
  blastSmoke(pos, dir, up, getMuzzle, smokeK, tint, blast) {
    // Fast pressure jet, then slower, rounder clouds. Size is independent of the reduced suppressed flash.
    const count = Math.min(7, Math.max(4, blast.smoke || 3));
    for (let i = 0; i < count; i++) {
      const jet = i < 2;
      const sp = (jet ? rand(8, 13) : rand(2, 5)) * smokeK;
      _v.copy(dir).multiplyScalar(sp).addScaledVector(up, rand(-0.6, 1.2));
      _v2.copy(pos).addScaledVector(dir, (0.18 + i * 0.13) * smokeK).addScaledVector(up, rand(-0.15, 0.15));
      this.puff(_v2, _v, (jet ? rand(0.27, 0.4) : rand(0.40, 0.62)) * smokeK,
        jet ? rand(0.32, 0.48) : rand(0.9, 1.45), tint ? 'frost' : jet ? 'white' : 'grey', jet ? 5 : 2.4, jet ? 0.7 : 0.5, jet ? 2.6 : 1.25);
    }
    if (getMuzzle) {
      const wisp = this.wisps.find((x) => x.get === getMuzzle);
      const k = smokeK < 0.9 ? smokeK : 1; // the lanes' smoke never goes under 0.9: their wisp stays as it was
      if (wisp) {
        wisp.t = 0.65;
        wisp.k = k;
      } else this.wisps.push({ get: getMuzzle, t: 0.65, k });
    }
  }

  ring(pos, normal, dur, s0, s1, a0, tier = 0) {
    const r = this.rings.get();
    r.active = true;
    r.t = 0;
    r.dur = dur;
    r.s0 = s0;
    r.s1 = s1;
    r.a0 = a0;
    r.m.position.copy(pos);
    r.m.quaternion.setFromUnitVectors(CAM_Z, normal);
    r.m.visible = true;
    r.m.material.color.copy(palette(tier).accent);
  }

  /** dust of a hit: the colour of what got hit, washed towards cream */
  dustTint(hex) {
    this.dustTints ??= new Map();
    let c = this.dustTints.get(hex);
    if (!c) this.dustTints.set(hex, (c = new THREE.Color(hex).lerp(this.smokeTints.dust, 0.55)));
    return c;
  }

  /** one smoke puff; kind = tint ('white' | 'grey' | 'dust' | 'dark') or a THREE.Color */
  puff(pos, vel, size, life, kind = 'white', drag = 3, alpha = 0.9, stretch = 1) {
    this.smoke.spawn(pos, vel, size, life, kind.isColor ? kind : this.smokeTints[kind], drag, alpha, stretch);
  }

  /** scale: the gun's size against a lane's (the tap game's guns are smaller and their brass with them) */
  ejectCasing(pos, bore, side, up, kind = 'pistol', ej = DEFAULT_EJECT, scale = 1) {
    const c = this.casings.get();
    if (c.body) c.body.active = false;
    const def = CASINGS[kind];
    c.mesh.geometry = def.body();
    c.mesh.material = MAT[def.bodyMat];
    c.head.visible = !!def.head;
    if (def.head) {
      c.head.geometry = def.head();
      c.head.material = MAT[def.headMat];
    }
    c.mesh.position.x = c.head.position.x = def.off; // spin around the middle
    c.active = true;
    c.g.visible = true;
    c.g.position.copy(pos);
    c.g.quaternion.setFromUnitVectors(_v.set(1, 0, 0), bore);
    c.g.scale.setScalar(PX * def.scale * scale);
    const body = new Body(c.g, {
      ground: this.ground,
      size: def.size * scale,
      restitution: 0.42,
      life: 7,
      onDone: () => {
        c.active = false;
        c.g.visible = false;
      },
    });
    const k = Math.sqrt(scale);
    body.vel
      .copy(side).multiplyScalar(rand(ej.side[0], ej.side[1]) * k)
      .addScaledVector(up, rand(ej.up[0], ej.up[1]) * k)
      .addScaledVector(bore, -rand(ej.back[0], ej.back[1]) * k);
    body.ang.set(rand(-4, 4), rand(-4, 4), 0).addScaledVector(side, rand(18, 32) * (Math.random() < 0.5 ? -1 : 1));
    c.body = body;
    c.smoke = 0; // s of smoke trail behind the hot case
    this.bodies.push(body);
    if (c.smoke > 0) this.puff(pos, _v.copy(up).multiplyScalar(1.2).addScaledVector(side, 0.8), 0.06, 0.4, 'grey', 4);
  }

  /** getTo(out) returns the (possibly moving) destination; onArrive(pos) fires on contact */
  fireBullet(from, getTo, onArrive, speed = 75, size = 1, tier = 0, kind = 'pistol') {
    if (this.polygon) { this.polygon.fire(from,getTo,onArrive,speed,size,tier,kind); return; }
    if (MISSILE[kind]) {
      this.missile(from, getTo, onArrive, speed, size, tier, kind);
      return;
    }
    const b = this.bullets.get();
    if (b.active) b.onArrive?.(b.to.clone()); // pool ran dry: land the stolen one now, never lose a hit
    b.active = true;
    size *= Math.min(1.6, Math.sqrt(this.farScale));
    b.size = size;
    const mats = this.projectileMats[Math.min(tier, this.projectileMats.length - 1)];
    const shape = this.projectileShapes[kind === 'rifle-long' ? 'rifle' : kind] || this.projectileShapes.pistol;
    b.slug.geometry = shape.geometry;
    b.band.geometry = shape.band;
    b.slug.material = mats.body;
    b.band.material = mats.band;
    b.tr.material = mats.trail;
    b.slug.scale.setScalar(size);
    b.band.scale.setScalar(size);
    b.length = shape.length * size;
    b.diameter = shape.diameter * size;
    b.tr.position.x = -b.length;
    b.t = 0;
    b.from.copy(from);
    b.getTo = getTo;
    getTo(b.to);
    b.dur = Math.max(0.05, b.from.distanceTo(b.to) / speed);
    b.onArrive = onArrive;
    b.g.position.copy(from);
    b.g.visible = true;
    faceAlong(b.g, _v.subVectors(b.to, from));
    b.tr.visible = false; // no subpixel sliver before the bullet base clears the muzzle
    b.tr.scale.set(1, b.diameter * 1.05, 1);
  }

/** giant heights by rank (world units): regular, the boss of a plain stage, mini-boss, workshop boss */
const GIANT_H = { giant: 6.0, stageBoss: 6.6, mini: 7.2, boss: 7.6 };
const GIANT_W = 6.6;

/** bounds of the meshes under obj (sprites and noBounds parts skipped), world space */
function meshBounds(obj, out) {
  out.makeEmpty();
  obj.updateMatrixWorld(true);
  obj.traverseVisible((o) => {
    if (!o.isMesh || o.userData.noBounds) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    out.union(_b2.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld));
  });
  return out;
}

/** resting bounds (root space) and bore height of a weapon model at root scale 1 (resets the root's pose) */
function measureGun(m) {
  const r = m.root;
  r.rotation.set(0, 0, 0);
  r.scale.setScalar(1);
  r.position.set(0, 0, 0);
  r.updateMatrixWorld(true);
  m.measure();
  return { rest: m.rest.clone(), bore: m.muzzleWorld(_v).y };
}

/**
 * root position and scale that put a measured gun at a screen slot { x, y, z (world point), len, mirror }: the grip
 * (the root) sits on the point, lifted so the gun's height centres on it; the barrel then turns into the hall.
 * Mirrored guns (scale.x < 0) face the other way round with their detailed right side still to the camera.
 */
function solveSlot(meas, slot, out) {
  const size = meas.rest.getSize(_v), c = meas.rest.getCenter(_c);
  const s = slot.len * (meas.sizeK ?? 1) / Math.max(0.01, size.x);
  out.pos.set(slot.x, slot.y - c.y * s, slot.z);
  out.s = s;
  return out;
}

/** Admin markers: reserved surface patches in green, recent contacts in magenta. */
class AimViz {
  constructor(scene) {
    this.group = new THREE.Group();
    const dotGeo = new THREE.SphereGeometry(1, 8, 6), dotMat = new THREE.MeshBasicMaterial({ color: '#ff3df0', depthTest: false });
    this.dots = [];
    for (let i = 0; i < 40; i++) {
      const d = new THREE.Mesh(dotGeo, dotMat);
      d.renderOrder = 20;
      d.visible = false;
      d.userData.t = 0;
      this.dots.push(d);
      this.group.add(d);
    }
    const planMat = new THREE.MeshBasicMaterial({ color: '#39ff88', depthTest: false });
    this.plans = Array.from({ length: 18 }, () => {
      const dot = new THREE.Mesh(dotGeo, planMat);
      dot.renderOrder = 20;
      dot.visible = false;
      this.group.add(dot);
      return dot;
    });
    this.i = 0;
    this.group.visible = false;
    scene.add(this.group);
  }

  hit(p) {
    const d = this.dots[this.i++ % this.dots.length];
    d.position.copy(p);
    d.userData.t = 3;
  }

  update(dt, on, skin) {
    this.group.visible = on;
    if (!on) return;
    const claims = [...skin.reservations.values()];
    this.plans.forEach((dot, i) => {
      dot.visible = i < claims.length;
      if (dot.visible) {
        skin.fromGrid(claims[i].c, dot.position);
        dot.scale.setScalar(0.085);
      }
    });
    for (const d of this.dots) {
      d.userData.t -= dt;
      d.visible = d.userData.t > 0;
      d.scale.setScalar(0.09);
    }
  }
}

class TapView {
  /** ctx: { project(v3) -> {x, y} screen px, onTapHit(p, res), onPetHit(p, dmg), onPressHit(p), onCoinCollect(p) } */
  constructor(scene, ctx, { shadowSize = 2048 } = {}) {
    this.scene = scene;
    this.ctx = ctx;
    this.arena = buildArena(scene, { shadowSize });
    this.laserSurfaces = [];
    scene.traverse(o => { if (o.isMesh && !o.material.transparent) this.laserSurfaces.push(o); });
    this.fx = new FX(scene, { ground: (x, y, z) => this.arena.ground(x, y, z), smoke: 900, projectileImpacts: false, polygon: true });
    this.fx.farScale = 1.6;
    this.aimViz = new AimViz(scene);
    /** Mesh muzzle plumes, surface particles and camera-facing needle tracers. */
    this.tfx = new TapFX(scene, this.fx, () => this.layoutCam);
    /** when the main gun last drew a tracer (fast taps draw one every TRACER_GAP s, the rest land unseen) */
    this.lastTracer = -1;
    this.time = 0;
    this.shake = 0;
    /** the camera the screen slots were laid out with (layout) */
    this.layoutCam = null;
    this.insets = { top: 0, bottom: 0, w: 1, h: 1 };

    // the main gun bottom, just right of the middle, the «Спарка» gun left of it; placed for real by layout()
    const tmp = { x: 0, y: 2, z: 4, len: 1.5 };
    this.main = this.makeEntry(GUN.weapon, { ...tmp, mirror: true }, { pop: false });
    // Muzzle smoke is disabled; firearms get a brief TapFX flash.
    this.main.gun.blastOpts = { off: true };
    // taps come at most every AimCycle hold (0.22 s): the slide's whole cycle fits, nothing is squeezed out of sight
    this.main.gun.minInterval = 0.22;
    this.twin = this.makeEntry(GUN.weapon, tmp, { pop: false });
    this.twin.gun.blastOpts = { off: true };
    this.twin.gun.m.root.visible = false;
    this.twinOn = false;

    /** hero guns by hero index: entry (makeEntry) + { i, stats, interval, t, evo, outline, glowT, phase, tilt } */
    this.heroes = [];
    this.heroLevels = [];
    this.heroEvos = [];

    // the giant
    this.junk = null;
    this.junkGen = 0;
    this.titanTop = 6;
    this.giantH = 6;
    /** the giant the camera frames (targetFrame): where it is going and where it is now */
    const P = ARENA.platform;
    this.frameGoal = { y: P.h + GIANT_H.giant / 2, h: GIANT_H.giant * 1.05, w: GIANT_W };
    this.frameNow = { ...this.frameGoal };
    this.titanMid = new THREE.Vector3(ARENA.titan.x, 3.5, ARENA.titan.z);
    this.dying = [];
    this.boundsCache = new Map();
    /** hit springs, flash and metal skin of the current giant (dressGiant) */
    this.react = null;
    /** Skins finishing their final bite after a kill. */
    this.husks = [];
    /** direction of the last shot that hit the giant (the kill bursts along it) */
    this.lastDir = new THREE.Vector3(0, 0, -1);
    /** where and when the giant was last hit (lumps come off there) */
    this.lastHit = { p: new THREE.Vector3(), dir: new THREE.Vector3(0, 0, -1), t: -1 };
    /** coins of the last kills on their way to the wallet */
    this.coins = [];
    /** asked by the hits, taken by the loop: freeze-frame seconds, camera push 0..1 */
    this.stopReq = 0;
    this.zoom = 0;
    this.weakGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: new THREE.Color(1.8, 1.3, 0.4),
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.weakGlow.renderOrder = 5;
    scene.add(this.weakGlow);

    // the press: open, following the boss timer down, or slamming
    this.ramY = ARENA.press.open;
    this.bossProgress = -1;
    this.slam = null;

    // Кряк
    this.pet = null;
    this.hop = null;

    // the piggy bank
    const pig = buildPig();
    this.pig = pig;
    this.pigRoot = new THREE.Group();
    this.pigRoot.add(pig.body);
    this.pigRoot.scale.setScalar(1.3);
    this.pigRoot.visible = false;
    pig.body.traverse((o) => o.isMesh && (o.castShadow = true));
    scene.add(this.pigRoot);
    this.pigFly = null;
  }

  // ------------------------------------------------------------------ guns in screen space
  /** A purchased gun glides to its slot and pops in when created. */
  makeEntry(id, slot, { pop = true } = {}) {
    const gun = new Gun(this.scene, this.fx, id, 1e6);
    gun.minInterval = 0.06;
    gun.upwardRecoil = true;
    const e = { id, gun, sil: false, slot, mirror: !!slot.mirror, yaw: 0, pitch: 0, roll: 0, aimQ: new THREE.Quaternion(), boreH: 0, aimCycle: new AimCycle(), meas: { ...measureGun(gun.m), sizeK: WEAPON_SIZE[id] ?? 1 },
      tgt: { pos: new THREE.Vector3(), s: 1 }, cur: { pos: new THREE.Vector3(), s: 0.01 } };
    e.hands = new WeaponHands(gun, id, () => this.layoutCam);
    e.laser = new WeaponLaser(this.scene, gun);
    solveSlot(e.meas, slot, e.tgt);
    e.cur.pos.copy(e.tgt.pos);
    e.cur.s = pop ? 0.01 : e.tgt.s;
    this.applyPose(e, 0, 0);
    return e;
  }

  setSlot(e, slot) {
    e.slot = slot;
    e.mirror = !!slot.mirror;
    solveSlot(e.meas, slot, e.tgt);
  }

  /** after the kit changed: measure again, keep the slot */
  remeasure(e) {
    e.meas = { ...measureGun(e.gun.m), sizeK: WEAPON_SIZE[e.id] ?? 1 };
    e.hands.refit(); // the kit changed the weapon's shape: the hands take it again
    solveSlot(e.meas, e.slot, e.tgt);
    this.applyPose(e, 0, 0);
  }

  /** moves the gun k of the way to its slot, bobbing by `bob` */
  applyPose(e, k, bob) {
    e.cur.pos.lerp(e.tgt.pos, k);
    e.cur.s += (e.tgt.s - e.cur.s) * k;
    const r = e.gun.m.root;
    r.position.copy(e.cur.pos);
    r.position.y += bob;
    r.scale.set((e.mirror ? -1 : 1) * e.cur.s, e.cur.s, e.cur.s);
    r.quaternion.copy(e.aimQ);
    e.boreH = e.meas.bore * e.cur.s;
    e.gun.casingScale = e.cur.s; // brass the size of this gun, not of a lane's
  }

  /**
   * turns a gun's bore towards p (k = share of the way this frame); the recoil springs stay on the pivot.
   * A mirrored gun's bore is -X before the rotation, hence the flipped yaw and pitch.
   */
  aim(e, p, k, maxPitch = 0.6) {
    const r = e.gun.m.root, o = r.position;
    const dx = p.x - o.x, dz = p.z - o.z;
    const flat = Math.max(0.5, Math.hypot(dx, dz));
    const yaw = e.mirror ? Math.atan2(dz, -dx) : Math.atan2(-dz, dx);
    const lift = clamp(Math.atan2(p.y - o.y - e.boreH, flat), -maxPitch, maxPitch);
    const pitch = e.mirror ? -lift : lift;
    const desired = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, pitch));
    // the shooter's pistol is canted: rolled about its own bore, so it aims the same and shows the camera its side
    if (e.cant) desired.multiply(_qc.setFromAxisAngle(_X, e.cant));
    e.aimQ.slerp(desired, k); r.quaternion.copy(e.aimQ);
    e.yaw = r.rotation.y; e.pitch = r.rotation.z; e.roll = r.rotation.x;
  }

  /** world point on the screen point (nx, ny in NDC) at `depth` from the layout camera; visible width there */
  screenPoint(nx, ny, depth, out = new THREE.Vector3()) {
    const cam = this.layoutCam;
    out.set(nx, ny, 0.5).unproject(cam).sub(cam.position).normalize().multiplyScalar(depth).add(cam.position);
    return out;
  }

  visibleWidth(depth) {
    const cam = this.layoutCam;
    return 2 * depth * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * cam.aspect;
  }

  /**
   * camera: the base camera (no shake); insets: px of the battle area under the bars on top and the skills below.
   * Lays the guns out round the giant: the Glock in the ring's first place, the «Спарка» gun just in front of it.
   */
  layout(camera, insets) {
    this.layoutCam = camera.clone();
    this.layoutCam.updateMatrixWorld(true);
    this.layoutCam.updateProjectionMatrix();
    this.insets = insets;
    if (this.heroLevels.length && !this.heroes.some(Boolean)) this.syncHeroes(this.heroLevels, this.heroEvos);
    else this.layoutRoster();
  }

  /** Two live guns occupy both sides. Only purchased guns appear in the range. */
  layoutRoster() {
    if (!this.layoutCam) return;
    const live = this.heroes.filter((e) => e && !e.sil);
    const count = 1 + live.length;
    const slots = this.ringSlots(count===2?3:count);
    const mainSlot = { ...slots[count === 2 ? 1 : 0] };
    // Leave room for the concept's two gloved wrists above the HUD; the pistol big enough to read its hands.
    mainSlot.ny += TUNE.mainLift;
    mainSlot.nx += TUNE.mainX;
    if (TUNE.mainDepth > 0) {
      // deeper at the same screen size: aiming at the giant from further off its line, it shows the camera its side
      const dist = Math.max(1, this.layoutCam.position.z - ARENA.titan.z);
      mainSlot.depth = dist * TUNE.mainDepth;
      mainSlot.len = this.visibleWidth(mainSlot.depth) * mainSlot.size;
    }
    mainSlot.len *= TUNE.mainSize;
    this.main.cant = THREE.MathUtils.degToRad(TUNE.mainCant);
    const mainPoint = this.screenPoint(mainSlot.nx, mainSlot.ny, mainSlot.depth);
    Object.assign(mainSlot, { x: mainPoint.x, y: mainPoint.y, z: mainPoint.z });
    this.setSlot(this.main, mainSlot);
    live.forEach((e, i) => this.setSlot(e, slots[count === 2 ? 2 : i + 1]));
    const glock = this.main.slot;
    const twin = this.screenPoint(glock.nx + 0.2, glock.ny + 0.04, glock.depth * 0.88);
    this.setSlot(this.twin, { x: twin.x, y: twin.y, z: twin.z, len: this.visibleWidth(glock.depth * 0.88) * glock.size * 0.85, mirror: glock.mirror });
  }

  /** the first n places of the ring (RING) for the camera laid out with; place 0 is the Glock's */
  ringSlots(n) {
    const out = [];
    if (!this.layoutCam) return out;
    const { top, bottom, h } = this.insets;
    const yTop = 1 - (2 * top) / h, yBot = -1 + (2 * Math.min(bottom, h - top - 80)) / h;
    const mid = (yTop + yBot) / 2, band = yTop - yBot;
    const dist = Math.max(1, this.layoutCam.position.z - ARENA.titan.z);
    const perSide = Math.ceil((n - 1) / 2);
    const step = THREE.MathUtils.degToRad(Math.min(RING.step, RING.arc / Math.max(1, perSide)));
    const size = RING.size.find(([max]) => n <= max)[1];
    for (let i = 0; i < n; i++) {
      const k = Math.ceil(i / 2), th = -Math.PI / 2 + (i % 2 ? -1 : 1) * k * step;
      const nx = TUNE.ringRx * Math.cos(th), ny = mid + band * TUNE.ringRy * Math.sin(th);
      const depth = dist * Math.max(0.03, THREE.MathUtils.lerp(TUNE.ringFar, TUNE.ringBottom, Math.max(0, -Math.sin(th))));
      const p = this.screenPoint(nx, ny, depth);
      out.push({ x: p.x, y: p.y, z: p.z, len: this.visibleWidth(depth) * size, mirror: i === 0 || nx > 0.001, nx, ny, depth, size });
    }
    return out;
  }

  /** where n hero guns go: the ring's places after the Glock's */
  heroSlots(n) {
    return this.ringSlots(n + 1).slice(1);
  }

  /**
   * the giant's middle and size for the camera (tap-main): the last giant's (goal) or, by default, the frame gliding
   * towards it — so the camera neither jumps between giants nor while the next one is on its way
   */
  targetFrame(goal = false) {
    const T = ARENA.titan, f = goal ? this.frameGoal : this.frameNow;
    return { x: T.x, z: T.z, y: f.y, h: f.h, w: f.w };
  }

  setFloor(idx) {
    this.arena.setTheme(WORKSHOPS[FLOORS[idx].theme]?.theme ?? {});
  }

  // ------------------------------------------------------------------ hero guns
  /**
   * Purchased guns glide to their slots and get smaller as the roster grows.
   */
  syncHeroes(levels, evos) {
    this.heroLevels = levels.slice();
    this.heroEvos = evos.slice();
    // no ring to put them in before the first layout(): it builds them from heroLevels then
    if (!this.layoutCam) return;
    const shown = levels.filter(l => l > 0).length;
    const slots = this.heroSlots(shown);
    HEROES.forEach((h, i) => {
      const want = levels[i] > 0 ? 'gun' : null;
      let e = this.heroes[i];
      if (e && want === null) {
        this.removeHero(e);
        e = this.heroes[i] = null;
      }
      if (!want) return;
      if (!e) {
        e = this.makeEntry(h.weapon ?? h.id, slots[levels.slice(0,i).filter(l => l > 0).length]);
        Object.assign(e, { i, evo: 0, t: Math.random(), outline: null, glowT: 0, phase: i * 1.37 });
        // its own magazine, then a quick reload (visual: its DPS has HERO.reloadK taken off for it)
        e.mag = e.ammo = h.mag ?? WEAPONS[h.id].magSize ?? 8;
        // a shot every 0.5 s at most: fifteen guns must not turn the screen into a firework
        e.interval = Math.max(0.5, 1 / Math.min(HERO.visualRate, h.rate ?? WEAPONS[h.id].fireRate));
        e.stats = computeStats({ weapon: h.weapon === 'plasma' ? 'flamer' : h.weapon ?? h.id, scale: 1 }, {}, 0);
        e.gun.blastOpts = { off: true };
        this.heroes[i] = e;
      } else this.setSlot(e, slots[levels.slice(0,i).filter(l => l > 0).length]);
      if (!e.sil && e.evo !== evos[i]) this.setHeroEvo(e, evos[i]);
    });
    this.layoutRoster();
  }

  removeHero(e) {
    e.plan?.getTo.release();
    this.scene.remove(e.gun.m.root);
    e.outline?.dispose();
    e.hands?.dispose();
    e.laser?.dispose();
  }

  setHeroEvo(e, evo) {
    e.evo = evo;
    e.gun.m.setEvo(evo, EVO_KITS[e.id === 'plasma' ? 'flamer' : e.id]);
    e.gun.fxTier = evo;
    e.gun.reset();
    e.stats = computeStats({ weapon: e.id === 'plasma' ? 'flamer' : e.id, scale: 1 }, {}, evo);
    this.remeasure(e);
  }

  /** an evolution just happened: the gun outlines in its new tier colour for a moment */
  celebrateHero(i) {
    const e = this.heroes[i];
    if (!e || e.sil) return;
    e.outline?.dispose();
    e.outline = evolutionOutline(e.gun.m.root, FX_TIERS[Math.max(1, e.evo)].color);
    e.glowT = 2.2;
  }

  /** screen point of a hero gun (for confetti) */
  heroScreen(i) {
    const e = this.heroes[i];
    if (!e) return null;
    return this.ctx.project(meshBounds(e.gun.m.root, _box).getCenter(_v));
  }

  /**
   * a reload of any gun: its own reload clip (magazine out and in, or shells into the tube, the rack — gun.js) played
   * in TUNE.reload s; it does not shoot meanwhile
   */
  quickReload(e) {
    const g = e.gun;
    e.aimCycle.reload(this.time, TUNE.reload);
    if (g.spec.reload !== 'tube' && !g.m.mag) return; // no magazine model (flamer, laser…): no clip to play
    g.reloadDur = TUNE.reload;
    // tube guns load their shells one by one: give the clip a few to load (their count is otherwise endless)
    if (g.spec.reload === 'tube') g.ammo = g.magSize - Math.min(6, e.mag ?? 6);
    g.startReload();
  }

  /**
   * A hero shot down the prepared bore: one projectile with its patch reserved until contact, a burst (VOLLEY: the
   * rest follow from update, burstRound) or a load of buckshot, each pellet on a patch of its own round the aim.
   */
  heroShot(e) {
    if (!this.junk) return;
    const getTo = this.shotFor(e);
    if (!getTo) return;
    const aim = getTo(new THREE.Vector3());
    this.alignShot(e, aim);
    const v = VOLLEY[e.id];
    e.aimCycle.shot(this.time, (e.stats.lob || e.stats.saw ? .28 : .22) + (v?.burst ? v.gap * (v.burst - 1) : 0));
    const { pos, dir } = e.gun.kick();
    this.heroMuzzle(e, pos, dir);
    if (v?.pellets) {
      const share = e.fraction / v.pellets;
      this.heroRound(e, getTo, pos, share, 0.45);
      for (let k = 1; k < v.pellets; k++) {
        const to = this.aimOnGiant(pos, false, null, share);
        if (to) this.heroRound(e, to, pos, share, 0.45);
      }
    } else if (v?.burst) {
      const share = e.fraction / v.burst;
      this.heroRound(e, getTo, pos, share);
      e.burst = { left: v.burst - 1, t: v.gap, gap: v.gap, fraction: share, gen: this.junkGen };
    } else this.heroRound(e, getTo, pos, e.fraction);
    this.spendRound(e);
  }

  /** the next round of a running burst once its gap is up; true while the burst holds the gun */
  burstRound(e, dt) {
    const b = e.burst;
    if (!this.junk || b.gen !== this.junkGen || e.gun.state === 'reload') {
      e.burst = null;
      return false;
    }
    b.t -= dt;
    if (b.t > 0) return true;
    const to = this.aimOnGiant(e.gun.m.muzzleWorld(new THREE.Vector3()), false, null, b.fraction);
    if (to) {
      this.alignShot(e, to(new THREE.Vector3()));
      const { pos, dir } = e.gun.kick();
      this.heroMuzzle(e, pos, dir);
      e.aimCycle.shot(this.time, 0.22);
      this.heroRound(e, to, pos, b.fraction);
    }
    if (--b.left <= 0) e.burst = null;
    else b.t += b.gap;
    this.spendRound(e);
    return true;
  }

  /** the k-th of n points in an even disc of radius r round aim, across the line from `from`, turned by `turn` */
  spreadAt(aim, from, k, n, r, turn, out) {
    const f = new THREE.Vector3().subVectors(aim, from).normalize();
    const side = new THREE.Vector3().crossVectors(f, THREE.Object3D.DEFAULT_UP).normalize();
    const up = new THREE.Vector3().crossVectors(side, f);
    const a = k * 2.39996 + turn, d = r * Math.sqrt((k + 0.5) / n);
    return out.copy(aim).addScaledVector(side, Math.cos(a) * d).addScaledVector(up, Math.sin(a) * d);
  }

  heroMuzzle(e, pos, dir) {
    if (TRACED.has(e.gun.spec.ammo)) this.tfx.muzzle(pos, dir, e.slot.len * 0.46, e.gun.muzzleGetter,
      e.evo >= 3 ? PALETTE.cool : PALETTE.shot, out => e.gun.m.boreDir(out));
  }

  /** one round (or pellet: size < 1) from the muzzle to its reserved patch; it eats `fraction` there on contact */
  heroRound(e, getTo, pos, fraction, size = 1) {
    const gen = this.junkGen;
    const done = (p) => {
      const result = this.heroImpact(e, p, gen, pos, fraction);
      getTo.release();
      return result;
    };
    if (e.id === 'flamer') {
      this.tfx.stream(e.gun.muzzleGetter, getTo, done, Math.min(.16, e.slot.len * .045));
    } else if (TRACED.has(e.gun.spec.ammo)) {
      this.tfx.tracer(pos, getTo, done, 0.55 * size, e.evo >= 3 ? PALETTE.cool : PALETTE.shot, 5);
    } else {
      // Energy weapons also have travel time; arrows and staples keep their own solid models.
      const ammo = e.stats.chain ? 'electric' : e.stats.beam ? 'laser' : e.stats.rail ? 'rail' : e.gun.spec.ammo;
      if (['plasma','ice','electric','laser','rail','grenade'].includes(ammo)) this.tfx.muzzle(pos,e.gun.m.boreDir(new THREE.Vector3()),e.slot.len*.3,e.gun.muzzleGetter,ammoPalette(ammo),out=>e.gun.m.boreDir(out));
      this.fx.fireBullet(pos, getTo, done, 80, (e.gun.spec.pellet ?? 1) * 0.65 * size, e.evo, ammo);
    }
  }

  /** a round off the magazine; the last one starts the reload (and ends a burst) */
  spendRound(e) {
    if (--e.ammo > 0) return;
    e.ammo = e.mag;
    e.burst = null;
    this.quickReload(e);
  }

  heroImpact(e, p, gen, from, fraction) {
    const live = this.junk && gen === this.junkGen;
    if (!live) return 'drop';
    const s = e.stats;
    p = this.settle(from, p.clone());
    if (!p) return 'drop';
    const dir = _hd.subVectors(p, from).normalize();
    const n = this.react.skin.normalAt(p, _n);
    this.markHit(p, dir);
    // eating: the HP the guns took since the last bite comes out here
    const skin = this.react.skin;
    skin.setHp(this.react.titan.hp / this.react.titan.maxHp);
    const bite = skin.hit(p, dir, fraction);
    const paint = this.paint();
    // heavy shots (grenade, railgun, saw, crossbow, bow) hit hard and show it; the rest just sting
    const heavy = s.lob || s.rail || s.saw || s.pierce > 1;
    if (heavy) {
      this.tfx.impact(p, n, dir, s.lob ? 1.4 : 1, s.rail ? ammoPalette('rail') : PALETTE.shot, { sparks: s.lob ? 8 : 5, flakes: 2, paint, bite, fill: fillHex(paint), surface: this.junk.def.material });
      if (s.lob) this.tfx.bursts.emit(p,n,2.2,PALETTE.shot,{sparks:10,bite:Math.min(.8,bite),ring:true});
      this.hitReact(0.3, e.cur.pos.x);
    } else {
      const pal = ['cell','laser','rail','plasma','ice'].includes(e.gun.spec.ammo) ? ammoPalette(s.chain?'electric':s.beam?'laser':s.rail?'rail':e.gun.spec.ammo) : e.evo >= 3 ? PALETTE.cool : PALETTE.shot;
      if (bite > 0) this.tfx.impact(p, n, dir, 0.55, pal, { sparks: 2, flakes: 0, paint, bite, fill: fillHex(paint), surface: this.junk.def.material });
      else if (Math.random() < 0.4) this.tfx.impact(p, n, dir, 0.55, pal, { sparks: 2, flakes: 0 });
      this.hitReact(0.06, e.cur.pos.x);
    }
    return 'through'; // the material was eaten: no arrow should float inside the resulting hole
  }

  // ------------------------------------------------------------------ the giant
  /** bounds of a giant kind at root scale 1 (cached) */
  baseBounds(j) {
    const k = `${j.kind}|${j.variant}`;
    if (!this.boundsCache.has(k)) {
      j.root.position.set(0, 0, 0);
      j.root.scale.setScalar(1);
      this.boundsCache.set(k, meshBounds(j.root, new THREE.Box3()));
    }
    return this.boundsCache.get(k);
  }

  /** t: the giant (TapGame); hits: estimate for the shared surface planner. */
  spawnTitan(t, hits = 10) {
    const j = new RangeTarget(t.kind, t.variant);
    const box = this.baseBounds(j);
    const size = box.getSize(_v), c = box.getCenter(_c);
    const s = Math.min((GIANT_H[t.rank] ?? GIANT_H.giant) / size.y, GIANT_W / Math.max(size.x, size.z));
    const T = ARENA.titan, P = ARENA.platform;
    j.root.scale.setScalar(s);
    j.root.position.set(T.x - c.x * s, P.h - box.min.y * s, T.z - c.z * s);
    j.alive = true;
    j.pop = 0;
    this.scene.add(j.root);
    j.root.updateMatrixWorld(true);
    this.junk = j;
    this.junkGen++;
    this.junkScale = s;
    this.giantH = size.y * s;
    this.frameGoal = { y: P.h + this.giantH / 2, h: this.giantH * 1.05, w: Math.max(size.x, size.z) * s };
    this.titanTop = P.h + this.giantH;
    this.titanMid.set(T.x, P.h + this.giantH * 0.5, T.z);
    this.dressGiant(j, s, t, hits);
  }

  /**
   * the giant gets its volumetric skin (GiantBreak), its hit
   * flash (the skin's emissive) and its hit springs: squash (sq), shove along X (push), lean away from the shot, a
   * little twist, shake
   */
  dressGiant(j, s, t, hits) {
    const skin = new RangeBreak(j, this.fx, this.scene);
    this.react = { j, titan: t, skin, flashColor: FLASH_WHITE.clone(), base: j.root.position.clone(), s, sq: 0, sqV: 0, push: 0, pushV: 0,
      lean: 0, leanV: 0, twist: 0, twistV: 0, flashT: 0, flashK: 0, flashCd: 0, shake: 0 };
  }

  /** a colour of the current giant's paint (for flakes) */
  paint() {
    const c = this.junk?.colors;
    return c?.length ? c[Math.floor(Math.random() * c.length)] : null;
  }

  /** A fixed local point on the live surface. The token is shared by every weapon's planner. */
  aimOnGiant(from, weak = false, prev = null, fraction = null, pull = 1) {
    const j = this.junk, skin = this.react?.skin;
    if (!j || !skin) return null;
    const token = {};
    const aim = skin.pick(from, prev ?? this.titanMid, new THREE.Vector3(), token, fraction, pull);
    if (!aim) return null;
    const local = j.root.worldToLocal(aim.clone());
    const getTo = (out) => out.copy(local).applyMatrix4(j.root.matrixWorld);
    getTo.release = () => skin.release(token);
    getTo.skin = skin;
    getTo.token = token;
    getTo.fraction = fraction;
    return getTo;
  }

  ensurePlan(e) {
    if (!this.junk || e.sil) return null;
    if (e.plan && e.plan.gen !== this.junkGen) { e.plan.getTo.release(); e.plan = null; }
    if (e.plan?.gen === this.junkGen) {
      const p = e.plan.getTo(new THREE.Vector3()), from = e.gun.m.muzzleWorld(new THREE.Vector3());
      const hit = this.settle(from, p.clone());
      const claim = e.plan.getTo.skin.reservations.get(e.plan.getTo.token);
      const valid = hit && hit.distanceTo(p) < this.react.skin.grid.cell * this.junkScale * 1.5;
      if (valid && claim && Math.abs((e.fraction ?? 0) - e.plan.fraction) <= Math.max(0.001, e.plan.fraction * 0.4)) return e.plan.getTo;
      e.plan.getTo.release();
      e.plan = null;
    }
    if (this.holdingAim(e)) return null;
    if (this.time < (e.planRetry ?? 0)) return null;
    const from = e.gun.m.muzzleWorld(new THREE.Vector3());
    const getTo = this.aimOnGiant(from, false, e.lastAim, e.fraction);
    if (!getTo) {
      e.planRetry = this.time + 0.12;
      return null;
    }
    e.plan = { gen: this.junkGen, titanGen: this.react.titan.gen, getTo, fraction: e.fraction ?? 0 };
    return getTo;
  }

  /** Keep the chosen point until contact. Only then may another gun claim its area. */
  shotFor(e) {
    const getTo = this.ensurePlan(e);
    if (!getTo) return null;
    e.lastAim = getTo(new THREE.Vector3());
    e.plan = null;
    return getTo;
  }

  /** Called before the rules apply tap damage, so the kill starts at this shot's actual point. */
  prepareTap(twin = false, share = 1, fraction = null) {
    if (!this.junk) return true;
    const e = twin ? this.twin : this.main;
    if (this.holdingAim(e)) return false;
    e.fraction = fraction ?? (this.main.fraction || 1 / Math.max(1, this.react.titan.maxHp)) * share;
    const getTo = this.ensurePlan(e);
    if (!getTo) return false;
    if (!this.aimReady(e, getTo)) return false;
    const p = getTo(new THREE.Vector3()), from = e.gun.m.muzzleWorld(new THREE.Vector3());
    this.markHit(p, new THREE.Vector3().subVectors(p, from).normalize());
    this.lastDir.copy(this.lastHit.dir);
    return true;
  }

  planned(e, mid) {
    return this.ensurePlan(e)?.(_ap) ?? mid;
  }

  holdingAim(e) {
    const r = e.gun.rec;
    const settled = Math.abs(r.a) < .018 && Math.abs(r.y) < .018 && Math.abs(r.b) < .035
      && Math.abs(r.av) < .25 && Math.abs(r.yv) < .25;
    return e.aimCycle.holding(this.time, e.gun.state === 'reload' || e.gun.state === 'locked', settled);
  }

  aimReady(e, getTo = e.plan?.getTo) {
    if (!getTo || this.holdingAim(e)) return false;
    const from = e.gun.m.muzzleWorld(new THREE.Vector3()), target = getTo(new THREE.Vector3());
    const desired = target.sub(from).normalize(), actual = e.gun.m.boreDir(new THREE.Vector3());
    return actual.dot(desired) > .999;
  }

  updateAim(e, mid, k) {
    // Hold the resting root angles: the recoil/reload pivot returns along the very same aiming line.
    if (this.holdingAim(e)) return;
    const p = this.planned(e, mid);
    if (e.sil) { this.aim(e, p, 1, 1.3); return; }
    // Aim with the real animated bore, then interpolate the resting angles. The final shot correction
    // is tiny because shooting is allowed only after this smooth translation has settled.
    const before = e.aimQ.clone();
    this.alignShot(e, p);
    // Interpolate orientations, since Euler angles flip at the almost straight-ahead central slot.
    e.aimQ.slerpQuaternions(before, e.aimQ.clone(), k);
    const r = e.gun.m.root; r.quaternion.copy(e.aimQ);
    e.yaw = r.rotation.y; e.pitch = r.rotation.z; e.roll = r.rotation.x;
  }

  /** Correct the barrel's animated pivot too, so its actual axis passes through the chosen point. */
  alignShot(e, target) {
    this.aim(e, target, 1, Math.PI / 2);
    const r = e.gun.m.root;
    for (let i = 0; i < 3; i++) {
      r.updateMatrixWorld(true);
      const from = e.gun.m.muzzleWorld(new THREE.Vector3());
      const bore = e.gun.m.boreDir(new THREE.Vector3());
      const desired = new THREE.Vector3().subVectors(target, from).normalize();
      r.quaternion.premultiply(new THREE.Quaternion().setFromUnitVectors(bore, desired));
    }
    r.updateMatrixWorld(true);
    e.yaw = r.rotation.y;
    e.pitch = r.rotation.z;
    e.roll = r.rotation.x;
    e.aimQ.copy(r.quaternion);
  }

  settle(from, p) {
    return this.react?.skin.raycast(from, _v.subVectors(p, from).normalize(), p) ?? null;
  }

  /** the white flash over the giant for a couple of frames (k: 0..1 strength); at most 3 a second (WCAG 2.3.1) */
  flashGiant(k, crit) {
    const r = this.react;
    if (!r || (r.flashCd > 0 && r.flashT <= 0)) return;
    r.flashColor.copy(crit ? FLASH_CRIT : FLASH_WHITE);
    r.flashK = r.flashT > 0 ? Math.max(r.flashK, k) : k;
    if (r.flashT <= 0) r.flashCd = 0.34;
    r.flashT = 2.5 / 60;
  }

  /**
   * a hit lands: strength ~0.06 (a light gun) … 1 (a crit) … 2 (the press); fromX = where the shot came from (the
   * giant leans away from it); down = from above (squash only). The dents carry most of the feel: the springs are soft.
   */
  hitReact(strength, fromX, { crit = false, down = false } = {}) {
    const r = this.react;
    if (!r || r.j !== this.junk) return;
    const side = fromX < ARENA.titan.x ? 1 : -1;
    r.sqV += (down ? 9 : 3.5) * strength;
    if (!down) {
      r.pushV += side * 0.9 * strength;
      r.leanV -= side * 1.1 * strength;
      r.twistV += (Math.random() - 0.5) * 1.2 * strength;
    }
    if (crit || down) {
      this.flashGiant(down ? 0.8 : 0.6, crit);
      r.shake = Math.max(r.shake, down ? 0.3 : 0.15);
    }
  }

  updateReact(dt) {
    const r = this.react, j = this.junk;
    if (!r || r.j !== j) return;
    r.sqV += (-260 * r.sq - 15 * r.sqV) * dt;
    r.sq = clamp(r.sq + r.sqV * dt, -0.2, 0.28);
    r.pushV += (-110 * r.push - 11 * r.pushV) * dt;
    r.push = clamp(r.push + r.pushV * dt, -0.5, 0.5);
    r.leanV += (-150 * r.lean - 10 * r.leanV) * dt;
    r.lean = clamp(r.lean + r.leanV * dt, -0.18, 0.18);
    r.twistV += (-120 * r.twist - 9 * r.twistV) * dt;
    r.twist = clamp(r.twist + r.twistV * dt, -0.25, 0.25);
    r.shake = Math.max(0, r.shake - dt);
    const jx = r.shake > 0 ? (Math.random() - 0.5) * r.shake * 0.6 : 0;
    const jy = r.shake > 0 ? (Math.random() - 0.5) * r.shake * 0.25 : 0;
    j.root.position.set(r.base.x + r.push + jx, r.base.y + jy, r.base.z);
    j.root.scale.setScalar(r.s);
    j.root.rotation.set(0, r.twist, r.lean);
    // the flash holds full, then half for a frame, then it is off: no slow fade
    r.flashT -= dt;
    r.flashCd -= dt;
    r.skin.setFlash(r.flashT > 1 / 60 ? r.flashK * 0.75 : r.flashT > 0 ? r.flashK * 0.35 : 0, r.flashColor);
    // Note the HP owed to the next projectile impacts.
    const t = r.titan, h = this.lastHit;
    if (t.hp > 0) {
      r.skin.setHp(t.hp / t.maxHp, h.p, h.dir);
    }
  }

  /** remembers where the giant was last hit (the next lump comes off there) */
  markHit(p, dir) {
    this.lastHit.p.copy(p);
    this.lastHit.dir.copy(dir);
    this.lastHit.t = this.time;
    if (TUNE.showSpread) this.aimViz.hit(p);
  }

  /**
   * The final crater consumes the remainder from p; the skin leaves the scene when it finishes.
   */
  shatter(j, p, power, dir) {
    const r = this.react?.j === j ? this.react : null;
    if (!r) {
      this.scene.remove(j.root);
      return;
    }
    this.react = null;
    r.skin.setFlash(0);
    r.skin.kill(p, dir, power);
    this.husks.push(r.skin);
  }

  /** TT2's gold drop: coins spill out of the giant, bounce, and each is pulled into the wallet a moment later */
  coinBurst(c, n) {
    for (let k = 0; k < n; k++) {
      const m = new THREE.Mesh(COIN_GEO, COIN_MAT);
      m.castShadow = true;
      m.position.copy(c).add(_v.set(rand(-1, 1), rand(-0.5, 1), rand(0.3, 1.2)));
      m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
      this.scene.add(m);
      const vel = new THREE.Vector3(rand(-5, 5), rand(5, 9), rand(2, 5));
      const ang = new THREE.Vector3(rand(-14, 14), rand(-14, 14), rand(-14, 14));
      const body = this.fx.drop(m, vel, ang, 0.06, () => this.scene.remove(m));
      this.coins.push({ m, body, t: 0, life: rand(0.7, 1.1) });
    }
  }

  updateCoins(dt) {
    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i];
      c.t += dt;
      if (c.t < c.life) continue;
      c.body.active = false;
      this.scene.remove(c.m);
      this.ctx.onCoinCollect?.(this.ctx.project(c.m.position));
      this.coins.splice(i, 1);
    }
  }

  /** Global HP overlay anchor and size, measured through the currently rendered camera. */
  titanAnchor() {
    const j = this.junk;
    if (!j) return null;
    const box = this.baseBounds(j), head = box.getCenter(new THREE.Vector3());
    head.y = box.max.y;
    j.root.updateMatrixWorld(true);
    j.root.localToWorld(head);
    head.y += 0.4;
    const p = this.ctx.project(head);
    const left = this.ctx.project(new THREE.Vector3(head.x - this.frameGoal.w / 2, head.y, head.z));
    const right = this.ctx.project(new THREE.Vector3(head.x + this.frameGoal.w / 2, head.y, head.z));
    return { ...p, width: Math.abs(right.x - left.x) * 1.45 };
  }

  /** screen point over the giant's head (popups) */
  titanScreen() {
    return this.ctx.project(_v.set(ARENA.titan.x, this.titanTop + 0.4, ARENA.titan.z));
  }

  /**
   * the giant is down: a ring and a star where it stood, it splits into a few solid lumps that hop off sideways, a short
   * freeze and push in
   */
  killTitan(boss = false) {
    const j = this.junk;
    if (!j) return null;
    const paint = this.paint();
    this.junk = null;
    this.junkGen++;
    const c = this.titanMid.clone();
    const dir = _hd.copy(this.lastDir);
    // calm on purpose: the lumps hopping off are the show, so one star, a few sparks and a ring — no spray, no smoke
    this.tfx.impact(c, _n.set(0, 0.3, 1).normalize(), dir, boss ? 1.8 : 1.3, boss ? PALETTE.crit : PALETTE.shot, { sparks: 4, flakes: 0, paint });
    this.tfx.ring(c, boss ? 1.8 : 1.4, boss ? PALETTE.crit : PALETTE.shot);
    this.shatter(j, this.time - this.lastHit.t < 0.5 ? this.lastHit.p : c, boss ? 1.3 : 1, dir);
    this.shake = Math.min(1, this.shake + (boss ? 0.7 : 0.35));
    this.zoom = Math.max(this.zoom, boss ? 0.8 : 0.35);
    this.stopReq = Math.max(this.stopReq, boss ? 0.18 : 0.05);
    return c;
  }

  /** the current giant leaves the hit springs (it shrinks or gets crushed instead); returns what to dispose after */
  releaseGiant(j) {
    const r = this.react?.j === j ? this.react : null;
    if (!r) return null;
    this.react = null;
    r.skin.setFlash(0);
    this.husks.push(r.skin);
    return { skin: r.skin };
  }

  /** «Бой с боссом» / «Отступить»: the giant on the platform just shrinks away */
  despawnTitan() {
    const j = this.junk;
    if (!j) return;
    this.junk = null;
    this.junkGen++;
    this.dying.push({ j, t: 0, mode: 'fade', s: this.junkScale, rest: this.releaseGiant(j) });
  }

  /** the press got the boss: slam it flat, no coins */
  crushTitan() {
    const j = this.junk;
    this.junk = null;
    this.junkGen++;
    this.bossProgress = -1;
    const rest = j ? this.releaseGiant(j) : null;
    this.startSlam(ARENA.platform.h + 0.05, () => {
      if (j) this.dying.push({ j, t: 0, mode: 'crush', s: this.junkScale, rest });
      const c = _v.set(ARENA.titan.x, ARENA.platform.h + 0.4, ARENA.titan.z + 2);
      for (let k = 0; k < 6; k++) this.fx.puff(c, _w.set(rand(-4, 4), rand(0.2, 1.2), rand(0, 2)), 0.8, 1.2, 'grey', 3, 0.7);
      this.shake = 1;
    });
  }

  // ------------------------------------------------------------------ the press
  /** p in 0..1 of the boss timer (the ram follows it down to the boss's head), < 0 = no boss */
  setBossProgress(p) {
    this.bossProgress = p;
  }

  startSlam(to, onHit) {
    this.slam = { t: 0, from: this.ramY, to, hit: false, onHit };
  }

  /** «Удар пресса»: the ram drops on the giant's head, flattens it a moment, dents its top, goes back up */
  pressStrike() {
    this.startSlam(this.titanTop - 0.2, () => {
      const p = _v.set(ARENA.titan.x, this.titanTop, ARENA.titan.z + 0.8);
      const down = _w.set(0, -1, 0);
      this.markHit(p, down);
      this.react?.skin.hit(p, down, 0.2);
      this.tfx.impact(p, _n.set(0, 1, 0.5).normalize(), down, 2.6, PALETTE.crit, { sparks: 8, flakes: 3, paint: this.paint() });
      this.tfx.ring(p, 2.2, PALETTE.crit);
      for (let k = 0; k < 3; k++) this.fx.puff(p, _w.set(rand(-3, 3), rand(0.2, 1), rand(0, 1.5)), 0.6, 0.7, 'white', 3, 0.45);
      this.hitReact(2, ARENA.titan.x, { crit: true, down: true });
      this.shake = 1;
      this.zoom = Math.max(this.zoom, 0.6);
      this.stopReq = Math.max(this.stopReq, 0.1);
      this.ctx.onPressHit?.(p.clone());
    });
  }

  updatePress(dt) {
    if (this.slam) {
      const s = this.slam;
      s.t += dt;
      const down = 0.12, hold = 0.18, up = 0.45;
      if (s.t < down) this.ramY = s.from + (s.to - s.from) * Math.pow(s.t / down, 2);
      else if (s.t < down + hold) {
        this.ramY = s.to;
        if (!s.hit) {
          s.hit = true;
          s.onHit?.();
        }
      } else if (s.t < down + hold + up) {
        const k = easeOut((s.t - down - hold) / up);
        this.ramY = s.to + (this.restRam() - s.to) * k;
      } else this.slam = null;
    } else {
      this.ramY += (this.restRam() - this.ramY) * Math.min(1, dt * 6);
    }
    this.arena.setRam(this.ramY);
  }

  /** where the ram rests: open, or lowered on the boss as its time runs out */
  restRam() {
    const open = ARENA.press.open;
    if (this.bossProgress < 0 || !this.junk) return open;
    return open + (this.titanTop + 0.15 - open) * clamp(this.bossProgress, 0, 1);
  }

  // ------------------------------------------------------------------ the main gun
  /**
   * a tap: the main gun (or the «Спарка» gun) fires; res from TapGame.tap() (null: nothing to hit). The flash is drawn at
   * the muzzle, the shot lands on the giant's real surface ~3 frames later (a needle tracer shows it, at most one every
   * TRACER_GAP s when tapping fast): a star, sparks and crumbs there, and the giant reels; a crit also carves a lump off,
   * with a hard ring and a short freeze (the lumps of lost HP come off in updateReact).
   */
  shoot(res, twin = false) {
    const e = twin ? this.twin : this.main;
    // A lethal tap already detached the skin; its prepared local point still belongs to this projectile.
    const dyingPlan = res && e.plan?.titanGen === res.gen && !this.junk;
    const getTo = res ? dyingPlan ? e.plan.getTo : this.shotFor(e) : null;
    if (dyingPlan) e.plan = null;
    if (res && this.junk && !getTo) return;
    if (getTo) this.alignShot(e, getTo(_ap));
    e.aimCycle.shot(this.time);
    const { pos, dir: bore } = e.gun.fire({ x: 0, y: 0.3 });
    if (e.gun.ammo < 1000) e.gun.ammo = e.gun.magSize;
    const crit = !!res?.crit;
