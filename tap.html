const mulText = (x) => (x >= 10 ? fmt(x) : (Math.round(x * 10) / 10).toString());

/** seconds -> m:ss, or h:mm:ss from an hour on */
function clockText(sec) {
  const t = Math.floor(sec), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), x = String(t % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;
}

class TapHud {
  /**
   * act: { buyGun(mode), buyHero(i, mode), upgradeSkill(id), cast(id), prestige(), newMachine(), upgradeMachine(id),
   *        fightBoss(), leaveBoss(), claimQuest(), buyShop(id), useSkin(id), equipGear(id), salvageGear(id), upgradeGear(id),
   *        choosePet(id), upgradeNode(id), resetTree(), claimDaily(id), claimLogin(), startTourney(), cheats() }
   */
  constructor(game, act) {
    this.g = game;
    this.act = act;
    this.mode = 1;
    this.tab = 'gun';
    this.listKey = '';
    this.refreshT = 0;
    this.toasts = [];
    this.battle = $('tt-battle');
    this.pops = $('tt-pops');
    /** the HP bar: a light trail shows what was just lost, the bar jolts on a real bite */
    this.hp = { gen: -1, last: 1, trail: 1, hold: 0, hitT: 0 };

    // tabs and the buy multiplier
    const tabs = $('tt-tabs');
    for (const t of TABS) {
      const b = el('button', 'tt-tab', `<span class="ic">${t.icon}</span><span>${t.label}</span><i class="dot"></i>`);
      b.dataset.tab = t.id;
      b.addEventListener('click', () => this.onTab(t.id));
      tabs.append(b);
    }
    const mult = $('tt-mult');
    for (const m of MODES) {
      const b = el('button', 'tt-m', m === 'max' ? 'MAX' : `×${m}`);
      b.dataset.m = m;
      b.addEventListener('click', () => {
        this.mode = m;
        this.refresh(true);
      });
      mult.append(b);
    }

    // skill buttons
    const row = $('tt-skill-row');
    this.skillEls = {};
    for (const sk of SKILLS) {
      const b = el('button', 'tt-skill locked', `<span class="ring"></span><span class="ic">${sk.icon}</span><i class="cd"></i><small class="mana">${sk.mana}</small><em class="lock">ур.${sk.unlock}</em>`);
      b.title = sk.name;
      b.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        this.act.cast(sk.id);
      });
      row.append(b);
      this.skillEls[sk.id] = b;
    }

    $('tt-list').addEventListener('click', (e) => this.onListClick(e));
    $('tt-boss-btn').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (this.g.s.farm) this.act.fightBoss();
      else this.act.leaveBoss();
    });
    // the objective bar: a tap shows where to do it; a finished one waits for «Забрать» (TT2's Collect)
    $('tt-quest').addEventListener('click', (e) => {
      if (e.target.closest('.qclaim')) this.act.claimQuest();
      else this.guideQuest();
    });
    for (const [id, open] of [['tt-login-btn', () => this.openLogin()], ['tt-daily-btn', () => this.openDaily()], ['tt-tourney-btn', () => this.openTourney()]]) {
      $(id).addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        open();
      });
    }
    $('tt-cheat-btn').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      this.act.cheats();
    });
    this.onTab('gun');
  }

  // ------------------------------------------------------------------ tabs and the list
  get machinesOpen() {
    const s = this.g.s;
    return s.prestiges > 0 || s.blueprints > 0 || this.g.ownedMachines.length > 0;
  }

  onTab(id) {
    if (id === 'machines' && !this.machinesOpen) {
      this.toast('⚙️', 'Станки', `Откроются после первой пересменки (этап ${PRESTIGE.unlock})`);
      return;
    }
    if (id === 'gear' && !this.g.gearOpen) {
      this.toast('🔩', 'Обвес', `После первой пересменки: детали падают с босса этапа ${GEAR.from} и дальше`);
      return;
    }
    if (id === 'pets' && !this.g.petOn) {
      this.toast('🐥', 'Ручной хлам', 'Босс этапа 8 держит в клетке утёнка — освободи его');
      return;
    }
    if (id === 'shop' && !this.g.shopOpen) {
      this.toast('🛒', 'Лавка', 'Откроется с первыми золотыми патронами — их даёт первый босс цеха (этап 5)');
      return;
    }
    this.tab = id;
    for (const b of $('tt-tabs').children) b.classList.toggle('on', b.dataset.tab === id);
    $('tt-list').scrollTop = 0;
    this.refresh(true);
  }

  guideQuest() {
    const k = this.g.quest.kind;
    if (k === 'hire' || k === 'evolve') this.onTab('heroes');
    else if (k === 'machine') this.onTab('machines');
    else this.onTab('gun');
    if (k === 'prestige') $('tt-list').querySelector('[data-k="prestige"]')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  onListClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    let ok = false;
    if (a === 'gun') ok = this.act.buyGun(this.mode);
    else if (a === 'hero') ok = this.act.buyHero(+b.dataset.i, this.mode);
    else if (a === 'skill') ok = this.act.upgradeSkill(b.dataset.id);
    else if (a === 'prestige') this.act.prestige();
    else if (a === 'newMachine') this.act.newMachine();
    else if (a === 'machine') ok = this.act.upgradeMachine(b.dataset.id);
    else if (a === 'shop') ok = this.act.buyShop(b.dataset.id);
    else if (a === 'skin') ok = this.act.useSkin(b.dataset.id);
    else if (a === 'equip') ok = this.act.equipGear(+b.dataset.id);
    else if (a === 'salvage') ok = this.act.salvageGear(+b.dataset.id);
    else if (a === 'gearUp') ok = this.act.upgradeGear(+b.dataset.id);
    else if (a === 'pet') ok = this.act.choosePet(b.dataset.id);
    else if (a === 'tree') this.openTree();
    if (ok) {
      b.closest('.tt-card')?.classList.remove('flash');
      void b.offsetWidth;
      b.closest('.tt-card')?.classList.add('flash');
    }
    this.refresh(true);
  }

  /** which cards the open tab shows (rebuilt only when this changes) */
  structure() {
    const g = this.g, s = g.s;
    if (this.tab === 'gun') return `gun|${SKILLS.map((sk) => g.skillLevel(sk.id) > 0).join()}|${g.treeOpen}|${g.prestigeOpen}`;
    if (this.tab === 'heroes') return `heroes|${HEROES.map((h, i) => g.heroLevel(i) > 0).join()}`;
    if (this.tab === 'shop') return `shop|${Object.keys(s.skins).join()}|${s.skin}`;
    if (this.tab === 'gear') return `gear|${s.gear.map((x) => `${x.id}:${x.level}`).join()}|${Object.values(s.gearOn).join()}`;
    if (this.tab === 'pets') return `pets|${PETS.map((p) => s.pets[p.id] || 0).join()}|${s.pet}`;
    return `machines|${MACHINES.map((m) => (s.machines[m.id] || 0) > 0).join()}|${g.newMachineCost}`;
  }

  buildList() {
    const list = $('tt-list');
    list.replaceChildren();
    const g = this.g;
    if (this.tab === 'gun') {
      $('tt-panel-title').textContent = 'Стрелок';
      list.append(this.card('gun', '🎯', '', 'gun'));
      for (const sk of SKILLS) {
        const lvl = g.skillLevel(sk.id);
        const c = el('div', `tt-card skill${lvl ? '' : ' locked'}`, `<div class="tt-thumb emoji">${sk.icon}</div>
          <div class="tt-info"><b class="tt-name">${sk.name} <small data-f="lvl"></small></b>
          <span class="tt-stat" data-f="text"></span><span class="tt-next">${lvl ? `заряд ${sk.mana}` : `откроется на ур. стрелка ${sk.unlock}`}</span></div>
          ${lvl ? `<button class="tt-buy" data-act="skill" data-id="${sk.id}"><small>улучшить</small><span class="cost" data-f="cost"></span></button>` : ''}`);
        c.dataset.k = `skill:${sk.id}`;
        list.append(c);
      }
      const tr = el('div', `tt-card tree${g.treeOpen ? '' : ' locked'}`, `<div class="tt-thumb emoji">🎖️</div>
        <div class="tt-info"><b class="tt-name">Квалификация</b><span class="tt-stat" data-f="text"></span><span class="tt-next">значок за каждые ${BADGE_EVERY} этапов рекорда</span></div>
        ${g.treeOpen ? '<button class="tt-buy" data-act="tree"><small>открыть</small><span class="cost" data-f="cost"></span></button>' : ''}`);
      tr.dataset.k = 'tree';
      list.append(tr);
      const p = el('div', `tt-card prestige${g.prestigeOpen ? '' : ' locked'}`, `<div class="tt-thumb emoji">🔄</div>
        <div class="tt-info"><b class="tt-name">Пересменка</b><span class="tt-stat" data-f="text"></span><span class="tt-next" data-f="next"></span></div>
        ${g.prestigeOpen ? `<button class="tt-buy prestige" data-act="prestige"><small>сменить</small><span class="cost" data-f="cost"></span></button>` : ''}`);
      p.dataset.k = 'prestige';
      list.append(p);
    } else if (this.tab === 'heroes') {
      $('tt-panel-title').textContent = 'Стволы';
      // the shooter's own Glock stands first in the ring: it grows with the shooter, not with coins of its own
      const glock = el('div', 'tt-card glock', `<img class="tt-thumb" alt="" draggable="false"><div class="tt-info"><b class="tt-name">${GUN.gunName} <small>в руках стрелка</small></b>
        <span class="tt-stat" data-f="glock"></span><span class="tt-next">стреляет на каждый тап · растёт с уровнем стрелка</span></div>`);
      glock.querySelector('img').src = weaponThumb({ weapon: GUN.weapon, evo: 0, mods: {} }) ?? '';
      list.append(glock);
      HEROES.forEach((h, i) => {
        const lvl = g.heroLevel(i);
        if (lvl <= 0 && !g.heroOpen(i)) return;
        list.append(this.card('hero', weaponThumb({ weapon: h.weapon ?? h.id, evo: evosAt(lvl), mods: {} }), '', 'hero', i));
      });
      const next = HEROES.findIndex((h, i) => !g.heroOpen(i));
      if (next >= 0) list.append(el('div', 'tt-card locked', `<div class="tt-thumb emoji">❔</div><div class="tt-info"><b class="tt-name">???</b><span class="tt-next">наймёшь после ${HEROES[next - 1].name}</span></div>`));
    } else if (this.tab === 'gear') {
      $('tt-panel-title').textContent = 'Обвес';
      list.append(el('div', 'tt-card summary', `<div class="tt-thumb emoji">⚙️</div><div class="tt-info"><b class="tt-name">Детали: <span data-f="parts"></span></b>
        <span class="tt-next">падают с боссов с этапа ${GEAR.from}; лишнее разбирай на детали</span></div>`));
      const on = new Set(Object.values(g.s.gearOn));
      for (const slot of GEAR_SLOTS) {
        const it = g.gearOnSlot(slot.id);
        list.append(this.gearCard(slot, it, true));
      }
      const spare = g.s.gear.filter((x) => !on.has(x.id)).sort((a, b) => b.rarity - a.rarity || b.level - a.level);
      if (spare.length) list.append(el('div', 'tt-sub', 'Запас'));
      for (const it of spare) list.append(this.gearCard(GEAR_SLOTS.find((x) => x.id === it.slot), it, false));
    } else if (this.tab === 'pets') {
      $('tt-panel-title').textContent = 'Ручной хлам';
      list.append(el('div', 'tt-card summary', `<div class="tt-thumb emoji">📦</div><div class="tt-info"><b class="tt-name">Посылка с уровнями</b>
        <span class="tt-stat" data-f="parcel"></span><span class="tt-next">каждые ${PARCEL.bosses} боссов: +${PARCEL.levels[0]}…${PARCEL.levels[1]} ур. случайному питомцу</span></div>`));
      for (const p of PETS) {
        const L = g.s.pets[p.id] || 0, with_ = g.s.pet === p.id && L > 0;
        const c = el('div', `tt-card pet${L ? '' : ' locked'}${with_ ? ' on' : ''}`, `<div class="tt-thumb emoji">${L ? p.icon : '❔'}</div>
          <div class="tt-info"><b class="tt-name">${L ? p.name : '???'} ${L ? `<small>ур. ${L}</small>` : ''}</b>
          <span class="tt-stat" data-f="text"></span><span class="tt-next">${L ? (with_ ? 'с тобой' : 'ждёт в клетке') : `освободит босс этапа ${p.stage}`}</span></div>
          ${L && !with_ ? `<button class="tt-buy" data-act="pet" data-id="${p.id}"><small>взять</small><span class="cost"></span></button>` : ''}`);
        c.dataset.k = `pet:${p.id}`;
        list.append(c);
      }
    } else if (this.tab === 'shop') {
      $('tt-panel-title').textContent = 'Лавка';
      list.append(el('div', 'tt-card summary', `<div class="tt-thumb emoji">🟡</div><div class="tt-info"><b class="tt-name">Золотые патроны: <span data-f="pt"></span></b>
        <span class="tt-next">дают первый босс каждого цеха, копилка, пересменка и рекорды</span></div>`));
      for (const it of SHOP) {
        const c = el('div', 'tt-card shop', `<div class="tt-thumb emoji">${it.icon}</div><div class="tt-info"><b class="tt-name">${it.name}</b>
          <span class="tt-stat" data-f="text">${it.text}</span><span class="tt-next" data-f="next"></span></div>
          <button class="tt-buy" data-act="shop" data-id="${it.id}"><small>купить</small><span class="cost" data-f="cost"></span></button>`);
        c.dataset.k = `shop:${it.id}`;
        list.append(c);
      }
      for (const sk of SKINS) {
        const own = !!g.s.skins[sk.id], on = g.s.skin === sk.id;
        const c = el('div', `tt-card skin${on ? ' on' : ''}`, `<div class="tt-thumb emoji"><i class="tt-swatch" style="--a:${sk.slide};--b:${sk.accent}"></i></div>
          <div class="tt-info"><b class="tt-name">Glock: ${sk.name}</b><span class="tt-next">${on ? 'надето' : own ? 'куплено' : 'раскраска Glock стрелка'}</span></div>
          ${on ? '' : `<button class="tt-buy" data-act="skin" data-id="${sk.id}"><small>${own ? 'надеть' : 'купить'}</small><span class="cost" data-f="cost"></span></button>`}`);
        c.dataset.k = `skin:${sk.id}`;
        list.append(c);
      }
    } else {
      $('tt-panel-title').textContent = 'Станки';
      list.append(el('div', 'tt-card summary', `<div class="tt-thumb emoji">📐</div><div class="tt-info"><b class="tt-name">Чертежи: <span data-f="bp"></span></b>
        <span class="tt-next">каждый уровень станка — ещё +10% ко всему урону</span></div>
        ${g.newMachineCost != null ? `<button class="tt-buy" data-act="newMachine"><small>новый станок</small><span class="cost" data-f="cost"></span></button>` : ''}`));
      for (const m of g.ownedMachines) {
        const c = el('div', 'tt-card machine', `<div class="tt-thumb emoji">${m.icon}</div><div class="tt-info"><b class="tt-name">${m.name} <small data-f="lvl"></small></b>
          <span class="tt-stat" data-f="text"></span></div><button class="tt-buy" data-act="machine" data-id="${m.id}"><small>улучшить</small><span class="cost" data-f="cost"></span></button>`);
        c.dataset.k = `machine:${m.id}`;
        list.append(c);
      }
    }
  }

  /** a gear card: a slot with what is on it (on = true), or a spare piece */
  gearCard(slot, it, on) {
    if (!it) {
      const c = el('div', 'tt-card gear locked', `<div class="tt-thumb emoji">${slot.icon}</div><div class="tt-info"><b class="tt-name">${slot.name}</b>
        <span class="tt-next">пусто · даёт ${slot.text}</span></div>`);
      return c;
    }
    const c = el('div', `tt-card gear${on ? ' on' : ''}`, `<div class="tt-thumb emoji" style="--c:${FX_TIERS[it.rarity].color}">${slot.icon}</div>
      <div class="tt-info"><b class="tt-name">${slot.name} <small>ур. ${it.level}</small> ${tierChip(it.rarity, RARITY[it.rarity])}</b>
      <span class="tt-stat">${gearText(it)}</span><span class="tt-next">${on ? 'на Glock' : 'в запасе'}</span></div>
      ${on ? `<button class="tt-buy" data-act="gearUp" data-id="${it.id}"><small>улучшить</small><span class="cost" data-f="cost"></span></button>`
        : `<button class="tt-buy" data-act="equip" data-id="${it.id}"><small>надеть</small><span class="cost"></span></button><button class="tt-buy alt" data-act="salvage" data-id="${it.id}"><small>разобрать</small><span class="cost">+${GEAR.partsPer[it.rarity]}⚙️</span></button>`}`);
    c.dataset.k = `gear:${it.id}`;
    return c;
  }

  /** a gun card (main gun or a hero gun i) */
  card(kind, thumb, extra, act, i = -1) {
    const emoji = thumb && !thumb.startsWith('data:');
    const c = el('div', `tt-card ${kind}`, `${emoji ? `<div class="tt-thumb emoji">${thumb}</div>` : '<img class="tt-thumb" alt="" draggable="false">'}
      <div class="tt-info"><b class="tt-name"><span data-f="name"></span> <small data-f="lvl"></small></b>
      <span class="tt-stat" data-f="stat"></span><span class="tt-next" data-f="next"></span></div>
      <button class="tt-buy" data-act="${act}"${i >= 0 ? ` data-i="${i}"` : ''}><small data-f="n"></small><span class="gain" data-f="gain"></span><span class="cost" data-f="cost"></span></button>${extra}`);
    if (thumb && !emoji) c.querySelector('img').src = thumb;
    c.dataset.k = i >= 0 ? `hero:${i}` : kind;
    return c;
  }

  /** live numbers of the open tab */
  refreshList() {
    const g = this.g, s = g.s, list = $('tt-list');
    const f = (card, name) => card.querySelector(`[data-f="${name}"]`);
    const set = (card, name, html) => {
      const e = f(card, name);
      if (e && e.innerHTML !== html) e.innerHTML = html;
    };
    const buy = (card, cost, ok) => {
      const b = card.querySelector('.tt-buy');
      if (b) b.disabled = !ok;
      set(card, 'cost', cost);
    };
    for (const card of list.children) {
      const k = card.dataset.k;
      if (!k) {
        if (card.classList.contains('glock')) set(card, 'glock', `выстрел <b>${fmt(g.tapDamage())}</b> · стрелок ур. ${s.gun}`);
        if (card.classList.contains('summary')) {
          if (this.tab === 'shop') {
            set(card, 'pt', fmt(s.patrons));
            continue;
          }
          if (this.tab === 'gear') {
            set(card, 'parts', fmt(s.parts));
            continue;
          }
          if (this.tab === 'pets') {
            set(card, 'parcel', `${s.parcelBosses} / ${PARCEL.bosses} боссов`);
            continue;
          }
          set(card, 'bp', fmt(s.blueprints));
          const c = g.newMachineCost;
          if (c != null) buy(card, `${BP}${c}`, s.blueprints >= c || !!s.offer);
        }
        continue;
      }
      if (k === 'gun') {
        const { n, cost } = g.gunCostFor(this.mode);
        set(card, 'name', GUN.name);
        set(card, 'lvl', `ур. ${s.gun}`);
        set(card, 'stat', `тап <b>${fmt(g.tapDamage())}</b> · крит ${Math.round(g.k.crit * 100)}%`);
        const nm = nextMilestone(s.gun);
        const sk = SKILLS.find((x) => x.unlock > s.gun);
        set(card, 'next', sk && sk.unlock <= nm ? `ур. ${sk.unlock}: скилл «${sk.name}»` : `ур. ${nm}: урон ×${mulText(stepMul(gunDamage, nm))}`);
        set(card, 'n', `+${n} ур.`);
        set(card, 'gain', `+${fmt(g.gunGain(n))} урона`);
        set(card, 'cost', `${COIN}${fmt(cost)}`);
        card.querySelector('.tt-buy').disabled = cost > s.coins;
      } else if (k.startsWith('hero:')) {
        const i = +k.slice(5), h = HEROES[i], lvl = g.heroLevel(i), evo = evosAt(lvl);
        set(card, 'name', h.name);
        set(card, 'lvl', lvl > 0 ? `ур. ${lvl} ${tierChip(evo)}` : CLASS_NAMES[h.cls]);
        if (lvl > 0) {
          set(card, 'stat', `<b>${fmt(g.heroDps[i])}</b>/с · ${CLASS_NAMES[h.cls]}`);
          const ne = EVO_LEVELS.find((x) => x > lvl), nm = heroNextMilestone(i, lvl);
          if (ne != null && ne <= nm) {
            const perk = PERKS[CLASS_PERKS[h.cls][evo]];
            set(card, 'next', `ур. ${ne}: эволюция · ${perk.add ? `+${(perk.add * 100).toFixed(1)}%` : `+${Math.round((perk.mul - 1) * 100)}%`} ${perk.text}`);
          } else set(card, 'next', `ур. ${nm}: урон ×${mulText(stepMul((L) => heroDps(i, L), nm))}`);
          const img = card.querySelector('img');
          if (img && +img.dataset.evo !== evo) {
            img.dataset.evo = evo;
            img.src = weaponThumb({ weapon: h.weapon ?? h.id, evo, mods: {} }) ?? '';
          }
          const { n, cost } = g.heroCostFor(i, this.mode);
          set(card, 'n', `+${n} ур.`);
          set(card, 'gain', `+${fmt(g.heroGain(i, n))}/с`);
          buy(card, `${COIN}${fmt(cost)}`, cost <= s.coins);
        } else {
          card.classList.add('hire');
          set(card, 'stat', `<b>${fmt(g.heroGain(i, 1))}</b>/с на ур. 1`);
          set(card, 'next', 'стреляет сам, пока ты тапаешь');
          const { cost } = g.heroCostFor(i, 1);
          set(card, 'n', 'нанять');
          set(card, 'gain', `+${fmt(g.heroGain(i, 1))}/с`);
          buy(card, `${COIN}${fmt(cost)}`, cost <= s.coins);
        }
      } else if (k.startsWith('skill:')) {
        const id = k.slice(6), lvl = g.skillLevel(id);
        if (!lvl) {
          set(card, 'text', skillText(id, 1));
          continue;
        }
        set(card, 'lvl', `ур. ${lvl}`);
        set(card, 'text', skillText(id, lvl));
        const cost = g.skillUpgradeCost(id);
        buy(card, cost == null ? 'макс.' : `${COIN}${fmt(cost)}`, cost != null && cost <= s.coins);
      } else if (k === 'prestige') {
        if (!g.prestigeOpen) {
          set(card, 'text', `откроется на этапе ${PRESTIGE.unlock}`);
          set(card, 'next', 'этап, монеты и уровни — за чертежи; станки навсегда');
        } else {
          const bp = g.prestigeReward;
          set(card, 'text', `рекорд смены: этап ${s.maxStage} → <b>${bp}</b> чертежей`);
          set(card, 'next', g.canPrestige ? 'сбрасывает этап, монеты, стрелка, стволы и скиллы' : `нужен этап ${PRESTIGE.unlock} в этой смене`);
          buy(card, `${BP}+${bp}`, g.canPrestige);
        }
      } else if (k.startsWith('gear:')) {
        const c = g.gearUpgradeCost(+k.slice(5));
        if (card.classList.contains('on')) buy(card, c == null ? 'макс.' : `${c}⚙️`, c != null && c <= s.parts);
      } else if (k.startsWith('pet:')) {
        const p = PETS.find((x) => x.id === k.slice(4)), L = s.pets[p.id] || 0;
        set(card, 'text', L ? `${petText(p, L)} · прыжок каждые ${p.every}: ×${fmt(p.mul * petJumpMul(L) * g.k.pet)} тапа` : petText(p, 1));
      } else if (k === 'tree') {
        set(card, 'text', g.treeOpen ? `значков: <b>${g.badgesFree}</b> свободно из ${g.badges}` : 'откроется после первой пересменки');
        if (g.treeOpen) set(card, 'cost', g.badgesFree > 0 ? `🎖️${g.badgesFree}` : '');
      } else if (k.startsWith('shop:')) {
        const it = SHOP.find((x) => x.id === k.slice(5));
        let next = '', ok = s.patrons >= it.cost;
        if (it.kind === 'boost' && s.boostT > 0) next = `идёт: ещё ${Math.ceil(s.boostT / 60)} мин`;
        if (it.kind === 'mana') {
          ok = ok && g.k.manaMax > 0 && s.mana < g.k.manaMax;
          next = g.k.manaMax > 0 ? '' : 'нужен первый скилл';
        }
        if (it.kind === 'offline') {
          ok = ok && g.heroSum > 0;
          next = g.heroSum > 0 ? '' : 'нужен хотя бы один ствол';
        }
        if (it.kind === 'gear') {
          ok = ok && g.gearOpen;
          next = g.gearOpen ? '' : `откроется с этапа ${GEAR.from}`;
        }
        set(card, 'next', next);
        buy(card, `${PT}${it.cost}`, ok);
      } else if (k.startsWith('skin:')) {
        const sk = SKINS.find((x) => x.id === k.slice(5));
        if (s.skin === sk.id) continue;
        buy(card, s.skins[sk.id] ? '' : `${PT}${sk.cost}`, !!s.skins[sk.id] || s.patrons >= sk.cost);
      } else if (k.startsWith('machine:')) {
        const id = k.slice(8), m = MACHINES.find((x) => x.id === id), L = s.machines[id] || 0;
        set(card, 'lvl', `ур. ${L}`);
        set(card, 'text', m.text(L));
        const cost = g.machineUpgradeCost(id);
        buy(card, cost == null ? 'макс.' : `${BP}${cost}`, cost != null && cost <= s.blueprints);
      }
    }
  }

  /** tab dots: something affordable there */
  refreshTabs() {
    const g = this.g, s = g.s;
    const dots = {
      gun: g.gunCostFor(1).cost <= s.coins || SKILLS.some((sk) => { const c = g.skillUpgradeCost(sk.id); return c != null && c <= s.coins; }) || g.canPrestige,
      heroes: HEROES.some((h, i) => g.heroOpen(i) && g.heroCostFor(i, 1).cost <= s.coins),
      machines: this.machinesOpen && ((g.newMachineCost != null && s.blueprints >= g.newMachineCost) || g.ownedMachines.some((m) => { const c = g.machineUpgradeCost(m.id); return c != null && c <= s.blueprints; })),
      shop: g.shopOpen && SHOP.some((it) => it.kind !== 'mana' && s.patrons >= it.cost && !(it.kind === 'boost' && s.boostT > 0)),
      gear: g.gearOpen && GEAR_SLOTS.some((sl) => { const it = g.gearOnSlot(sl.id), c = it && g.gearUpgradeCost(it.id); return c != null && c <= s.parts; }),
      gun_tree: g.treeOpen && g.badgesFree > 0,
    };
    for (const b of $('tt-tabs').children) {
      const id = b.dataset.tab;
      b.classList.toggle('has', !!dots[id]);
      if (id === 'machines') {
        b.classList.toggle('locked', !this.machinesOpen);
        b.hidden = !this.machinesOpen && s.best < PRESTIGE.unlock - 5;
      }
      if (id === 'shop') {
        b.classList.toggle('locked', !g.shopOpen);
        b.hidden = !g.shopOpen && s.best < 4;
      }
      if (id === 'gear') {
        b.classList.toggle('locked', !g.gearOpen);
        b.hidden = !g.gearOpen && s.prestiges === 0;
      }
      if (id === 'pets') {
        b.classList.toggle('locked', !g.petOn);
        b.hidden = !g.petOn && s.best < 6;
      }
      if (id === 'gun' && dots.gun_tree) b.classList.add('has');
    }
    for (const b of $('tt-mult').children) b.classList.toggle('on', String(this.mode) === b.dataset.m);
    $('tt-mult').hidden = !(this.tab === 'gun' || this.tab === 'heroes');
  }

  refresh(force = false) {
    const key = this.structure();
    if (force || key !== this.listKey) {
      if (key !== this.listKey) this.buildList();
      this.listKey = key;
    }
    this.refreshList();
    this.refreshTabs();
    this.refreshQuest();
  }

  /** the objective: text, progress bar, its reward — and «Забрать» once done (TT2's green Collect) */
  refreshQuest() {
    const g = this.g, q = g.quest, ready = g.s.questReady, bar = $('tt-quest');
    const set = (sel, v) => {
      const e = bar.querySelector(sel);
      if (e.textContent !== v) e.textContent = v;
    };
    set('.qt', q.text);
    const p = q.n > 0 ? Math.min(1, q.value / q.n) : 0;
    bar.querySelector('.qbar i').style.width = `${(ready ? 1 : p) * 100}%`;
    set('.qp', ready || q.kind === 'stage' || q.kind === 'gun' ? '' : `${Math.floor(q.value)}/${q.n}`);
    const reward = g.questReward(q);
    const qr = bar.querySelector('.qr'), claim = bar.querySelector('.qclaim');
    const rHtml = reward && !ready ? `${COIN}${fmt(reward)}` : '';
    if (qr.innerHTML !== rHtml) qr.innerHTML = rHtml;
    claim.hidden = !ready;
    const cHtml = `Забрать ${COIN}${fmt(reward)}`;
    if (ready && claim.innerHTML !== cHtml) claim.innerHTML = cHtml;
    bar.classList.toggle('ready', ready);
  }

  // ------------------------------------------------------------------ every frame
  update(dt) {
    const g = this.g, s = g.s, t = g.titan;
    $('tt-coins').textContent = fmt(s.coins);
    const bpChip = $('tt-bp-chip');
    bpChip.hidden = !(s.blueprints > 0 || s.prestiges > 0);
    $('tt-bp').textContent = fmt(s.blueprints);
    $('tt-pt-chip').hidden = !g.shopOpen;
    $('tt-pt').textContent = fmt(s.patrons);
    $('tt-boost').hidden = !(s.boostT > 0);
    if (s.boostT > 0) $('tt-boost-t').textContent = clockText(s.boostT);

    // stage, giants left, boss button, the next unlock
    $('tt-floor').textContent = g.floor.name;
    $('tt-stage-n').textContent = `Этап ${s.stage}`;
    const need = g.titansNeeded;
    const kills = $('tt-kills');
    const killKey = `${need}|${Math.min(s.kills, need)}|${!!t?.boss}|${s.farm}`;
    if (kills.dataset.key !== killKey) {
      kills.dataset.key = killKey;
      let h = '';
      for (let i = 0; i < need; i++) h += `<i class="${i < s.kills ? 'on' : ''}"></i>`;
      h += `<b class="boss${t?.boss ? ' on' : ''}${s.farm ? ' farm' : ''}">☠</b><span class="cnt">${t?.boss ? 'БОСС' : s.farm ? 'фарм' : `${Math.min(s.kills, need)}/${need}`}</span>`;
      kills.innerHTML = h;
    }
    const bossBtn = $('tt-boss-btn');
    bossBtn.hidden = !s.farm && !t?.boss;
    const bossTxt = s.farm ? '⚔ Бой с боссом' : 'Отступить';
    if (bossBtn.textContent !== bossTxt) bossBtn.textContent = bossTxt;
    bossBtn.classList.toggle('fight', s.farm);
    const nu = g.nextUnlock;
    const teaser = nu ? `${nu.icon} этап ${nu.stage}: ${nu.title}` : '';
    if ($('tt-teaser').textContent !== teaser) $('tt-teaser').textContent = teaser;

    // the giant and the boss timer
    const titan = $('tt-titan');
    titan.classList.toggle('none', !t);
    titan.classList.toggle('boss', !!t?.boss);
    titan.classList.toggle('golden', t?.variant === 'golden');
    if (t) {
      // the name and what it pays when it breaks
      const name = `${t.name} <span class="pay">${COIN}${fmt(g.titanReward)}</span>`;
      if (this.nameHtml !== name) $('tt-titan-name').innerHTML = this.nameHtml = name;
      const frac = Math.max(0, t.hp / t.maxHp), hp = this.hp;
      if (hp.gen !== t.gen) Object.assign(hp, { gen: t.gen, last: frac, trail: frac, hold: 0 });
      if (frac < hp.last - 0.01) {
        hp.hold = 0.3;
        const now = performance.now();
        if (now - hp.hitT > 90) {
          hp.hitT = now;
          const bar = $('tt-hp-fill').parentElement;
          bar.classList.remove('hit');
          void bar.offsetWidth;
          bar.classList.add('hit');
        }
      }
      hp.last = frac;
      hp.hold -= dt;
      if (hp.hold <= 0) hp.trail += (frac - hp.trail) * Math.min(1, dt * 5);
      hp.trail = Math.max(hp.trail, frac);
      $('tt-hp-fill').style.width = `${frac * 100}%`;
      $('tt-hp-trail').style.width = `${hp.trail * 100}%`;
      $('tt-hp-text').textContent = `${fmt(Math.max(0, t.hp))} / ${fmt(t.maxHp)}`;
    }
    const timer = $('tt-timer');
    timer.hidden = !t?.boss;
    if (t?.boss) {
      $('tt-timer-fill').style.width = `${Math.max(0, (g.bossT / g.k.bossTime) * 100)}%`;
      $('tt-timer-text').textContent = `пресс через ${Math.max(0, g.bossT).toFixed(1)} с`;
    }

    // charge and skills
    const mana = $('tt-mana');
    mana.hidden = !(g.k.manaMax > 0);
    if (g.k.manaMax > 0) {
      $('tt-mana-fill').style.width = `${(s.mana / g.k.manaMax) * 100}%`;
      $('tt-mana-text').textContent = `⚡ ${Math.floor(s.mana)} / ${g.k.manaMax}`;
    }
    for (const sk of SKILLS) {
      const st = g.skillState(sk.id), b = this.skillEls[sk.id];
      b.classList.toggle('locked', !st.lvl);
      b.classList.toggle('active', st.active);
      b.classList.toggle('cooldown', !!st.lvl && !st.active && st.cd > 0);
      b.classList.toggle('ready', st.ready && st.mana);
      b.classList.toggle('nomana', st.ready && !st.mana);
      const cd = b.querySelector('.cd');
      const cdText = st.active ? Math.ceil(st.left) : !st.active && st.cd > 0 ? Math.ceil(st.cd) : '';
      if (cd.textContent !== String(cdText)) cd.textContent = cdText;
      b.style.setProperty('--p', st.active && sk.dur ? (st.left / sk.dur).toFixed(3) : 0);
    }

    this.refreshT -= dt;
    if (this.refreshT <= 0) {
      this.refreshT = 0.25;
      this.refresh();
      // TT2's stats strip: what a tap and the guns deal right now
      const st = `🔫 ${fmt(g.tapDamage())} · 🗄️ ${fmt(g.heroDpsNow)}/с`;
      if ($('tt-stats').textContent !== st) $('tt-stats').textContent = st;
      this.refreshSide();
      // the run clock: all the time played, and this shift's after a shift change
      const clock = `⏱ ${clockText(s.playT)}${s.prestiges ? ` · смена ${clockText(s.shiftT)}` : ''}`;
      if ($('tt-clock').textContent !== clock) $('tt-clock').textContent = clock;
    }
  }

  /** Global UI coordinates, projected after the current camera has been placed. */
  updateAnchor() {
    const box = $('tt-titan'), p = TUNE.hpAnchor ? this.act.anchor?.() : null;
    box.classList.toggle('anchored', !!p);
    if (!p) {
      box.style.left = box.style.top = box.style.width = '';
      box.style.removeProperty('--hp-name-size');
      return;
    }
    const r = this.battle.getBoundingClientRect(), overlay = $('tt-overlay').getBoundingClientRect();
    const width = Math.min(r.width - 24, Math.max(144, Math.min(r.width * 0.61, 288, p.width)));
    box.style.width = `${width}px`;
    box.style.setProperty('--hp-name-size', `${Math.max(12, Math.min(17, width / 14))}px`);
    const x = Math.max(width / 2 + 12, Math.min(r.width - width / 2 - 12, p.x));
    const minY = $('tt-stage').getBoundingClientRect().bottom - r.top + box.offsetHeight + 8;
    const maxY = $('tt-skills').getBoundingClientRect().top - r.top - 12;
    const y = Math.max(minY, Math.min(maxY, p.y + TUNE.hpOffset));
    box.style.left = `${r.left - overlay.left + x}px`;
    box.style.top = `${r.top - overlay.top + y}px`;
  }

  /** px of the battle area covered on top (bars) and at the bottom (skills): the camera keeps the scene between */
  insets() {
    const r = this.battle.getBoundingClientRect();
    // with the HP bar over the giant, the bars on top end with the stage block
    const top = $(TUNE.hpAnchor ? 'tt-stage' : 'tt-titan').getBoundingClientRect().bottom - r.top;
    const bottom = r.bottom - $('tt-skills').getBoundingClientRect().top;
    return { top: Math.max(0, top), bottom: Math.max(0, bottom), w: r.width, h: r.height };
  }

  // ------------------------------------------------------------------ juice
  /** a floating number or word; scale grows it (big bites, crits) */
  popup(x, y, text, cls = '', scale = 1) {
    const p = el('div', `tt-pop ${cls}`, text);
    p.style.left = `${x + (Math.random() - 0.5) * 50}px`;
    p.style.top = `${y}px`;
    p.style.setProperty('--s', scale.toFixed(2));
    p.style.setProperty('--dx', `${Math.round((Math.random() - 0.5) * 50)}px`);
    p.addEventListener('animationend', () => p.remove());
    this.pops.append(p);
    if (this.pops.childElementCount > 40) this.pops.firstElementChild.remove();
  }

  /** n coins fly from (x, y) in the battle area to the wallet */
  flyCoins(x, y, n = 6) {
    const r = this.battle.getBoundingClientRect();
    const w = $('tt-coins').getBoundingClientRect();
    const tx = w.left - r.left + 4, ty = w.top - r.top + w.height / 2;
    for (let i = 0; i < n; i++) {
      const c = el('i', 'tt-coin tt-fly');
      c.style.left = `${x}px`;
      c.style.top = `${y}px`;
      this.pops.append(c);
      const dx = (Math.random() - 0.5) * 120, dy = -40 - Math.random() * 70;
      const a = c.animate([
        { transform: 'translate(-50%,-50%) scale(.6)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1)`, opacity: 1, offset: 0.35 },
        { transform: `translate(calc(-50% + ${tx - x}px), calc(-50% + ${ty - y}px)) scale(.7)`, opacity: 0.9 },
      ], { duration: 650 + Math.random() * 250, delay: i * 30, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' });
      a.onfinish = () => {
        c.remove();
        if (i === 0) {
          const wal = $('tt-coins').parentElement;
          wal.classList.remove('bump');
          void wal.offsetWidth;
          wal.classList.add('bump');
        }
      };
    }
  }

  /** a short banner in the middle of the range */
  toast(icon, title, text = '', cls = '') {
    const t = el('div', `tt-toast ${cls}`, `<span class="ic">${icon}</span><div><b>${title}</b>${text ? `<small>${text}</small>` : ''}</div>`);
    $('tt-toasts').append(t);
    setTimeout(() => t.classList.add('out'), 2800);
    setTimeout(() => t.remove(), 3300);
    while ($('tt-toasts').childElementCount > 3) $('tt-toasts').firstElementChild.remove();
  }

  /** o: { title, html, cls, buttons: [{ text, cls, onClick, keep }], dismiss } */
  modal(o) {
    const m = $('tt-modal');
    m.replaceChildren();
    const card = el('div', `tt-modal-card ${o.cls ?? ''}`, `<h2>${o.title}</h2><div class="body">${o.html ?? ''}</div><div class="btns"></div>`);
    for (const b of o.buttons ?? []) {
      const e = el('button', `tt-btn ${b.cls ?? ''}`, b.text);
      e.addEventListener('click', () => {
        if (!b.keep) this.closeModal();
        b.onClick?.(e);
      });
      card.querySelector('.btns').append(e);
    }
    m.append(card);
    m.hidden = false;
    m.onclick = (e) => {
      if (e.target === m && o.dismiss !== false) this.closeModal();
    };
    return card;
  }

  // ------------------------------------------------------------------ meta windows
  /** «Квалификация»: four branches, a badge a level, free reset */
  openTree() {
    const g = this.g, s = g.s;
    const body = TREE.map((b) => `<div class="tt-branch"><h3>${b.icon} ${b.name}</h3>${b.nodes.map((n) => {
      const L = s.tree[n.id] || 0;
      return `<div class="tt-node"><div><b>${n.name}</b> <small>${'●'.repeat(L)}${'○'.repeat(TREE_MAX - L)}</small><br><span>${nodeText(n, Math.max(1, L))}</span></div>
        <button class="tt-btn small" data-node="${n.id}" ${L >= TREE_MAX || g.badgesFree <= 0 ? 'disabled' : ''}>+</button></div>`;
    }).join('')}</div>`).join('');
    const card = this.modal({ title: `Квалификация · 🎖️ ${g.badgesFree} / ${g.badges}`, cls: 'wide', html: `<div class="tt-tree">${body}</div>`,
      buttons: [{ text: 'Сбросить (бесплатно)', cls: 'ghost', keep: true, onClick: () => { this.act.resetTree(); this.openTree(); } }, { text: 'Готово' }] });
    card.querySelectorAll('[data-node]').forEach((b) => b.addEventListener('click', () => {
      if (this.act.upgradeNode(b.dataset.node)) this.openTree();
    }));
  }

  /** the day's three jobs */
  openDaily() {
    const g = this.g, d = g.s.daily;
    const rows = g.dailyJobs.map(({ job, value, ready, done }) => `<div class="tt-job${done ? ' done' : ''}"><div><b>${job.text}</b>
      <i class="qbar"><i style="width:${(value / job.n) * 100}%"></i></i><small>${value} / ${job.n}</small></div>
      ${done ? '<span class="ok">✓</span>' : `<button class="tt-btn small" data-job="${job.id}" ${ready ? '' : 'disabled'}>+${DAILY.reward} <i class="tt-pti"></i></button>`}</div>`).join('');
    const card = this.modal({ title: 'Задания дня', html: `${rows}<p class="note">${d.all ? 'Все три сделаны — бонус забран' : `Все три — ещё +${DAILY.all}`} <i class="tt-pti"></i> · новые завтра</p>`,
      buttons: [{ text: 'Закрыть' }] });
    card.querySelectorAll('[data-job]').forEach((b) => b.addEventListener('click', () => {
      if (this.act.claimDaily(b.dataset.job)) this.openDaily();
    }));
  }

  /** the login calendar: a gift for every day you come, a week round */
  openLogin() {
    const g = this.g, l = g.s.login;
    const cells = LOGIN.map((x, i) => {
      const day = i + 1, cls = day < l.step || (day === l.step && l.claimed) ? 'got' : day === l.step ? 'now' : '';
      const what = x.kind === 'coins' ? `${x.n} гигантов` : x.kind === 'patrons' ? `${x.n}` : x.kind === 'parcel' ? 'посылка' : 'деталь';
      return `<div class="tt-day ${cls}"><small>день ${day}</small><span>${x.icon}</span><b>${what}</b></div>`;
    }).join('');
    this.modal({ title: 'Вход каждый день', html: `<div class="tt-days">${cells}</div><p class="note">Подарок за каждый день, когда заходишь; неделя по кругу</p>`,
      buttons: l.claimed ? [{ text: 'Закрыть' }] : [{ text: 'Забрать подарок', cls: 'go', onClick: () => this.act.claimLogin() }] });
  }

  /** the newcomers' tournament: start a round, or the table of the one running */
  openTourney() {
    const g = this.g, r = g.s.tourney;
    if (!g.tourneyOpen) {
      this.modal({ title: '🏆 Турнир новичков', html: `<p>Откроется с этапа ${TOURNEY.from}.</p>`, buttons: [{ text: 'Ок' }] });
      return;
    }
    const prizes = TOURNEY.prizes.map(([p, n], k) => `${k ? `${TOURNEY.prizes[k - 1][0] + 1}–${p}` : '1'}: ${n}`).join(' · ');
    if (!r || r.done) {
      const last = r ? `<p>Прошлый раунд: <b>${r.place}-е место</b>${r.prize ? `, +${r.prize} <i class="tt-pti"></i>` : ''}</p>` : '';
      this.modal({ title: '🏆 Турнир новичков', html: `${last}<p>${TOURNEY.min} минут игры: кто пройдёт больше этапов. 20 стрелков, призы в патронах.</p><p class="note">${prizes}</p>`,
        buttons: [{ text: 'Начать раунд', cls: 'go', onClick: () => this.act.startTourney() }, { text: 'Позже', cls: 'ghost' }] });
      return;
    }
    const rows = g.standings, me = rows.findIndex((x) => x.me);
    const show = rows.map((x, i) => ({ ...x, i })).filter((x) => x.i < 8 || x.me);
    const left = Math.max(0, TOURNEY.min * 60 - r.t);

  void f.offsetWidth;
  f.classList.add('flash');
  setTimeout(() => view.setFloor(idx), 120);
  hud.toast('🛗', FLOORS[idx].name, `этапы ${game.s.stage}–${game.s.stage + 4}`);
}

/** stage 60 the first time: TT2's full-screen «You're about to Prestige!» */
function prestigeSplash() {
  const bp = game.prestigeReward;
  hud.modal({
    title: 'Пересменка открыта!',
    cls: 'splash',
    html: `<div class="art">🔄</div>
      <p>Вот это сила! Смена дошла до этапа <b>${game.s.maxStage}</b>.</p>
      <p>Обменяй прогресс на <b>${bp} 📐 чертежей</b> — на них ставятся станки, и они остаются навсегда.</p>
      <p class="hint">Можно дожать дальше: чем выше этап, тем больше чертежей.</p>`,
    buttons: [
      { text: 'Ещё повоюю', cls: 'ghost' },
      { text: `Пересменка · +${bp} 📐`, cls: 'gold', onClick: () => fade('Новая смена', () => game.prestige()) },
    ],
  });
}

function askPrestige() {
  if (!game.canPrestige) {
    hud.toast('🔄', 'Пересменка', `Нужен этап ${PRESTIGE.unlock} в этой смене`);
    return;
  }
  const s = game.s, bp = game.prestigeReward;
  hud.modal({
    title: '🔄 Пересменка',
    html: `<p>Смена дошла до этапа <b>${s.maxStage}</b>: получишь <b>${bp} 📐</b> чертежей.</p>
      <p>На чертежи ставятся <b>станки</b> — они остаются навсегда и ускоряют каждую следующую смену.</p>
      <p class="warn">Сбросятся этап, монеты, стрелок, стволы и скиллы.</p>
      <p class="hint">Со станками этапы 1–${s.maxStage} пролетят заметно быстрее.</p>`,
    buttons: [
      { text: 'Отмена', cls: 'ghost' },
      { text: `Сменить смену · +${bp} 📐`, cls: 'gold', onClick: () => fade('Новая смена', () => game.prestige()) },
    ],
  });
}

function newMachine() {
  const offer = game.openOffer();
  if (!offer) {
    const c = game.newMachineCost;
    hud.toast('📐', 'Не хватает чертежей', c != null ? `Новый станок: ${c} 📐` : 'Все станки уже стоят');
    return;
  }
  save();
  const cards = offer.map((id) => {
    const m = MACHINES.find((x) => x.id === id);
    return `<button class="tt-offer" data-id="${id}"><span class="ic">${m.icon}</span><b>${m.name}</b><small>${m.text(1)}</small></button>`;
  }).join('');
  const card = hud.modal({
    title: '⚙️ Новый станок',
    html: `<p class="hint">Выбери один из трёх. Цена: <b>${game.newMachineCost} 📐</b>. Каждый уровень станка ещё и +10% ко всему урону.</p><div class="tt-offers">${cards}</div>`,
    buttons: [{ text: 'Позже', cls: 'ghost' }],
  });
  card.querySelectorAll('.tt-offer').forEach((b) => b.addEventListener('click', () => {
    if (!game.chooseMachine(b.dataset.id)) return;
    hud.closeModal();
    hud.refresh(true);
  }));
}

// ------------------------------------------------------------------ «Ночная смена»
function welcomeBack() {
  const off = game.offline(Date.now());
  if (!off) return;
  const h = Math.floor(off.seconds / 3600), m = Math.round((off.seconds % 3600) / 60);
  hud.modal({
    title: '🌙 Ночная смена',
    html: `<p>Тебя не было ${h ? `${h} ч ` : ''}${m} мин. Стволы на стойках не простаивали:</p><p class="big">+${fmt(off.gold)} <i class="tt-coin"></i></p>`,
    buttons: [{ text: 'Забрать', cls: 'gold', onClick: () => hud.flyCoins(size.w / 2, size.h / 2, 12) }],
  });
  save();
}
welcomeBack();

// ------------------------------------------------------------------ cheats
let speed = 1;
function toggleCheats() {
  const c = $('tt-cheats');
  if (!c.hidden) {
    c.hidden = true;
    return;
  }
  c.replaceChildren();
  const add = (text, f) => {
    const b = document.createElement('button');
    b.textContent = text;
    b.addEventListener('click', () => {
      f(b);
      hud.refresh(true);
      save();
    });
    c.append(b);
  };
  const s = game.s;
  add('💰 монеты ×10', () => (s.coins = Math.max(s.coins * 10, titanGold(s.stage) * 300)));
  add(adminOn() ? '🛡 Режим админа: вкл' : '🛡 Режим админа: выкл', (b) => {
    setAdmin(!adminOn());
    b.textContent = adminOn() ? '🛡 Режим админа: вкл' : '🛡 Режим админа: выкл';
    showAdmin(adminOn(), $('tt-app'), onTune);
  });
  add('🟡 +50 патронов', () => game.addPatrons(50, 'cheat'));
  add('🔩 деталь обвеса', () => game.dropGear());
  add('📦 посылка питомцу', () => game.openParcel());
  add('⏭ +5 этапов', () => {
    const before = game.floorIdx;
    s.stage += 5;
    s.kills = 0;
    s.farm = false;
    s.maxStage = Math.max(s.maxStage, s.stage);
    s.best = Math.max(s.best, s.stage);
    if (game.titan) {
      game.titan.dead = true;
      game.titan = null;
      view.despawnTitan();
    }
    game.spawnT = 0.3;
    game.checkUnlocks();
    game.checkQuest();
    if (game.floorIdx !== before) lift(game.floorIdx);
  });
  add('📐 +20 чертежей', () => (s.blueprints += 20));
  add('⚡ полный заряд', () => (s.mana = game.k.manaMax));
  add(speed > 1 ? '⏩ скорость ×1' : '⏩ скорость ×3', (b) => {
    speed = speed > 1 ? 1 : 3;
    b.textContent = speed > 1 ? '⏩ скорость ×1' : '⏩ скорость ×3';
  });
  let armed = 0;
  add('🗑 сбросить всё', (b) => {
    if (performance.now() - armed > 3000) {
      armed = performance.now();
      b.textContent = '🗑 точно? ещё раз';
      return;
    }
    resetting = true;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(newSave()));
    } catch {}
    location.reload();
  });
  c.hidden = false;
}
if (params.has('nocheat')) $('tt-cheat-btn').hidden = true;

// ------------------------------------------------------------------ camera: in front of the giant, at its middle
/** dist: where the camera stands now (it glides to distT); mid: NDC height of the free band's middle; layout*: the guns' */
const cam = { fov: FOV, dist: 0, distT: 20, mid: 0, layoutDist: -1, layoutY: -1, insets: null };
const _look = new THREE.Vector3();
/**
 * The camera stands in front of the giant and looks straight at its middle, which sits in the middle of the free band
 * between the bars and the skills (the camera stands a little lower or higher for that, never tilted). It stands as far
 * back as the giant's size asks (ARENA.view): bigger giants, further back; it glides there when the next one comes.
 */
function fitCamera(snap = false) {
  const { top, bottom, w, h } = (cam.insets = hud.insets());
  const V = ARENA.view, T = view.targetFrame(true);
  const t = Math.tan(THREE.MathUtils.degToRad(TUNE.fov / 2));
  const yTop = 1 - (2 * top) / h, yBot = -1 + (2 * Math.min(bottom, h - top - 80)) / h;
  const band = yTop - yBot;
  cam.fov = TUNE.fov;
  cam.mid = (yTop + yBot) / 2;
  cam.distT = Math.max(T.h / (t * V.fill * band), T.w / (t * (w / h) * 2 * V.fillW)) * TUNE.camDist;
  if (snap || !cam.dist) cam.dist = cam.distT;
  layoutGuns();
}

/** the guns' ring is laid out from the camera as it stands (no shake) */
function layoutGuns() {
  placeCamera(0, 0, 0, false);
  view.layout(camera, cam.insets);
  cam.layoutDist = cam.dist;
  cam.layoutY = view.targetFrame().y;
}

/**
 * shake: 0..1 camera jitter; zoom: 0..1 a short push in (a narrower view) on crits, the press and kills; offset: the
 * admin's camera offset from where the guns were laid out (TUNE.camUp / camBack) — it keeps looking at the giant
 */
function placeCamera(time, shake, zoom, offset = true) {
  const T = view.targetFrame(), t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const sh = shake * shake * 0.05 * (cam.dist / 20);
  const jx = (Math.random() - 0.5) * sh + Math.sin(time * 0.3) * 0.02, jy = (Math.random() - 0.5) * sh;
  camera.fov = cam.fov * (1 - zoom * zoom * 0.06);
  camera.updateProjectionMatrix();
  // the giant's middle lands on the band's middle: the camera stands that much lower (or higher) and looks level
  const y = T.y - cam.mid * cam.dist * t;
  camera.position.set(T.x + jx, y + jy + (offset ? TUNE.camUp : 0), T.z + cam.dist + (offset ? TUNE.camBack : 0));
  camera.lookAt(_look.set(T.x + jx * 0.3, y + jy * 0.3, T.z));
  camera.updateMatrixWorld();
}

function resize() {
  const r = battle.getBoundingClientRect();
  size.w = Math.max(1, Math.round(r.width));
  size.h = Math.max(1, Math.round(r.height));
  renderer.setSize(size.w, size.h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(size.w, size.h);
  camera.aspect = size.w / size.h;
  camera.updateProjectionMatrix();
  fitCamera();
}
new ResizeObserver(resize).observe(battle);
addEventListener('resize', resize);
document.fonts?.ready.then(resize);
resize();

// ------------------------------------------------------------------ input: every tap is a shot
let lastTap = 0;
function tap() {
  const now = performance.now();
  if (now - lastTap < 1000 / GUN.maxTaps) return;
  lastTap = now;
  const res = game.tap();
  if (!res && game.reloadT > 0) return; // reloading: the tap is lost (the Glock dips and racks meanwhile)
  if (!res && game.titan) return; // all surface patches are occupied: wait for contact
  view.shoot(res);
}
battle.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest('button') || hud.modalOpen) return;
  e.preventDefault();
  $('tt-cheats').hidden = true;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (view.piggyHit(x, y)) {
    piggy();
    return;
  }
  tap();
});
battle.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    hud.closeModal();
    $('tt-cheats').hidden = true;
    return;
  }
  if (e.code !== 'Space' || e.repeat || hud.modalOpen) return;
  e.preventDefault();
  tap();
});

function piggy() {
  const p = view.popPiggy();
  const r = game.piggyReward();
  if (r.kind === 'gold') {
    hud.popup(p.x, p.y - 20, `🐷 +${fmt(r.value)}`, 'gold big');
    hud.flyCoins(p.x, p.y, 12);
  } else if (r.kind === 'mana') hud.popup(p.x, p.y - 20, `🐷 ⚡+${Math.round(r.value)}`, 'mana big');
  else if (r.kind === 'patrons') hud.popup(p.x, p.y - 20, `🐷 🟡+${r.value}`, 'gold big');
  else hud.toast(r.skill.icon, `Копилка: «${r.skill.name}»`, 'бесплатно, на 30 секунд', 'big');
  save();
}

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
let time = 0, heroPopT = 0, saveT = 0;
/** freeze-frame left (s): heavy hits stop the world for a few frames, the screen keeps going */
let stopT = 0;
function frame() {
  const real = Math.min(clock.getDelta(), 0.05);
  if (view.stopReq > 0) {
    stopT = Math.max(stopT, view.stopReq);
    view.stopReq = 0;
  }
  const dt = real * speed * (stopT > 0 ? 0.06 : 1);
  stopT = Math.max(0, stopT - real);
  time += real;
  game.update(dt);
  const t = game.titan;
  view.setBossProgress(t?.boss ? 1 - game.bossT / game.k.bossTime : -1);
  view.update(dt, game);

  // the guns' damage as one number every half second
  heroPopT -= real;
  if (heroPopT <= 0) {
    heroPopT = 0.55;
    if (game.heroAcc > 0 && t) {
      const p = view.titanScreen();
      hud.popup(p.x + (Math.random() - 0.5) * 90, p.y + 40 + Math.random() * 30, fmt(game.heroAcc), 'hero');
    }
    game.heroAcc = 0;
  }

  // the camera glides to the new giant's distance; the guns' ring follows it
  cam.dist += (cam.distT - cam.dist) * (1 - Math.exp(-real * 3));
  if (Math.abs(cam.dist - cam.layoutDist) > 0.01 || Math.abs(view.targetFrame().y - cam.layoutY) > 0.01) layoutGuns();
  placeCamera(time, view.shake, view.zoom);
  hud.update(real);
  hud.updateAnchor();
  composer.render(dt);

  saveT += real;
  if (saveT > 5) {
    saveT = 0;
    game.dailyCheck();
    save();
  }
}
renderer.setAnimationLoop(frame);

addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  clock.getDelta();
  if (document.hidden) save();
  else welcomeBack();
});

if (params.has('debug')) window.__tap = { game, view, hud, scene, camera, renderer, frame, save };

return {  };
})();
</script>
